plugins {
    id 'com.android.application'
}

android {
    namespace 'com.danz.straight'
    compileSdk 34

    defaultConfig {
        applicationId "com.danz.straight"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0-ANDRO11-SHIZUKU"

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -O3 -Wall -Wextra -fno-exceptions -fno-rtti"
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
