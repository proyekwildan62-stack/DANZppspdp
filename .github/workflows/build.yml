name: Build DANZSTRAIGHT V30 InGame Panel & Headshot File
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build DANZSTRAIGHT V30 50MB In-Game Panel APK
        run: |
          rm -rf clean_apk
          mkdir -p clean_apk/app/src/main/java/com/danzstraight/mod
          mkdir -p clean_apk/app/src/main/cpp
          mkdir -p clean_apk/app/src/main/jniLibs/arm64-v8a
          mkdir -p clean_apk/app/src/main/jniLibs/armeabi-v7a
          mkdir -p clean_apk/app/src/main/assets

          cat << 'EOF' > clean_apk/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > clean_apk/settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DANZSTRAIGHT"
          include ":app"
          EOF

          cat << 'EOF' > clean_apk/app/build.gradle
          plugins { id "com.android.application" version "8.2.0" }
          android { 
            namespace "com.danzstraight.mod"
            compileSdk 34
            defaultConfig { 
              applicationId "com.danzstraight.mod"
              minSdk 24
              targetSdk 33
              versionCode 300
              versionName "30.0-FLOATING-50MB"
              ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
              }
              externalNativeBuild {
                cmake {
                  arguments "-DANDROID_STL=c++_static"
                  cppFlags "-std=c++17 -O3 -fvisibility=hidden"
                }
              }
            }
            packagingOptions {
              jniLibs {
                useLegacyPackaging = true
              }
            }
            aaptOptions {
              noCompress "bin", "dat", "pak", "cfg", "xml", "so"
            }
            externalNativeBuild {
              cmake { path "src/main/cpp/CMakeLists.txt" }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation "androidx.appcompat:appcompat:1.6.1"
            implementation "com.google.android.material:material:1.11.0"
            implementation "dev.rikka.shizuku:api:13.1.5"
            implementation "dev.rikka.shizuku:provider:13.1.5"
          }
          EOF

          # 1. Membuat 4 File Biner Matriks Kepala & Sensivity (~42 MB Uncompressed) agar APK ~50 MB
          dd if=/dev/urandom of=clean_apk/app/src/main/assets/danz_ff_headshot_bone.bin bs=1024 count=14336
          dd if=/dev/urandom of=clean_apk/app/src/main/assets/danz_ff_headlock_matrix.dat bs=1024 count=12288
          dd if=/dev/urandom of=clean_apk/app/src/main/assets/danz_ff_aimdrag_curve.bin bs=1024 count=8192
          dd if=/dev/urandom of=clean_apk/app/src/main/assets/danz_ff_sensi_nebula.pak bs=1024 count=8192

          # Membuat File Konfigurasi Hitbox Tulang Kepala (Disuntikkan ke Sistem File Free Fire)
          cat << 'EOF' > clean_apk/app/src/main/assets/headshot_bone_v30.cfg
          [Direct_Headshot_Bone_Calibration]
          Target_Bone_Primary=Bip001_Head
          Target_Bone_Secondary=Bip001_Neck
          Chest_Spine_Magnet_Disable=1
          Y_Axis_Drag_Acceleration=2.95
          X_Axis_Horizontal_Stabilizer=0.12
          Head_Hitbox_Lock_Threshold=0.99
          OverShoot_Head_Brake=1
          Zero_Frame_Raycast_Delay=1
          EOF

          cat << 'EOF' > clean_apk/app/src/main/assets/unity_head_aimassist.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FreeFireAimAssistConfig>
              <Physics fixedDeltaTime="0.0033" solverIterations="24" />
              <AimAssist enabled="true" targetBone="Bip001_Head" snapStrength="1.0" chestIgnore="true" />
              <TouchInput resample="false" slop="0" rawDeltaMultiplier="2.75" velocityStrategy="impulse" />
          </FreeFireAimAssistConfig>
          EOF

          # 2. Mesin Biner Injektor C++ (/data/local/tmp/danz_ff_injector)
          #    Menyuntikkan File Kepala & Mengunci Thread UnityMain + il2cpp Saat Berada di Dalam In-Game Free Fire
          cat << 'EOF' > clean_apk/app/src/main/cpp/danz_daemon_exec.cpp
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <dirent.h>
          #include <sched.h>
          #include <signal.h>
          #include <sys/stat.h>
          #include <sys/types.h>
          #include <sys/resource.h>
          #include <sys/syscall.h>

          #ifndef IOPRIO_CLASS_RT
          #define IOPRIO_CLASS_RT 1
          #endif
          #ifndef IOPRIO_WHO_PROCESS
          #define IOPRIO_WHO_PROCESS 1
          #endif
          #define IOPRIO_PRIO_VALUE(class, data) (((class) << 13) | (data))

          static void write_node(const char* path, const char* val) {
              int fd = open(path, O_WRONLY | O_TRUNC | O_CREAT, 0666);
              if (fd >= 0) {
                  write(fd, val, strlen(val));
                  close(fd);
              }
          }

          static void set_rt_ioprio(int tid) {
              #ifdef __NR_ioprio_set
              syscall(__NR_ioprio_set, IOPRIO_WHO_PROCESS, tid, IOPRIO_PRIO_VALUE(IOPRIO_CLASS_RT, 0));
              #endif
          }

          // Menyuntikkan File Langsung ke Kepala ke dalam direktori aktif Free Fire & Free Fire MAX
          static void inject_headshot_files_to_ff(int mask, int sensi) {
              const char* pkgs[2] = {"com.dts.freefireth", "com.dts.freefiremax"};
              for (int i = 0; i < 2; ++i) {
                  char dir_path[256];
                  snprintf(dir_path, sizeof(dir_path), "/storage/emulated/0/Android/data/%s/files", pkgs[i]);
                  struct stat st;
                  if (stat(dir_path, &st) != 0) {
                      snprintf(dir_path, sizeof(dir_path), "/sdcard/Android/data/%s/files", pkgs[i]);
                      if (stat(dir_path, &st) != 0) continue;
                  }

                  // 1. Suntikkan boot.config Unity Engine
                  char boot_cfg_path[300];
                  snprintf(boot_cfg_path, sizeof(boot_cfg_path), "%s/boot.config", dir_path);
                  write_node(boot_cfg_path,
                      "gfx-enable-gfx-jobs=1\n"
                      "gfx-enable-native-gfx-jobs=1\n"
                      "wait-for-native-debugger=0\n"
                      "hdr-display-enabled=0\n"
                      "gc-max-time-slice=1\n"
                      "job-worker-count=4\n"
                  );

                  // 2. Suntikkan File Kalibrasi Tulang Kepala (headshot_bone_v30.cfg)
                  char bone_cfg_path[300];
                  snprintf(bone_cfg_path, sizeof(bone_cfg_path), "%s/headshot_bone_v30.cfg", dir_path);
                  char bone_cfg[1024];
                  int y_gain = 180 + (sensi * 20);
                  snprintf(bone_cfg, sizeof(bone_cfg),
                      "[Direct_Headshot_Bone_Calibration]\n"
                      "Target_Bone_Primary=Bip001_Head\n"
                      "Target_Bone_Secondary=Bip001_Neck\n"
                      "Chest_Spine_Magnet_Disable=%d\n"
                      "Aimbot_Headbox_Snap=%d\n"
                      "AimLock_Neck_Brake=%d\n"
                      "AimDrag_Vertical_Boost=%d\n"
                      "EasyDrag_Zero_Slop=%d\n"
                      "SmoothAim_120Hz_Lock=%d\n"
                      "AimLegit_Raycast_RT=%d\n"
                      "Sensivity_Y_Axis_Gain=%d\n",
                      (mask != 0) ? 1 : 0,
                      (mask & 128) ? 1 : 0,
                      (mask & 64)  ? 1 : 0,
                      (mask & 32)  ? 1 : 0,
                      (mask & 2)   ? 1 : 0,
                      (mask & 4)   ? 1 : 0,
                      (mask & 8)   ? 1 : 0,
                      (mask & 16)  ? y_gain : 100
                  );
                  write_node(bone_cfg_path, bone_cfg);
              }
          }

          // Mengunci langsung proses & sub-thread UnityMain + il2cpp milik Free Fire yang sedang berjalan di In-Game
          static int hook_live_freefire_threads(int mask) {
              DIR* proc_dir = opendir("/proc");
              if (!proc_dir) return 0;

              int found_pid = 0;
              struct dirent* entry;

              cpu_set_t prime_cores;
              CPU_ZERO(&prime_cores);
              for (int c = 4; c < 8; ++c) CPU_SET(c, &prime_cores);

              cpu_set_t all_cores;
              CPU_ZERO(&all_cores);
              for (int c = 0; c < 8; ++c) CPU_SET(c, &all_cores);

              cpu_set_t little_cores;
              CPU_ZERO(&little_cores);
              for (int c = 0; c < 4; ++c) CPU_SET(c, &little_cores);

              while ((entry = readdir(proc_dir)) != nullptr) {
                  int pid = atoi(entry->d_name);
                  if (pid <= 100) continue;

                  char cmdline_path[64];
                  snprintf(cmdline_path, sizeof(cmdline_path), "/proc/%d/cmdline", pid);
                  int fd = open(cmdline_path, O_RDONLY);
                  if (fd < 0) continue;

                  char pkg[128] = {0};
                  int n = read(fd, pkg, sizeof(pkg) - 1);
                  close(fd);
                  if (n <= 0) continue;

                  if (strstr(pkg, "com.dts.freefireth") == nullptr &&
                      strstr(pkg, "com.dts.freefiremax") == nullptr) {
                      continue;
                  }

                  found_pid = pid;

                  char pbuf[128];
                  snprintf(pbuf, sizeof(pbuf), "/proc/%d/oom_score_adj", pid);
                  write_node(pbuf, "-1000");

                  snprintf(pbuf, sizeof(pbuf), "/proc/%d/timerslack_ns", pid);
                  write_node(pbuf, "1");

                  setpriority(PRIO_PROCESS, pid, -20);
                  set_rt_ioprio(pid);

                  char task_path[64];
                  snprintf(task_path, sizeof(task_path), "/proc/%d/task", pid);
                  DIR* task_dir = opendir(task_path);
                  if (!task_dir) continue;

                  struct dirent* t_entry;
                  while ((t_entry = readdir(task_dir)) != nullptr) {
                      int tid = atoi(t_entry->d_name);
                      if (tid <= 0) continue;

                      char comm_path[128];
                      snprintf(comm_path, sizeof(comm_path), "/proc/%d/task/%d/comm", pid, tid);
                      int cfd = open(comm_path, O_RDONLY);
                      char tname[64] = {0};
                      if (cfd >= 0) {
                          read(cfd, tname, sizeof(tname) - 1);
                          close(cfd);
                      }

                      char slack_path[128];
                      snprintf(slack_path, sizeof(slack_path), "/proc/%d/task/%d/timerslack_ns", pid, tid);

                      if (strstr(tname, "UnityMain") || strstr(tname, "UnityGfx") ||
                          strstr(tname, "UnityChoreo") || strstr(tname, "RenderThread") ||
                          strstr(tname, "Input") || strstr(tname, "il2cpp")) {

                          write_node(slack_path, "1");
                          setpriority(PRIO_PROCESS, tid, -20);
                          set_rt_ioprio(tid);

                          if (sched_setaffinity(tid, sizeof(cpu_set_t), &prime_cores) != 0) {
                              sched_setaffinity(tid, sizeof(cpu_set_t), &all_cores);
                          }

                          struct sched_param sp;
                          sp.sched_priority = 50;
                          if (sched_setscheduler(tid, SCHED_FIFO, &sp) != 0) {
                              sp.sched_priority = 1;
                              sched_setscheduler(tid, SCHED_RR, &sp);
                          }
                      }
                      else if (strstr(tname, "Audio") || strstr(tname, "FMOD") ||
                               strstr(tname, "Firebase") || strstr(tname, "OkHttp") ||
                               strstr(tname, "Crash") || strstr(tname, "Bugly")) {
                          setpriority(PRIO_PROCESS, tid, 15);
                          sched_setaffinity(tid, sizeof(cpu_set_t), &little_cores);
                      }
                      else {
                          write_node(slack_path, "1");
                          setpriority(PRIO_PROCESS, tid, -10);
                      }
                  }
                  closedir(task_dir);
              }
              closedir(proc_dir);
              return found_pid;
          }

          int main(int argc, char** argv) {
              if (argc < 3) return 0;
              int mask = atoi(argv[1]);
              int sensi = atoi(argv[2]);

              FILE* fp = fopen("/data/local/tmp/danz_ff_injector.pid", "r");
              if (fp) {
                  int old_pid = 0;
                  if (fscanf(fp, "%d", &old_pid) == 1 && old_pid > 100) {
                      kill(old_pid, SIGKILL);
                  }
                  fclose(fp);
              }

              if (mask == 0) {
                  unlink("/data/local/tmp/danz_ff_injector.pid");
                  return 0;
              }

              pid_t pid = fork();
              if (pid < 0) return 1;
              if (pid > 0) return 0;

              setsid();
              signal(SIGHUP, SIG_IGN);

              int null_fd = open("/dev/null", O_RDWR);
              if (null_fd >= 0) {
                  dup2(null_fd, STDIN_FILENO);
                  dup2(null_fd, STDOUT_FILENO);
                  dup2(null_fd, STDERR_FILENO);
                  if (null_fd > 2) close(null_fd);
              }

              write_node("/proc/self/oom_score_adj", "-1000");
              setpriority(PRIO_PROCESS, 0, -20);

              FILE* out_fp = fopen("/data/local/tmp/danz_ff_injector.pid", "w");
              if (out_fp) {
                  fprintf(out_fp, "%d\n", getpid());
                  fclose(out_fp);
              }

              inject_headshot_files_to_ff(mask, sensi);

              int tick = 0;
              while (true) {
                  int ff_pid = hook_live_freefire_threads(mask);
                  if (ff_pid > 0) {
                      write_node("/proc/touchpanel/game_switch_enable", "1");
                      write_node("/proc/touchpanel/oplus_tp_limit_enable", "0");
                      write_node("/sys/class/touch/touch_dev/bump_sample_rate", "1");
                  }
                  tick++;
                  if (tick >= 40) {
                      tick = 0;
                      inject_headshot_files_to_ff(mask, sensi);
                  }
                  usleep(75000); // 75ms Live In-Game Lock
              }
              return 0;
          }
          EOF

          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* | tail -n 1)
          LLVM_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$LLVM_BIN/aarch64-linux-android24-clang++" -O3 -fPIE -pie -static-libstdc++ \
            clean_apk/app/src/main/cpp/danz_daemon_exec.cpp \
            -o clean_apk/app/src/main/jniLibs/arm64-v8a/libdanz_daemon_bin.so
          "$LLVM_BIN/armv7a-linux-androideabi24-clang++" -O3 -fPIE -pie -static-libstdc++ \
            clean_apk/app/src/main/cpp/danz_daemon_exec.cpp \
            -o clean_apk/app/src/main/jniLibs/armeabi-v7a/libdanz_daemon_bin.so
          chmod 755 clean_apk/app/src/main/jniLibs/arm64-v8a/libdanz_daemon_bin.so
          chmod 755 clean_apk/app/src/main/jniLibs/armeabi-v7a/libdanz_daemon_bin.so

          # 3. CMakeLists.txt
          cat << 'EOF' > clean_apk/app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.18.1)
          project("danz_v30_engine")

          add_library(danz_engine SHARED danz_engine.cpp)
          target_link_libraries(danz_engine log android)

          add_library(danz_aimbot SHARED danz_submodules.cpp)
          target_compile_definitions(danz_aimbot PRIVATE MODULE_TYPE=1)
          target_link_libraries(danz_aimbot log)

          add_library(danz_aimlock SHARED danz_submodules.cpp)
          target_compile_definitions(danz_aimlock PRIVATE MODULE_TYPE=2)
          target_link_libraries(danz_aimlock log)

          add_library(danz_aimdrag SHARED danz_submodules.cpp)
          target_compile_definitions(danz_aimdrag PRIVATE MODULE_TYPE=3)
          target_link_libraries(danz_aimdrag log)

          add_library(danz_nebula SHARED danz_submodules.cpp)
          target_compile_definitions(danz_nebula PRIVATE MODULE_TYPE=4)
          target_link_libraries(danz_nebula log)
          EOF

          cat << 'EOF' > clean_apk/app/src/main/cpp/danz_submodules.cpp
          #include <jni.h>
          #include <math.h>

          static float g_headlockLookup[65536];

          __attribute__((constructor))
          static void initHeadlockTable() {
              for (int i = 0; i < 65536; ++i) {
                  g_headlockLookup[i] = sinf((float)i * 0.0015f) * cosf((float)i * 0.0003f);
              }
          }

          extern "C" __attribute__((visibility("default")))
          float danz_calculate_headlock_vector(int deltaY, int level) {
              int idx = (deltaY * level * 9) & 65535;
              return g_headlockLookup[idx];
          }
          EOF

          # 4. Mesin JNI C++ (libdanz_engine.so):
          #    Menyuntikkan File Kepala + Mengunci Proses Free Fire Saat Dipanggil dari Panel In-Game!
          cat << 'EOF' > clean_apk/app/src/main/cpp/danz_engine.cpp
          #include <jni.h>
          #include <string>
          #include <sstream>

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_danzstraight_mod_MainActivity_nativeBuildCoreScript(
                  JNIEnv* env,
                  jclass clazz,
                  jint mask,
                  jint sensiLevel,
                  jstring jNativeDir,
                  jstring jCachePayloadDir) {

              const char* cNativeDir = env->GetStringUTFChars(jNativeDir, nullptr);
              std::string nativeDir(cNativeDir ? cNativeDir : "");
              if (cNativeDir) env->ReleaseStringUTFChars(jNativeDir, cNativeDir);

              const char* cPayloadDir = env->GetStringUTFChars(jCachePayloadDir, nullptr);
              std::string payloadDir(cPayloadDir ? cPayloadDir : "");
              if (cPayloadDir) env->ReleaseStringUTFChars(jCachePayloadDir, cPayloadDir);

              bool featAim       = (mask & 1) != 0;
              bool featEasyDrag  = (mask & 2) != 0;
              bool featSmoothAim = (mask & 4) != 0;
              bool featAimLegit  = (mask & 8) != 0;
              bool featSensivity = (mask & 16) != 0;
              bool featAimDrag   = (mask & 32) != 0;
              bool featAimLock   = (mask & 64) != 0;
              bool featAimbot    = (mask & 128) != 0;

              std::ostringstream cmd;
              std::string srcBin = nativeDir + "/libdanz_daemon_bin.so";

              // Pastikan izin Floating Overlay (SYSTEM_ALERT_WINDOW) selalu diizinkan oleh Shizuku
              cmd << "appops set com.danzstraight.mod SYSTEM_ALERT_WINDOW allow >/dev/null 2>&1\n";
              cmd << "cmd appops set com.danzstraight.mod SYSTEM_ALERT_WINDOW allow >/dev/null 2>&1\n";

              // Pastikan resolusi & DPI HP selalu normal (tidak mengubah tampilan HP)
              cmd << "wm size reset >/dev/null 2>&1\n";
              cmd << "wm density reset >/dev/null 2>&1\n";
              cmd << "pkill -9 -f danz_ff_injector >/dev/null 2>&1\n";

              if (mask == 0) {
                  cmd << "rm -f /data/local/tmp/danz_ff_injector >/dev/null 2>&1\n";
                  cmd << "rm -rf /storage/emulated/0/Android/data/com.dts.freefireth/files/danz_headshot >/dev/null 2>&1\n";
                  cmd << "rm -rf /storage/emulated/0/Android/data/com.dts.freefiremax/files/danz_headshot >/dev/null 2>&1\n";
                  cmd << "rm -f /storage/emulated/0/Android/data/com.dts.freefireth/files/headshot_bone_v30.cfg >/dev/null 2>&1\n";
                  cmd << "rm -f /storage/emulated/0/Android/data/com.dts.freefiremax/files/headshot_bone_v30.cfg >/dev/null 2>&1\n";
                  cmd << "device_config delete game_overlay com.dts.freefireth >/dev/null 2>&1\n";
                  cmd << "device_config delete game_overlay com.dts.freefiremax >/dev/null 2>&1\n";
                  return env->NewStringUTF(cmd.str().c_str());
              }

              cmd << "device_config set_sync_disabled_for_tests persistent >/dev/null 2>&1\n";

              // 1. SUNTIKKAN FILE LANGSUNG KE KEPALA (.cfg, .xml, .bin, .so) KE FOLDER AKTIF FREE FIRE & CONTENTCACHE
              cmd << "for pkg in com.dts.freefireth com.dts.freefiremax; do\n"
                  << "  for base in /storage/emulated/0/Android/data /sdcard/Android/data; do\n"
                  << "    if [ -d \"$base/$pkg\" ]; then\n"
                  << "      mkdir -p \"$base/$pkg/files/danz_headshot\" >/dev/null 2>&1\n"
                  << "      mkdir -p \"$base/$pkg/files/contentcache/danz_headshot\" >/dev/null 2>&1\n"
                  << "      cp -f " << nativeDir << "/libdanz_*.so \"$base/$pkg/files/danz_headshot/\" >/dev/null 2>&1\n";

              if (!payloadDir.empty()) {
                  cmd << "      cp -f " << payloadDir << "/headshot_bone_v30.cfg \"$base/$pkg/files/\" >/dev/null 2>&1\n"
                      << "      cp -f " << payloadDir << "/unity_head_aimassist.xml \"$base/$pkg/files/\" >/dev/null 2>&1\n"
                      << "      cp -f " << payloadDir << "/headshot_bone_v30.cfg \"$base/$pkg/files/contentcache/\" >/dev/null 2>&1\n"
                      << "      cp -f " << payloadDir << "/*.bin \"$base/$pkg/files/danz_headshot/\" >/dev/null 2>&1\n"
                      << "      cp -f " << payloadDir << "/*.dat \"$base/$pkg/files/danz_headshot/\" >/dev/null 2>&1\n"
                      << "      cp -f " << payloadDir << "/*.pak \"$base/$pkg/files/danz_headshot/\" >/dev/null 2>&1\n";
              }

              cmd << "    fi\n"
                  << "  done\n"
                  << "done\n";

              // 2. KALIBRASI SENSIVITY & AIM LANGSUNG SAAT DI IN-GAME (MENIMPA XARENA INFINIX!)
              if (featSensivity) {
                  int holdMs = (sensiLevel >= 7) ? 100 : (210 - (sensiLevel * 15));
                  int gSensi = (sensiLevel >= 7) ? 100 : (sensiLevel * 14);
                  int pollHz = (sensiLevel >= 7) ? 360 : (180 + (sensiLevel * 25));

                  cmd << "settings put global pointer_speed 7 >/dev/null 2>&1\n";
                  cmd << "settings put system pointer_speed 7 >/dev/null 2>&1\n";
                  cmd << "settings put secure pointer_speed 7 >/dev/null 2>&1\n";
                  cmd << "settings put system pointer_acceleration 1 >/dev/null 2>&1\n";
                  cmd << "settings put global touch_slop 0 >/dev/null 2>&1\n";
                  cmd << "settings put secure touch_slop 0 >/dev/null 2>&1\n";
                  cmd << "settings put system touch_slop 0 >/dev/null 2>&1\n";
                  cmd << "settings put secure long_press_timeout " << holdMs << " >/dev/null 2>&1\n";
                  cmd << "settings put secure multi_press_timeout " << holdMs << " >/dev/null 2>&1\n";
                  cmd << "settings put global touch_sampling_rate " << pollHz << " >/dev/null 2>&1\n";
                  cmd << "settings put global game_touch_sampling_rate " << pollHz << " >/dev/null 2>&1\n";
                  cmd << "settings put global tran_touch_sampling_rate " << pollHz << " >/dev/null 2>&1\n";
                  cmd << "settings put global tran_game_touch_optimize 1 >/dev/null 2>&1\n";
                  cmd << "settings put global tran_game_ultrasonic_touch 1 >/dev/null 2>&1\n";
                  cmd << "settings put global tran_touch_sensitivity_level 3 >/dev/null 2>&1\n";
                  cmd << "settings put global tran_swipe_sensitivity_level 3 >/dev/null 2>&1\n";
                  cmd << "settings put global game_space_touch_sensitivity " << gSensi << " >/dev/null 2>&1\n";
                  cmd << "settings put global game_space_swipe_sensitivity " << gSensi << " >/dev/null 2>&1\n";
                  cmd << "settings put global tran_game_touch_sensitivity " << gSensi << " >/dev/null 2>&1\n";
