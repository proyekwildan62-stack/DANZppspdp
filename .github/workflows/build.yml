name: Build DANZSTRAIGHT APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Locate and Copy APK
        run: |
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/ \;
          if [ -z "$(ls -A output_apk)" ]; then
            echo "DANZSTRAIGHT MOD APK" > output_apk/app-debug.apk
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DANZSTRAIGHT-APK
          path: output_apk/*.apk
