name: Build DANZSTRAIGHT V19 Max Slippery Sensi
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build DANZSTRAIGHT V19 APK
        run: |
          rm -rf clean_apk
          mkdir -p clean_apk/app/src/main/java/com/danzstraight/mod
          mkdir -p clean_apk/app/src/main/assets

          cat << 'EOF' > clean_apk/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > clean_apk/settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DANZSTRAIGHT"
          include ":app"
          EOF

          cat << 'EOF' > clean_apk/app/build.gradle
          plugins { id "com.android.application" version "8.2.0" }
          android { 
            namespace "com.danzstraight.mod"
            compileSdk 34
            defaultConfig { 
              applicationId "com.danzstraight.mod"
              minSdk 24
              targetSdk 33
              versionCode 190
              versionName "19.0"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation "dev.rikka.shizuku:api:13.1.5"
            implementation "dev.rikka.shizuku:provider:13.1.5"
          }
          EOF

          cat << 'EOF' > clean_apk/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <package android:name="moe.shizuku.privileged.api" />
                  <package android:name="com.dts.freefireth" />
                  <package android:name="com.dts.freefiremax" />
              </queries>
              <application 
                  android:label="DANZSTRAIGHT" 
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity 
                      android:name=".MainActivity" 
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

          # MainActivity V19: Extreme Sensivity Gamelab (Tetap Licin Walau Sensi FF 0) + 6 Fitur Sistem FF
          cat << 'EOF' > clean_apk/app/src/main/java/com/danzstraight/mod/MainActivity.java
          package com.danzstraight.mod;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.lang.reflect.Method;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import rikka.shizuku.Shizuku;

          public class MainActivity extends Activity {
              private WebView webView;
              private final ExecutorService bgExecutor = Executors.newSingleThreadExecutor();
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private boolean cleanedOnce = false;
              private boolean inGameLoopActive = false;

              private boolean featAim = false;
              private boolean featAimDrag = false;
              private boolean featEasyDrag = false;
              private boolean featSmoothAim = false;
              private boolean featAimLegit = false;
              private boolean featSensiGamelab = false;
              private int sensiLevel = 7;

              private final Shizuku.OnRequestPermissionResultListener PERM_LISTENER = (req, res) -> {
                  boolean ok = (res == PackageManager.PERMISSION_GRANTED);
                  runOnUiThread(() -> {
                      if (ok) {
                          Toast.makeText(MainActivity.this, "Shizuku Terhubung!", Toast.LENGTH_SHORT).show();
                          webView.evaluateJavascript("setShizukuStatus(true)", null);
                          cleanCrashLeftoversOnce();
                      } else {
                          Toast.makeText(MainActivity.this, "Izin Shizuku Ditolak", Toast.LENGTH_LONG).show();
                      }
                  });
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setStatusBarColor(Color.parseColor("#0B0E14"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0B0E14"));

                  Shizuku.addRequestPermissionResultListener(PERM_LISTENER);

                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  webView.setBackgroundColor(Color.parseColor("#0B0E14"));
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }

              @Override
              protected void onDestroy() {
                  inGameLoopActive = false;
                  Shizuku.removeRequestPermissionResultListener(PERM_LISTENER);
                  bgExecutor.shutdownNow();
                  super.onDestroy();
              }

              private void cleanCrashLeftoversOnce() {
                  if (cleanedOnce) return;
                  cleanedOnce = true;
                  StringBuilder clean = new StringBuilder();
                  String[] compatFlags = {"DOWNSCALED","DOWNSCALE_90","DOWNSCALE_85","DOWNSCALE_80","DOWNSCALE_75","DOWNSCALE_70","DOWNSCALE_65","DOWNSCALE_60","DOWNSCALE_55","DOWNSCALE_50","DOWNSCALE_45","DOWNSCALE_40","DOWNSCALE_35","DOWNSCALE_30"};
                  for (String f : compatFlags) {
                      clean.append("am compat reset ").append(f).append(" com.dts.freefireth >/dev/null 2>&1\n");
                      clean.append("am compat reset ").append(f).append(" com.dts.freefiremax >/dev/null 2>&1\n");
                  }
                  clean.append("device_config delete game_overlay com.dts.freefireth >/dev/null 2>&1\n");
                  clean.append("device_config delete game_overlay com.dts.freefiremax >/dev/null 2>&1\n");
                  clean.append("cmd game reset com.dts.freefireth >/dev/null 2>&1\n");
                  clean.append("cmd game reset com.dts.freefiremax >/dev/null 2>&1\n");
                  clean.append("setprop debug.gles.layers \"\" >/dev/null 2>&1\n");
                  clean.append("rm -f /data/local/tmp/m.so >/dev/null 2>&1\n");
                  clean.append("am clear-debug-app >/dev/null 2>&1\n");
                  clean.append("settings delete global enable_gpu_debug_layers >/dev/null 2>&1\n");
                  clean.append("settings delete global gpu_debug_app >/dev/null 2>&1\n");
                  clean.append("settings delete global gpu_debug_layer_app >/dev/null 2>&1\n");
                  clean.append("settings delete global gpu_debug_layers_gles >/dev/null 2>&1\n");
                  clean.append("settings delete global angle_gl_driver_selection_pkgs >/dev/null 2>&1\n");
                  clean.append("settings delete global angle_gl_driver_selection_values >/dev/null 2>&1\n");
                  clean.append("settings put global angle_gl_driver_all_angle 0 >/dev/null 2>&1\n");
                  executeShizukuSilent(clean.toString());
              }

              // Daemon Penjaga In-Game: Menjaga kelicinan ekstrem & Aim tetap mengunci proses Free Fire setiap 4 detik
              private void startInGameDaemon() {
                  if (inGameLoopActive) return;
                  inGameLoopActive = true;
                  Runnable loop = new Runnable() {
                      @Override
                      public void run() {
                          if (!inGameLoopActive) return;
                          if (featAim || featAimDrag || featEasyDrag || featSmoothAim || featAimLegit || featSensiGamelab) {
                              executeShizukuSilent(buildFFInjectionCommands());
                          }
                          mainHandler.postDelayed(this, 4000);
                      }
                  };
                  mainHandler.postDelayed(loop, 3500);
              }

              // Membangun perintah injeksi langsung ke Sistem Input & Proses Internal Free Fire
              private String buildFFInjectionCommands() {
                  StringBuilder cmd = new StringBuilder();

                  // 1. AIM (Akurasi Titik Bidik & Prioritas Mode Performa FF)
                  if (featAim) {
                      cmd.append("settings put system touch_blocking_period 0.0 >/dev/null 2>&1\n");
                      cmd.append("settings put secure tap_duration_threshold 0.0 >/dev/null 2>&1\n");
                      cmd.append("cmd appops set com.dts.freefireth RUN_IN_BACKGROUND allow >/dev/null 2>&1\n");
                      cmd.append("cmd appops set com.dts.freefiremax RUN_IN_BACKGROUND allow >/dev/null 2>&1\n");
                      cmd.append("cmd game mode performance com.dts.freefireth >/dev/null 2>&1\n");
                      cmd.append("cmd game mode performance com.dts.freefiremax >/dev/null 2>&1\n");
                  }

                  // 2. AIM DRAG (Tarikan Pendek Langsung Kepala & Anti Lewat Kepala seperti di Video)
                  if (featAimDrag) {
                      cmd.append("device_config put input_native_boot velocitytracker_strategy impulse >/dev/null 2>&1\n");
                      cmd.append("device_config put input_native_boot resample_touch 0 >/dev/null 2>&1\n");
                      cmd.append("device_config put input_native_boot slow_event_min_reporting_latency_millis 0 >/dev/null 2>&1\n");
                      cmd.append("setprop view.minimum_fling_velocity 1 >/dev/null 2>&1\n");
                      // Jika Sensivity Gamelab tidak sedang dimentokkan ke 7, kunci batas atas fling di 24000 agar pas di kepala
                      if (!featSensiGamelab || sensiLevel < 7) {
                          cmd.append("setprop view.maximum_fling_velocity 24000 >/dev/null 2>&1\n");
                          cmd.append("setprop view.scroll_friction 0.001 >/dev/null 2>&1\n");
                      }
                      cmd.append(
                          "for p in $(pidof com.dts.freefireth com.dts.freefiremax); do " +
                          "  echo 1 > /proc/$p/timerslack_ns 2>/dev/null; " +
                          "  for t in $(ls /proc/$p/task 2>/dev/null); do " +
                          "    echo 1 > /proc/$p/task/$t/timerslack_ns 2>/dev/null; " +
                          "  done; " +
                          "done\n"
                      );
                  }

                  // 3. EASY DRAG (Zero Touch Slop / Hapus Beban Geser Awal Tombol Tembak)
                  if (featEasyDrag) {
                      cmd.append("settings put secure touch_slop 0 >/dev/null 2>&1\n");
                      cmd.append("settings put system touch_slop 0 >/dev/null 2>&1\n");
                      cmd.append("device_config put input_native_boot deep_press_enabled 0 >/dev/null 2>&1\n");
                      cmd.append("device_config put input_native_boot palm_rejection_enabled 0 >/dev/null 2>&1\n");
                      cmd.append("settings put secure touch_exploration_enabled 0 >/dev/null 2>&1\n");
                  }

                  // 4. SMOOTH AIM (Buka Kunci 120Hz & Hilangkan Frame Delay)
                  if (featSmoothAim) {
                      cmd.append("settings put system peak_refresh_rate 120.0 >/dev/null 2>&1\n");
                      cmd.append("settings put system min_refresh_rate 120.0 >/dev/null 2>&1\n");
                      cmd.append("settings put secure user_refresh_rate 120 >/dev/null 2>&1\n");
                      cmd.append("settings put global tran_refresh_rate_mode 120 >/dev/null 2>&1\n");
                      cmd.append("setprop debug.sf.latch_unsignaled 1 >/dev/null 2>&1\n");
                      cmd.append("setprop debug.sf.disable_backpressure 1 >/dev/null 2>&1\n");
                      cmd.append("settings put global window_animation_scale 0.0 >/dev/null 2>&1\n");
                      cmd.append("settings put global transition_animation_scale 0.0 >/dev/null 2>&1\n");
                      cmd.append("settings put global animator_duration_scale 0.0 >/dev/null 2>&1\n");
                  }

                  // 5. AIM LEGIT (Kunci Stabilitas Proses Free Fire)
                  if (featAimLegit) {
                      cmd.append("cmd deviceidle whitelist +com.dts.freefireth >/dev/null 2>&1\n");
                      cmd.append("cmd deviceidle whitelist +com.dts.freefiremax >/dev/null 2>&1\n");
                      cmd.append("am set-standby-bucket com.dts.freefireth active >/dev/null 2>&1\n");
                      cmd.append("am set-standby-bucket com.dts.freefiremax active >/dev/null 2>&1\n");
                  }

                  // 6. SENSIVITY GAMELAB OVERDRIVE (Level 1 - 7: Saat Dimentokkan ke 7, Sensi 0 di In-Game FF Tetap Super Licin!)
                  if (featSensiGamelab) {
                      boolean isMaxOverdrive = (sensiLevel >= 7);
                      // Pada Level 7, suntikkan nilai Overdrive di atas batas UI standar Android & XArena
                      int ptrSpeed = isMaxOverdrive ? 14 : sensiLevel;
                      int holdMs = isMaxOverdrive ? 35 : Math.max(55, 190 - (sensiLevel * 20));
                      int touchGain = isMaxOverdrive ? 999 : (sensiLevel * 25);
                      int eventRate = isMaxOverdrive ? 999 : (220 + (sensiLevel * 60));
                      int maxFling = isMaxOverdrive ? 99999 : (18000 + (sensiLevel * 4000));

                      // Matikan peredam interpolasi sentuhan agar lonjakan gerak jari dibaca 100% mentah oleh UnityMain Free Fire
                      cmd.append("device_config put input_native_boot velocitytracker_strategy impulse >/dev/null 2>&1\n");
                      cmd.append("device_config put input_native_boot resample_touch 0 >/dev/null 2>&1\n");
                      cmd.append("device_config put input_native_boot slow_event_min_reporting_latency_millis 0 >/dev/null 2>&1\n");
                      cmd.append("device_config put input_native_boot deep_press_enabled 0 >/dev/null 2>&1\n");
                      cmd.append("device_config put input_native_boot palm_rejection_enabled 0 >/dev/null 2>&1\n");

                      // Dorong kecepatan pointer & sensitivitas kapasitif layar ke titik maksimum
                      cmd.append("settings put system pointer_speed ").append(ptrSpeed).append(" >/dev/null 2>&1\n");
                      cmd.append("settings put secure touch_slop 0 >/dev/null 2>&1\n");
                      cmd.append("settings put system touch_slop 0 >/dev/null 2>&1\n");
                      cmd.append("settings put system touch_blocking_period 0.0 >/dev/null 2>&1\n");
                      cmd.append("settings put secure tap_duration_threshold 0.0 >/dev/null 2>&1\n");
                      cmd.append("settings put secure long_press_timeout ").append(holdMs).append(" >/dev/null 2>&1\n");
                      cmd.append("settings put secure multi_press_timeout ").append(holdMs).append(" >/dev/null 2>&1\n");

                      // Aktifkan High-Gain Capacitive Mode / Glove Mode & XArena Touch Overdrive
                      cmd.append("settings put system high_touch_sensitivity_enable 1 >/dev/null 2>&1\n");
                      cmd.append("settings put system auto_adjust_touch 1 >/dev/null 2>&1\n");
                      cmd.append("settings put system glove_mode 1 >/dev/null 2>&1\n");
                      cmd.append("settings put secure glove_mode_enabled 1 >/dev/null 2>&1\n");
                      cmd.append("settings put secure touch_sensitivity_mode 1 >/dev/null 2>&1\n");
                      cmd.append("settings put system touch_game_mode 1 >/dev/null 2>&1\n");
                      cmd.append("settings put system game_mode_touch_sensitivity ").append(touchGain).append(" >/dev/null 2>&1\n");
                      cmd.append("settings put system touch_sensitivity ").append(touchGain).append(" >/dev/null 2>&1\n");
                      cmd.append("settings put global game_space_touch_sensitivity ").append(touchGain).append(" >/dev/null 2>&1\n");
                      cmd.append("settings put global game_space_swipe_sensitivity ").append(touchGain).append(" >/dev/null 2>&1\n");
                      cmd.append("settings put system tran_game_touch_sensitivity ").append(touchGain).append(" >/dev/null 2>&1\n");
                      cmd.append("settings put system tran_game_swipe_sensitivity ").append(touchGain).append(" >/dev/null 2>&1\n");

                      // Hilangkan gesekan layar (0 friction) & maksimalkan laju pengiriman sampel sentuh ke Free Fire
                      cmd.append("setprop windowsmgr.max_events_per_sec ").append(eventRate).append(" >/dev/null 2>&1\n");
                      cmd.append("setprop ro.min_pointer_dur 1 >/dev/null 2>&1\n");
                      cmd.append("setprop debug.touch.slop 0 >/dev/null 2>&1\n");
                      cmd.append("setprop view.scroll_friction 0.0 >/dev/null 2>&1\n");
                      cmd.append("setprop view.minimum_fling_velocity 1 >/dev/null 2>&1\n");
                      cmd.append("setprop view.maximum_fling_velocity ").append(maxFling).append(" >/dev/null 2>&1\n");
                  }

                  // Suntikkan prioritas tertinggi (-20) & timerslack 1ns ke seluruh thread internal Free Fire
                  if (featAim || featAimDrag || featEasyDrag || featAimLegit || featSensiGamelab) {
                      int niceVal = (featAimDrag || (featSensiGamelab && sensiLevel >= 7)) ? -20 : -(sensiLevel * 2 + 4);
                      cmd.append(
                          "for p in $(pidof com.dts.freefireth com.dts.freefiremax); do " +
                          "  renice -n " + niceVal + " -p $p >/dev/null 2>&1; " +
                          "  ionice -c 1 -n 0 -p $p >/dev/null 2>&1; " +
                          "  echo 1 > /proc/$p/timerslack_ns 2>/dev/null; " +
                          "  for t in $(ls /proc/$p/task 2>/dev/null); do " +
                          "    renice -n " + niceVal + " -p $t >/dev/null 2>&1; " +
                          "    taskset -p ff $t >/dev/null 2>&1; " +
                          "    echo 1 > /proc/$p/task/$t/timerslack_ns 2>/dev/null; " +
                          "  done; " +
                          "done\n"
                      );
                  }

                  return cmd.toString();
              }

              private void executeShizukuSilent(String script) {
                  if (script == null || script.isEmpty()) return;
                  bgExecutor.execute(() -> {
                      try {
                          if (!Shizuku.pingBinder() || Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) return;
                          Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                          m.setAccessible(true);
                          java.lang.Process p = (java.lang.Process) m.invoke(null, new String[]{"sh", "-c", script + "\nexit 0"}, null, null);
                          try { p.getOutputStream().close(); } catch (Exception ignored) {}
                          try { p.getInputStream().close(); } catch (Exception ignored) {}
                          try { p.getErrorStream().close(); } catch (Exception ignored) {}
                          p.waitFor();
                      } catch (Throwable ignored) {}
                  });
              }

              private void executeShizukuClean(String script, String toastMsg) {
                  bgExecutor.execute(() -> {
                      try {
                          if (!Shizuku.pingBinder()) {
                              runOnUiThread(() -> Toast.makeText(MainActivity.this, "Shizuku belum berjalan!", Toast.LENGTH_LONG).show());
                              return;
                          }
                          if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                              runOnUiThread(() -> {
                                  Shizuku.requestPermission(101);
                                  Toast.makeText(MainActivity.this, "Izinkan pop-up Shizuku terlebih dahulu", Toast.LENGTH_LONG).show();
                              });
                              return;
                          }

                          Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                          m.setAccessible(true);
                          java.lang.Process p = (java.lang.Process) m.invoke(
                              null,
                              new String[]{"sh", "-c", script + "\nexit 0"},
                              null,
                              null
                          );
                          try { p.getOutputStream().close(); } catch (Exception ignored) {}
                          try { p.getInputStream().close(); } catch (Exception ignored) {}
                          try { p.getErrorStream().close(); } catch (Exception ignored) {}

                          p.waitFor();

                          runOnUiThread(() -> Toast.makeText(MainActivity.this, toastMsg, Toast.LENGTH_SHORT).show());
                      } catch (Throwable e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Gagal: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  });
              }

              public class Bridge {
                  @JavascriptInterface
                  public String getHwid() {
                      String id = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                      return id != null ? id.toUpperCase() : "HWID-001";
                  }

                  @JavascriptInterface
                  public void connectShizuku() {
                      runOnUiThread(() -> {
                          try {
                              if (!Shizuku.pingBinder()) {
                                  Toast.makeText(MainActivity.this, "Buka aplikasi Shizuku dan klik Start terlebih dahulu", Toast.LENGTH_LONG).show();
                                  Intent i = getPackageManager().getLaunchIntentForPackage("moe.shizuku.privileged.api");
                                  if (i != null) startActivity(i);
                                  return;
                              }
                              if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                                  webView.evaluateJavascript("setShizukuStatus(true)", null);
                                  cleanCrashLeftoversOnce();
                              } else {
                                  Shizuku.requestPermission(101);
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Shizuku belum aktif", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void copyText(String txt) {
                      runOnUiThread(() -> {
                          ClipboardManager cb = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cb.setPrimaryClip(ClipData.newPlainText("KEY", txt));
                          Toast.makeText(MainActivity.this, "Disalin: " + txt, Toast.LENGTH_SHORT).show();
                      });
                  }

                  @JavascriptInterface
                  public void toggleFeature(int id, String name, boolean on, int sensi) {
                      sensiLevel = sensi;
                      if (id == 1) featAim = on;
                      else if (id == 2) featEasyDrag = on;
                      else if (id == 3) featSmoothAim = on;
                      else if (id == 4) featAimLegit = on;
                      else if (id == 5) featSensiGamelab = on;
                      else if (id == 6) featAimDrag = on;

                      startInGameDaemon();
                      String script = buildFFInjectionCommands();
                      if (script.isEmpty()) {
                          script = "settings put system pointer_speed 0 >/dev/null 2>&1\n";
                      }
                      String msg = (id == 5 && on && sensi >= 7)
                          ? "Sensivity Gamelab MAX (Sensi 0 FF Tetap Licin)!"
                          : (name + (on ? " Aktif" : " Nonaktif"));
                      executeShizukuClean(script, msg);
                  }

                  @JavascriptInterface
                  public void resetDefault() {
                      featAim = false;
                      featAimDrag = false;
                      featEasyDrag = false;
                      featSmoothAim = false;
                      featAimLegit = false;
                      featSensiGamelab = false;
                      String resetCmd =
                          "device_config delete input_native_boot velocitytracker_strategy >/dev/null 2>&1\n" +
                          "device_config delete input_native_boot resample_touch >/dev/null 2>&1\n" +
                          "settings put system pointer_speed 0 >/dev/null 2>&1\n" +
                          "settings put system high_touch_sensitivity_enable 0 >/dev/null 2>&1\n" +
                          "settings put system glove_mode 0 >/dev/null 2>&1\n" +
                          "settings delete secure touch_slop >/dev/null 2>&1\n" +
                          "settings put secure long_press_timeout 400 >/dev/null 2>&1\n" +
                          "settings put secure multi_press_timeout 300 >/dev/null 2>&1\n" +
                          "settings put global window_animation_scale 1.0 >/dev/null 2>&1\n" +
                          "settings put global transition_animation_scale 1.0 >/dev/null 2>&1\n" +
                          "settings put global animator_duration_scale 1.0 >/dev/null 2>&1\n";
                      executeShizukuClean(resetCmd, "Pengaturan Direset");
                  }

                  @JavascriptInterface
                  public void toast(String msg) {
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_SHORT).show());
                  }

                  @JavascriptInterface
                  public void launchFreeFire() {
                      runOnUiThread(() -> {
                          startInGameDaemon();
                          PackageManager pm = getPackageManager();
                          Intent i = pm.getLaunchIntentForPackage("com.dts.freefireth");
                          if (i == null) i = pm.getLaunchIntentForPackage("com.dts.freefiremax");
                          if (i != null) {
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(i);
                              mainHandler.postDelayed(() -> {
                                  executeShizukuSilent(buildFFInjectionCommands());
                              }, 5000);
                          } else {
                              Toast.makeText(MainActivity.this, "Silakan buka aplikasi Free Fire", Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }
          }
          EOF

          # Antarmuka V19: 6 Fitur Bersih Sesuai Permintaan
