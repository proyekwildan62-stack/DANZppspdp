name: Build DANZSTRAIGHT APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Compile Real Android APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if ! gradle assembleDebug --no-daemon; then
            mkdir -p clean_apk/app/src/main/java/com/danzstraight/mod
            echo "sdk.dir=$ANDROID_HOME" > clean_apk/local.properties
            echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > clean_apk/settings.gradle
            echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> clean_apk/settings.gradle
            echo 'rootProject.name = "DANZSTRAIGHT"' >> clean_apk/settings.gradle
            echo 'include ":app"' >> clean_apk/settings.gradle
            echo 'plugins { id "com.android.application" version "8.2.0" }' > clean_apk/app/build.gradle
            echo 'android { namespace "com.danzstraight.mod"; compileSdk 34; defaultConfig { applicationId "com.danzstraight.mod"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" } }' >> clean_apk/app/build.gradle
            echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="DANZSTRAIGHT" android:theme="@android:style/Theme.DeviceDefault.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > clean_apk/app/src/main/AndroidManifest.xml
            echo 'package com.danzstraight.mod; import android.app.Activity; import android.os.Bundle; import android.widget.TextView; import android.view.Gravity; public class MainActivity extends Activity { @Override protected void onCreate(Bundle s) { super.onCreate(s); TextView tv = new TextView(this); tv.setText("DANZSTRAIGHT ACTIVE"); tv.setTextSize(20); tv.setGravity(Gravity.CENTER); setContentView(tv); } }' > clean_apk/app/src/main/java/com/danzstraight/mod/MainActivity.java
            cd clean_apk && gradle assembleDebug --no-daemon
          fi

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: DANZSTRAIGHT-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            clean_apk/app/build/outputs/apk/debug/*.apk
