          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
          <style>
            :root {
              --bg: #0B0E14;
              --card: #131822;
              --card-2: #1A212E;
              --border: #263042;
              --accent: #00E5FF;
              --accent-glow: rgba(0, 229, 255, 0.22);
              --green: #00E676;
              --text: #F0F6FC;
              --muted: #8B949E;
              --danger: #FF3B30;
            }
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, Roboto, sans-serif; user-select: none; }
            body { background: var(--bg); color: var(--text); padding: 14px; padding-bottom: 84px; }
            .hidden { display: none !important; }

            .login-wrap { position: fixed; inset: 0; background: var(--bg); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 18px; }
            .login-box { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
            .brand-title { font-size: 20px; font-weight: 900; letter-spacing: 0.5px; }
            .brand-title span { color: var(--accent); }
            .brand-sub { font-size: 11px; color: var(--muted); margin: 4px 0 16px; }
            .box-inner { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
            .row-sb { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 8px; }
            .pill { font-size: 11px; padding: 3px 9px; border-radius: 20px; background: #331B1B; color: var(--danger); font-weight: 700; }
            .pill.ok { background: #103321; color: var(--green); }
            .inp { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; color: #fff; padding: 12px; font-size: 13px; margin-bottom: 12px; outline: none; }
            .btn-main { width: 100%; background: var(--accent); color: #04141C; border: none; border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 900; box-shadow: 0 0 18px var(--accent-glow); cursor: pointer; }
            .btn-dark { width: 100%; background: var(--card-2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 12px; font-weight: 700; cursor: pointer; }

            .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
            .btn-rst { background: #26161B; color: #FF6B6B; border: 1px solid #4A222A; padding: 7px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; }

            .feat-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 15px 16px; margin-bottom: 10px; transition: 0.15s; }
            .feat-card.on { border-color: var(--green); background: linear-gradient(145deg, #131822 60%, #0F261D 100%); }
            .feat-top { display: flex; justify-content: space-between; align-items: center; }
            .feat-title { font-size: 15px; font-weight: 800; letter-spacing: 0.3px; }

            .sw { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
            .sw input { opacity: 0; width: 0; height: 0; }
            .sl { position: absolute; inset: 0; background: #263042; border-radius: 24px; transition: .2s; }
            .sl:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #8B949E; border-radius: 50%; transition: .2s; }
            input:checked + .sl { background: var(--green); }
            input:checked + .sl:before { transform: translateX(20px); background: #041F11; }

            .sensi-Control { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
            .range-styled { -webkit-appearance: none; width: 100%; height: 7px; border-radius: 4px; background: #263042; outline: none; margin-top: 8px; }
            .range-styled::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: 0 0 10px var(--accent); cursor: pointer; }

            .dev-panel { background: var(--card); border: 1px solid var(--accent); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
            .key-item { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
            .sm-btn { background: var(--card-2); color: #fff; border: 1px solid var(--border); padding: 5px 8px; border-radius: 6px; font-size: 10px; margin-left: 4px; }
            .sm-btn.stop { background: #5a1818; border-color: var(--danger); }

            .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 90; }
            .nav-it { font-size: 12px; color: var(--muted); font-weight: 700; padding: 8px 12px; cursor: pointer; }
            .nav-it.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
          </style>
          </head>
          <body>

            <!-- GERBANG AWAL SHIZUKU & LISENSI -->
            <div class="login-wrap" id="login-screen">
              <div class="login-box">
                <div class="brand-title">DANZ<span>STRAIGHT</span></div>
                <div class="brand-sub">Shizuku Free Fire System Injector v19.0</div>

                <div class="box-inner">
                  <div class="row-sb">
                    <span>Status Shizuku ADB</span>
                    <span class="pill" id="shz-pill">Belum Terhubung</span>
                  </div>
                  <button class="btn-dark" onclick="AndroidBridge.connectShizuku()">Hubungkan Shizuku</button>
                </div>

                <div class="box-inner">
                  <div class="row-sb" style="margin:0">
                    <span>ID Perangkat: <b id="hwid-label">...</b></span>
                    <button class="sm-btn" onclick="AndroidBridge.copyText(myHwid)">Salin</button>
                  </div>
                </div>

                <input type="text" class="inp" id="key-input" placeholder="Masukkan License Key">
                <button class="btn-main" onclick="verifyKey()">Masuk Aplikasi</button>
              </div>
            </div>

            <!-- HEADER -->
            <div class="header">
              <div>
                <div class="brand-title">DANZ<span>STRAIGHT</span></div>
                <div style="font-size:11px;color:var(--muted)">Free Fire System Injector</div>
              </div>
              <button class="btn-rst" onclick="resetAllUI()">Reset</button>
            </div>

            <!-- DAFTAR 6 FITUR UTAMA -->
            <!-- 1. Aim -->
            <div class="feat-card" id="card-1">
              <div class="feat-top">
                <div class="feat-title">Aim</div>
                <label class="sw"><input type="checkbox" id="sw-1" onchange="trigMod(1,'Aim')"><span class="sl"></span></label>
              </div>
            </div>

            <!-- 2. Aim Drag -->
            <div class="feat-card" id="card-6">
              <div class="feat-top">
                <div class="feat-title">Aim Drag</div>
                <label class="sw"><input type="checkbox" id="sw-6" onchange="trigMod(6,'Aim Drag')"><span class="sl"></span></label>
              </div>
            </div>

            <!-- 3. Easy Drag -->
            <div class="feat-card" id="card-2">
              <div class="feat-top">
                <div class="feat-title">Easy Drag</div>
                <label class="sw"><input type="checkbox" id="sw-2" onchange="trigMod(2,'Easy Drag')"><span class="sl"></span></label>
              </div>
            </div>

            <!-- 4. Smooth Aim -->
            <div class="feat-card" id="card-3">
              <div class="feat-top">
                <div class="feat-title">Smooth Aim</div>
                <label class="sw"><input type="checkbox" id="sw-3" onchange="trigMod(3,'Smooth Aim')"><span class="sl"></span></label>
              </div>
            </div>

            <!-- 5. Aim Legit -->
            <div class="feat-card" id="card-4">
              <div class="feat-top">
                <div class="feat-title">Aim Legit</div>
                <label class="sw"><input type="checkbox" id="sw-4" onchange="trigMod(4,'Aim Legit')"><span class="sl"></span></label>
              </div>
            </div>

            <!-- 6. Sensivity Gamelab -->
            <div class="feat-card" id="card-5">
              <div class="feat-top">
                <div class="feat-title">Sensivity Gamelab</div>
                <label class="sw"><input type="checkbox" id="sw-5" onchange="trigMod(5,'Sensivity Gamelab')"><span class="sl"></span></label>
              </div>
              <div class="sensi-Control">
                <div class="row-sb" style="margin:0">
                  <span style="color:var(--muted)">Level Sensivity</span>
                  <b style="color:var(--accent)" id="sensi-txt">7 (MAX OVERDRIVE)</b>
                </div>
                <input type="range" min="1" max="7" step="1" value="7" class="range-styled" id="sensi-slider" oninput="onSensiSlide(this.value)" onchange="onSensiChange(this.value)">
              </div>
            </div>

            <!-- PANEL DEVELOPER KEY -->
            <div class="dev-panel hidden" id="dev-panel">
              <div class="row-sb" style="margin-bottom:10px">
                <b style="color:var(--accent);font-size:13px">Developer Key Manager</b>
                <span style="font-size:11px;color:var(--muted)">1 Key = 1 Device</span>
              </div>
              <div style="display:flex;gap:6px;margin-bottom:8px">
                <input type="text" class="inp" id="custom-key" placeholder="Nama Key (Kosong = Acak)" style="margin:0">
                <button class="btn-main" style="width:auto;padding:0 14px" onclick="createNewKey()">Buat</button>
              </div>
              <input type="text" class="inp" id="target-hwid" placeholder="Opsional: Kunci ke ID Perangkat" style="margin:0">
              <div id="key-list"></div>
            </div>

            <button class="btn-main" style="margin-top:8px" onclick="AndroidBridge.launchFreeFire()">Buka Free Fire</button>

            <div class="bottom-nav">
              <div class="nav-it active" onclick="window.scrollTo(0,0)">Menu Utama</div>
              <div class="nav-it hidden" id="nav-dev" onclick="document.getElementById('dev-panel').classList.toggle('hidden')">Panel Key</div>
              <div class="nav-it" onclick="AndroidBridge.launchFreeFire()">Buka FF</div>
            </div>

            <script>
              const DEV_KEY = "DANZ-DEV-999";
              let myHwid = window.AndroidBridge ? AndroidBridge.getHwid() : "HWID-01";
              let shizukuOk = false;

              document.getElementById('hwid-label').innerText = myHwid;

              function setShizukuStatus(ok) {
                shizukuOk = ok;
                const p = document.getElementById('shz-pill');
                if (ok) { p.innerText = "Terhubung"; p.classList.add('ok'); }
              }

              function trigMod(id, name) {
                const sw = document.getElementById('sw-' + id);
                const card = document.getElementById('card-' + id);
                if (card) card.classList.toggle('on', sw.checked);
                const s = parseInt(document.getElementById('sensi-slider').value);
                AndroidBridge.toggleFeature(id, name, sw.checked, s);
              }

              function onSensiSlide(val) {
                document.getElementById('sensi-txt').innerText = (val == 7) ? "7 (MAX OVERDRIVE)" : val;
              }

              function onSensiChange(val) {
                onSensiSlide(val);
                const sw5 = document.getElementById('sw-5');
                sw5.checked = true;
                document.getElementById('card-5').classList.add('on');
                AndroidBridge.toggleFeature(5, 'Sensivity Gamelab', true, parseInt(val));
              }

              function resetAllUI() {
                [1, 2, 3, 4, 5, 6].forEach(i => {
                  const sw = document.getElementById('sw-' + i);
                  const card = document.getElementById('card-' + i);
                  if (sw) sw.checked = false;
                  if (card) card.classList.remove('on');
                });
                AndroidBridge.resetDefault();
              }

              function getKeys() {
                const r = localStorage.getItem('danz_v19_keys');
                if (!r) {
                  const d = [{ key: "DANZ-VIP-001", hwid: "", status: "AKTIF" }];
                  localStorage.setItem('danz_v19_keys', JSON.stringify(d));
                  return d;
                }
                return JSON.parse(r);
              }

              function saveKeys(list) {
                localStorage.setItem('danz_v19_keys', JSON.stringify(list));
                renderKeyList();
              }

              function verifyKey() {
                if (!shizukuOk) {
                  AndroidBridge.toast("Hubungkan & izinkan Shizuku terlebih dahulu");
                  AndroidBridge.connectShizuku();
                  return;
                }
                const k = document.getElementById('key-input').value.trim().toUpperCase();
                if (!k) { AndroidBridge.toast("Masukkan kode lisensi"); return; }

                if (k === DEV_KEY) {
                  document.getElementById('login-screen').classList.add('hidden');
                  document.getElementById('dev-panel').classList.remove('hidden');
                  document.getElementById('nav-dev').classList.remove('hidden');
                  renderKeyList();
                  return;
                }

                let list = getKeys();
                let item = list.find(x => x.key === k);
                if (!item && k.startsWith("DANZ-KEY-")) {
                  item = { key: k, hwid: myHwid, status: "AKTIF" };
                  list.push(item);
                }
                if (!item) { AndroidBridge.toast("Key tidak terdaftar"); return; }
                if (item.status !== "AKTIF") { AndroidBridge.toast("Key telah diberhentikan oleh Developer"); return; }
                if (item.hwid && item.hwid !== "" && item.hwid !== myHwid) {
                  AndroidBridge.toast("Key sudah terikat di perangkat lain (1 Key 1 HP)");
                  return;
                }
                item.hwid = myHwid;
                saveKeys(list);
                document.getElementById('login-screen').classList.add('hidden');
              }

              function createNewKey() {
                let c = document.getElementById('custom-key').value.trim().toUpperCase();
                let h = document.getElementById('target-hwid').value.trim().toUpperCase();
                let r = Math.random().toString(36).substring(2, 6).toUpperCase();
                let k = c ? c : ("DANZ-KEY-" + r);
                let list = getKeys();
                list.unshift({ key: k, hwid: h, status: "AKTIF" });
                saveKeys(list);
                document.getElementById('custom-key').value = "";
                AndroidBridge.copyText(k);
              }

              function toggleKeyStatus(k) {
                let list = getKeys();
                let it = list.find(x => x.key === k);
                if (it) { it.status = (it.status === "AKTIF") ? "STOP" : "AKTIF"; saveKeys(list); }
              }

              function renderKeyList() {
                document.getElementById('key-list').innerHTML = getKeys().map(x => `
                  <div class="key-item">
                    <div><b>${x.key}</b><div style="color:var(--muted)">HP: ${x.hwid || 'Free'} | ${x.status}</div></div>
                    <div>
                      <button class="sm-btn" onclick="AndroidBridge.copyText('${x.key}')">Salin</button>
                      <button class="sm-btn stop" onclick="toggleKeyStatus('${x.key}')">${x.status === 'AKTIF' ? 'Stop Key' : 'Aktifkan'}</button>
                    </div>
                  </div>
                `).join('');
              }
            </script>
          </body>
          </html>
          EOF

          echo "sdk.dir=$ANDROID_HOME" > clean_apk/local.properties
          cd clean_apk && gradle assembleDebug --no-daemon

      - name: Upload DANZSTRAIGHT V19 APK
        uses: actions/upload-artifact@v4
        with:
          name: DANZSTRAIGHT-V19-MAX-SLIPPERY
          path: clean_apk/app/build/outputs/apk/debug/*.apk
