                                  executeShizukuClean(
                                      buildAimInjectionScript(currentSensi),
                                      "Aim Merah & Sensi Licin Terkunci ke Sistem Free Fire!"
                                  );
                              }, 4000);
                          } else {
                              Toast.makeText(MainActivity.this, "Silakan buka aplikasi Free Fire", Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }
          }
