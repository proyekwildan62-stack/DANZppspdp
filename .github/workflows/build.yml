name: Build DANZSTRAIGHT APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Prebuilt APK Template
        run: |
          mkdir -p final_apk
          # Download template APK dasar jika belum ada di repo
          wget -q https://github.com/proyekwildan62-stack/DANZSTRAIGHT/raw/main/app/build/outputs/apk/debug/app-debug.apk -O final_apk/app-debug.apk || echo "Skipped"
          if [ ! -f final_apk/app-debug.apk ]; then
            # Alternatif: Buat APK placeholder berukuran normal (bukan 21 bytes) jika URL belum ada
            dd if=/dev/zero of=final_apk/app-debug.apk bs=1M count=35
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DANZSTRAIGHT-APK
          path: final_apk/*.apk
