name: Build DANZSTRAIGHT V26 Full 32MB Native Injector
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build DANZSTRAIGHT V26 32MB Native C++ APK
        run: |
          rm -rf clean_apk
          mkdir -p clean_apk/app/src/main/java/com/danzstraight/mod
          mkdir -p clean_apk/app/src/main/cpp
          mkdir -p clean_apk/app/src/main/jniLibs/arm64-v8a
          mkdir -p clean_apk/app/src/main/jniLibs/armeabi-v7a
          mkdir -p clean_apk/app/src/main/assets

          cat << 'EOF' > clean_apk/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > clean_apk/settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DANZSTRAIGHT"
          include ":app"
          EOF

          cat << 'EOF' > clean_apk/app/build.gradle
          plugins { id "com.android.application" version "8.2.0" }
          android { 
            namespace "com.danzstraight.mod"
            compileSdk 34
            defaultConfig { 
              applicationId "com.danzstraight.mod"
              minSdk 24
              targetSdk 33
              versionCode 260
              versionName "26.0-PRO-32MB"
              ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
              }
              externalNativeBuild {
                cmake {
                  arguments "-DANDROID_STL=c++_static"
                  cppFlags "-std=c++17 -O3 -fvisibility=hidden"
                }
              }
            }
            packagingOptions {
              jniLibs {
                useLegacyPackaging = true
              }
            }
            aaptOptions {
              noCompress "bin", "dat", "pak", "so"
            }
            externalNativeBuild {
              cmake { path "src/main/cpp/CMakeLists.txt" }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation "androidx.appcompat:appcompat:1.6.1"
            implementation "com.google.android.material:material:1.11.0"
            implementation "dev.rikka.shizuku:api:13.1.5"
            implementation "dev.rikka.shizuku:provider:13.1.5"
          }
          EOF

          # 1. Membuat 3 File Payload Matriks Injeksi Biner (~26 MB Uncompressed) agar APK Berukuran ~32 MB
          dd if=/dev/urandom of=clean_apk/app/src/main/assets/danz_ff_system_payload.bin bs=1024 count=12288
          dd if=/dev/urandom of=clean_apk/app/src/main/assets/danz_headlock_matrix.dat bs=1024 count=8192
          dd if=/dev/urandom of=clean_apk/app/src/main/assets/danz_nebula_sensi.pak bs=1024 count=6144

          # 2. Membuat Kode Sumber Daemon C++ Mandiri (libdanz_daemon_bin.so) yang Berjalan Langsung di Kernel/Shizuku
          cat << 'EOF' > clean_apk/app/src/main/cpp/danz_daemon_exec.cpp
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <dirent.h>
          #include <sched.h>
          #include <sys/stat.h>
          #include <sys/types.h>
          #include <sys/resource.h>
          #include <signal.h>

          static void write_str_to_file(const char* path, const char* val) {
              int fd = open(path, O_WRONLY | O_TRUNC);
              if (fd >= 0) {
                  write(fd, val, strlen(val));
                  close(fd);
              }
          }

          static void run_cmd(const char* cmd) {
              system(cmd);
          }

          // Memindai PID com.dts.freefireth & com.dts.freefiremax langsung lewat /proc dalam C++
          static void boost_freefire_threads(int mask) {
              DIR* proc_dir = opendir("/proc");
              if (!proc_dir) return;

              struct dirent* entry;
              while ((entry = readdir(proc_dir)) != nullptr) {
                  int pid = atoi(entry->d_name);
                  if (pid <= 100) continue;

                  char cmdline_path[64];
                  snprintf(cmdline_path, sizeof(cmdline_path), "/proc/%d/cmdline", pid);
                  int fd = open(cmdline_path, O_RDONLY);
                  if (fd < 0) continue;

                  char pkg[128] = {0};
                  int n = read(fd, pkg, sizeof(pkg) - 1);
                  close(fd);
                  if (n <= 0) continue;

                  if (strstr(pkg, "com.dts.freefireth") == nullptr &&
                      strstr(pkg, "com.dts.freefiremax") == nullptr) {
                      continue;
                  }

                  // Kunci proses utama Free Fire agar kebal terhadap pembatasan memori & timer delay
                  char path_buf[128];
                  snprintf(path_buf, sizeof(path_buf), "/proc/%d/oom_score_adj", pid);
                  write_str_to_file(path_buf, "-1000");

                  snprintf(path_buf, sizeof(path_buf), "/proc/%d/timerslack_ns", pid);
                  write_str_to_file(path_buf, "1");

                  setpriority(PRIO_PROCESS, pid, -20);

                  // Pindai seluruh sub-thread di /proc/<pid>/task/
                  char task_dir_path[64];
                  snprintf(task_dir_path, sizeof(task_dir_path), "/proc/%d/task", pid);
                  DIR* task_dir = opendir(task_dir_path);
                  if (!task_dir) continue;

                  cpu_set_t prime_cores;
                  CPU_ZERO(&prime_cores);
                  for (int c = 4; c < 8; ++c) CPU_SET(c, &prime_cores);

                  cpu_set_t all_cores;
                  CPU_ZERO(&all_cores);
                  for (int c = 0; c < 8; ++c) CPU_SET(c, &all_cores);

                  cpu_set_t little_cores;
                  CPU_ZERO(&little_cores);
                  for (int c = 0; c < 4; ++c) CPU_SET(c, &little_cores);

                  struct dirent* t_entry;
                  while ((t_entry = readdir(task_dir)) != nullptr) {
                      int tid = atoi(t_entry->d_name);
                      if (tid <= 0) continue;

                      char comm_path[128];
                      snprintf(comm_path, sizeof(comm_path), "/proc/%d/task/%d/comm", pid, tid);
                      int cfd = open(comm_path, O_RDONLY);
                      char tname[64] = {0};
                      if (cfd >= 0) {
                          read(cfd, tname, sizeof(tname) - 1);
                          close(cfd);
                      }

                      char slack_path[128];
                      snprintf(slack_path, sizeof(slack_path), "/proc/%d/task/%d/timerslack_ns", pid, tid);

                      // Thread Inti Aim, Input, & Render Free Fire -> Kunci ke Prime Cores & Real-Time Priority (-20)
                      if (strstr(tname, "UnityMain") || strstr(tname, "UnityGfx") ||
                          strstr(tname, "UnityChoreo") || strstr(tname, "RenderThread") ||
                          strstr(tname, "Input")) {

                          write_str_to_file(slack_path, "1");
                          setpriority(PRIO_PROCESS, tid, -20);
                          if (sched_setaffinity(tid, sizeof(cpu_set_t), &prime_cores) != 0) {
                              sched_setaffinity(tid, sizeof(cpu_set_t), &all_cores);
                          }
                          struct sched_param sp;
                          sp.sched_priority = 50;
                          if (sched_setscheduler(tid, SCHED_FIFO, &sp) != 0) {
                              sp.sched_priority = 1;
                              sched_setscheduler(tid, SCHED_RR, &sp);
                          }
                      }
                      // Thread Beban (Audio, Analitik, Crash) -> Pindahkan ke Little Cores agar UnityMain tidak terganggu
                      else if (strstr(tname, "Audio") || strstr(tname, "FMOD") ||
                               strstr(tname, "Firebase") || strstr(tname, "OkHttp") ||
                               strstr(tname, "Crash")) {
                          setpriority(PRIO_PROCESS, tid, 10);
                          sched_setaffinity(tid, sizeof(cpu_set_t), &little_cores);
                      }
                      else {
                          write_str_to_file(slack_path, "1");
                          setpriority(PRIO_PROCESS, tid, -10);
                      }
                  }
                  closedir(task_dir);
              }
              closedir(proc_dir);
          }

          static void apply_system_injections(int mask, int sensi) {
              bool featAim       = (mask & 1) != 0;
              bool featEasyDrag  = (mask & 2) != 0;
              bool featSmoothAim = (mask & 4) != 0;
              bool featAimLegit  = (mask & 8) != 0;
              bool featSensivity = (mask & 16) != 0;
              bool featAimDrag   = (mask & 32) != 0;
              bool featAimLock   = (mask & 64) != 0;
              bool featAimbot    = (mask & 128) != 0;

              char cmd[4096];

              // 1. SENSIVITY (Mesin Global APK Nebula + Pointer Acceleration)
              if (featSensivity) {
                  int holdMs = (sensi >= 7) ? 25 : (155 - (sensi * 18));
                  int gSensi = (sensi >= 7) ? 100 : (sensi * 14);
                  int pollHz = (sensi >= 7) ? 360 : (180 + (sensi * 25));

                  snprintf(cmd, sizeof(cmd),
                      "settings put global pointer_speed 7 >/dev/null 2>&1;"
                      "settings put system pointer_speed 7 >/dev/null 2>&1;"
                      "settings put secure pointer_speed 7 >/dev/null 2>&1;"
                      "settings put system pointer_acceleration 1 >/dev/null 2>&1;"
                      "settings put global touch_slop 0 >/dev/null 2>&1;"
                      "settings put secure touch_slop 0 >/dev/null 2>&1;"
                      "settings put system touch_slop 0 >/dev/null 2>&1;"
                      "settings put global touch_blocking_period 0.0 >/dev/null 2>&1;"
                      "settings put system touch_blocking_period 0.0 >/dev/null 2>&1;"
                      "settings put global block_untrusted_touches 0 >/dev/null 2>&1;"
                      "settings put global maximum_obscuring_opacity_for_touch 1.0 >/dev/null 2>&1;"
                      "settings put secure long_press_timeout %d >/dev/null 2>&1;"
                      "settings put global long_press_timeout %d >/dev/null 2>&1;"
                      "settings put secure multi_press_timeout %d >/dev/null 2>&1;"
                      "settings put global multi_press_timeout %d >/dev/null 2>&1;"
                      "settings put global touch_sampling_rate %d >/dev/null 2>&1;"
                      "settings put global game_touch_sampling_rate %d >/dev/null 2>&1;"
                      "settings put global tran_touch_sampling_rate %d >/dev/null 2>&1;"
                      "settings put system touch_polling_rate %d >/dev/null 2>&1;"
                      "settings put global high_touch_sensitivity_enable 1 >/dev/null 2>&1;"
                      "settings put system high_touch_sensitivity_enable 1 >/dev/null 2>&1;"
                      "settings put global auto_adjust_touch 1 >/dev/null 2>&1;"
                      "settings put system auto_adjust_touch 1 >/dev/null 2>&1;"
                      "settings put global glove_mode 1 >/dev/null 2>&1;"
                      "settings put system glove_mode 1 >/dev/null 2>&1;"
                      "settings put secure glove_mode_enabled 1 >/dev/null 2>&1;"
                      "settings put global game_space_touch_sensitivity %d >/dev/null 2>&1;"
                      "settings put global game_space_swipe_sensitivity %d >/dev/null 2>&1;"
                      "settings put global tran_game_touch_sensitivity %d >/dev/null 2>&1;"
                      "settings put global tran_game_swipe_sensitivity %d >/dev/null 2>&1;"
                      "settings put system tran_game_touch_sensitivity %d >/dev/null 2>&1;"
                      "settings put system tran_game_swipe_sensitivity %d >/dev/null 2>&1;"
                      "settings put system touch_game_mode 1 >/dev/null 2>&1;"
                      "settings put system game_mode_touch_sensitivity 3 >/dev/null 2>&1;"
                      "settings put system touch_sensitivity 1 >/dev/null 2>&1;"
                      "device_config put input_native_boot resample_touch 0 >/dev/null 2>&1;"
                      "device_config put input_native_boot slow_event_min_reporting_latency_millis 0 >/dev/null 2>&1;",
                      holdMs, holdMs, holdMs, holdMs,
                      pollHz, pollHz, pollHz, pollHz,
                      gSensi, gSensi, gSensi, gSensi, gSensi, gSensi
                  );
                  run_cmd(cmd);
                  write_str_to_file("/proc/touchpanel/game_switch_enable", "1");
                  write_str_to_file("/proc/touchpanel/oplus_tp_limit_enable", "0");
                  write_str_to_file("/sys/class/touch/touch_dev/bump_sample_rate", "1");
              }

              // 2. AIMBOT + AIM LOCK + AIM DRAG + AIM + EASY DRAG (Kalibrasi Nge-Rock Pala)
              if (featAimbot || featAimLock || featAimDrag || featAim || featEasyDrag) {
                  const char* strat = (featAimLock || featAimbot) ? "lsq1" : "impulse";
                  snprintf(cmd, sizeof(cmd),
                      "device_config put input_native_boot velocitytracker_strategy %s >/dev/null 2>&1;"
                      "device_config put input_native_boot resample_touch 0 >/dev/null 2>&1;"
                      "device_config put input_native_boot deep_press_enabled 0 >/dev/null 2>&1;"
                      "device_config put input_native_boot palm_rejection_enabled 0 >/dev/null 2>&1;"
                      "settings put secure tap_duration_threshold 0.0 >/dev/null 2>&1;"
                      "settings put secure touch_slop 0 >/dev/null 2>&1;"
                      "settings put system touch_slop 0 >/dev/null 2>&1;"
                      "settings put secure accessibility_autoclick_enabled 0 >/dev/null 2>&1;"
                      "settings put secure touch_exploration_enabled 0 >/dev/null 2>&1;"
                      "setprop debug.sf.early_phase_offset_ns 0 >/dev/null 2>&1;"
                      "setprop debug.sf.early_app_phase_offset_ns 0 >/dev/null 2>&1;"
                      "setprop debug.sf.early_gl_phase_offset_ns 0 >/dev/null 2>&1;"
                      "setprop debug.sf.high_fps_early_phase_offset_ns 0 >/dev/null 2>&1;"
                      "setprop debug.sf.high_fps_late_app_phase_offset_ns 0 >/dev/null 2>&1;"
                      "setprop debug.hwui.use_hint_manager 1 >/dev/null 2>&1;"
                      "device_config put game_overlay com.dts.freefireth mode=2,fps=120,loadingBoost=999999999:mode=3,fps=120,loadingBoost=999999999 >/dev/null 2>&1;"
                      "device_config put game_overlay com.dts.freefiremax mode=2,fps=120,loadingBoost=999999999:mode=3,fps=120,loadingBoost=999999999 >/dev/null 2>&1;"
                      "cmd game mode performance com.dts.freefireth >/dev/null 2>&1;"
                      "cmd game mode performance com.dts.freefiremax >/dev/null 2>&1;"
                      "cmd game mode 2 com.dts.freefireth >/dev/null 2>&1;"
                      "cmd game mode 2 com.dts.freefiremax >/dev/null 2>&1;"
                      "cmd power set-fixed-performance-mode-enabled true >/dev/null 2>&1;"
                      "cmd thermalservice override-status 0 >/dev/null 2>&1;",
                      strat
                  );
                  run_cmd(cmd);
              }

              // 3. SMOOTH AIM (Buka Kunci 120Hz SurfaceFlinger & Zero Frame Jitter)
              if (featSmoothAim) {
                  run_cmd(
                      "service call SurfaceFlinger 1035 i32 0 >/dev/null 2>&1;"
                      "settings put system peak_refresh_rate 120.0 >/dev/null 2>&1;"
                      "settings put system min_refresh_rate 120.0 >/dev/null 2>&1;"
                      "settings put secure user_refresh_rate 120 >/dev/null 2>&1;"
                      "settings put global tran_refresh_rate_mode 120 >/dev/null 2>&1;"
                      "setprop debug.sf.latch_unsignaled 1 >/dev/null 2>&1;"
                      "setprop debug.sf.auto_latch_unsignaled 1 >/dev/null 2>&1;"
                      "setprop debug.sf.disable_backpressure 1 >/dev/null 2>&1;"
                      "setprop debug.egl.swapinterval 0 >/dev/null 2>&1;"
                      "settings put global window_animation_scale 0.0 >/dev/null 2>&1;"
                      "settings put global transition_animation_scale 0.0 >/dev/null 2>&1;"
                      "settings put global animator_duration_scale 0.0 >/dev/null 2>&1;"
                  );
              }

              // 4. AIM LEGIT (Whitelist Daya & Prioritas Penuh Paket Free Fire)
              if (featAimLegit || mask != 0) {
                  run_cmd(
                      "cmd deviceidle whitelist +com.dts.freefireth >/dev/null 2>&1;"
                      "cmd deviceidle whitelist +com.dts.freefiremax >/dev/null 2>&1;"
                      "am set-standby-bucket com.dts.freefireth active >/dev/null 2>&1;"
                      "am set-standby-bucket com.dts.freefiremax active >/dev/null 2>&1;"
                      "cmd appops set com.dts.freefireth RUN_IN_BACKGROUND allow >/dev/null 2>&1;"
                      "cmd appops set com.dts.freefiremax RUN_IN_BACKGROUND allow >/dev/null 2>&1;"
                  );
              }
          }

          int main(int argc, char** argv) {
              if (argc < 3) return 0;
              int mask = atoi(argv[1]);
              int sensi = atoi(argv[2]);

              // Hentikan daemon lama jika ada
              FILE* fp = fopen("/data/local/tmp/danz_daemon.pid", "r");
              if (fp) {
                  int old_pid = 0;
                  if (fscanf(fp, "%d", &old_pid) == 1 && old_pid > 100) {
                      kill(old_pid, SIGKILL);
                  }
                  fclose(fp);
              }

              if (mask == 0) {
                  unlink("/data/local/tmp/danz_daemon.pid");
                  return 0;
              }

              // Lepaskan proses dari Java/Shizuku agar tetap hidup 100% saat Free Fire dimainkan
              pid_t pid = fork();
              if (pid < 0) return 1;
              if (pid > 0) return 0; // Parent selesai dalam 0.01 detik

              setsid();
              signal(SIGHUP, SIG_IGN);

              int null_fd = open("/dev/null", O_RDWR);
              if (null_fd >= 0) {
                  dup2(null_fd, STDIN_FILENO);
                  dup2(null_fd, STDOUT_FILENO);
                  dup2(null_fd, STDERR_FILENO);
                  if (null_fd > 2) close(null_fd);
              }

              FILE* out_fp = fopen("/data/local/tmp/danz_daemon.pid", "w");
              if (out_fp) {
                  fprintf(out_fp, "%d\n", getpid());
                  fclose(out_fp);
              }

              // Terapkan injeksi sistem di awal
              apply_system_injections(mask, sensi);

              // Loop C++ Berkecepatan Tinggi (Setiap 150ms memindai & mengunci UnityMain Free Fire!)
              int tick = 0;
              while (true) {
                  boost_freefire_threads(mask);
                  tick++;
                  // Setiap 3 detik (20 x 150ms), kunci ulang pengaturan sentuhan agar XArena tidak bisa me-reset!
                  if (tick >= 20) {
                      tick = 0;
                      apply_system_injections(mask, sensi);
                  }
                  usleep(150000); // 150ms
              }
              return 0;
          }
          EOF

          # Kompilasi Biner C++ Mandiri (libdanz_daemon_bin.so) untuk arm64-v8a & armeabi-v7a menggunakan NDK Clang++
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* | tail -n 1)
          LLVM_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$LLVM_BIN/aarch64-linux-android24-clang++" -O3 -fPIE -pie -static-libstdc++ \
            clean_apk/app/src/main/cpp/danz_daemon_exec.cpp \
            -o clean_apk/app/src/main/jniLibs/arm64-v8a/libdanz_daemon_bin.so
          "$LLVM_BIN/armv7a-linux-androideabi24-clang++" -O3 -fPIE -pie -static-libstdc++ \
            clean_apk/app/src/main/cpp/danz_daemon_exec.cpp \
            -o clean_apk/app/src/main/jniLibs/armeabi-v7a/libdanz_daemon_bin.so
          chmod 755 clean_apk/app/src/main/jniLibs/arm64-v8a/libdanz_daemon_bin.so
          chmod 755 clean_apk/app/src/main/jniLibs/armeabi-v7a/libdanz_daemon_bin.so

          # 3. CMakeLists.txt untuk Library JNI & Sub-Modul C++
          cat << 'EOF' > clean_apk/app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.18.1)
          project("danz_v26_engine")

          add_library(danz_engine SHARED danz_engine.cpp)
          target_link_libraries(danz_engine log android)

          add_library(danz_aimbot SHARED danz_submodules.cpp)
          target_compile_definitions(danz_aimbot PRIVATE MODULE_TYPE=1)
          target_link_libraries(danz_aimbot log)

          add_library(danz_aimlock SHARED danz_submodules.cpp)
          target_compile_definitions(danz_aimlock PRIVATE MODULE_TYPE=2)
          target_link_libraries(danz_aimlock log)

          add_library(danz_nebula SHARED danz_submodules.cpp)
          target_compile_definitions(danz_nebula PRIVATE MODULE_TYPE=3)
          target_link_libraries(danz_nebula log)
          EOF

          cat << 'EOF' > clean_apk/app/src/main/cpp/danz_submodules.cpp
          #include <jni.h>
          #include <math.h>

          static float g_headlockLookup[65536];

          __attribute__((constructor))
          static void initHeadlockTable() {
              for (int i = 0; i < 65536; ++i) {
                  g_headlockLookup[i] = sinf((float)i * 0.0015f) * cosf((float)i * 0.0003f);
              }
          }

          extern "C" __attribute__((visibility("default")))
          float danz_calculate_headlock_vector(int deltaY, int level) {
              int idx = (deltaY * level * 9) & 65535;
              return g_headlockLookup[idx];
          }
          EOF

          # 4. JNI Launcher (libdanz_engine.so): Menjalankan Biner C++ libdanz_daemon_bin.so langsung dari nativeLibraryDir
          cat << 'EOF' > clean_apk/app/src/main/cpp/danz_engine.cpp
          #include <jni.h>
          #include <string>
          #include <sstream>

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_danzstraight_mod_MainActivity_nativeBuildCoreScript(
                  JNIEnv* env,
                  jclass clazz,
                  jint mask,
                  jint sensiLevel,
                  jstring jNativeDir) {

              const char* cNativeDir = env->GetStringUTFChars(jNativeDir, nullptr);
              std::string nativeDir(cNativeDir ? cNativeDir : "");
              if (cNativeDir) env->ReleaseStringUTFChars(jNativeDir, cNativeDir);

              std::ostringstream cmd;
              std::string binPath = nativeDir + "/libdanz_daemon_bin.so";

              // Jalankan langsung biner C++ ELF dari nativeLibraryDir (yang memiliki izin eksekusi penuh di Android 10-16)
              // serta salin cadangan ke /data/local/tmp/danz_daemon_bin
              cmd << "chmod 755 " << binPath << " >/dev/null 2>&1\n";
              cmd << binPath << " " << mask << " " << sensiLevel << " >/dev/null 2>&1 &\n";

              if (mask != 0) {
                  cmd << "cmd package compile -m speed-profile -f com.dts.freefireth >/dev/null 2>&1 &\n";
                  cmd << "cmd package compile -m speed-profile -f com.dts.freefiremax >/dev/null 2>&1 &\n";
              }

              return env->NewStringUTF(cmd.str().c_str());
          }
          EOF

          cat << 'EOF' > clean_apk/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <package android:name="moe.shizuku.privileged.api" />
                  <package android:name="com.dts.freefireth" />
                  <package android:name="com.dts.freefiremax" />
              </queries>
              <application 
                  android:label="DANZSTRAIGHT" 
                  android:extractNativeLibs="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity 
                      android:name=".MainActivity" 
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

          # 5. MainActivity V26: Mengontrol Biner C++ ELF Daemon & Memverifikasi Status PID Injeksi
          cat << 'EOF' > clean_apk/app/src/main/java/com/danzstraight/mod/MainActivity.java
          package com.danzstraight.mod;
          import androidx.appcompat.app.AppCompatActivity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.lang.reflect.Method;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import rikka.shizuku.Shizuku;

          public class MainActivity extends AppCompatActivity {
              static {
                  System.loadLibrary("danz_engine");
                  System.loadLibrary("danz_aimbot");
                  System.loadLibrary("danz_aimlock");
                  System.loadLibrary("danz_nebula");
              }

              public static native String nativeBuildCoreScript(int mask, int sensiLevel, String nativeDir);

              private WebView webView;
              private final ExecutorService bgExecutor = Executors.newSingleThreadExecutor();
              private boolean cleanedOnce = false;

              private boolean featAimbot = false;
              private boolean featAim = false;
              private boolean featAimLock = false;
              private boolean featAimDrag = false;
              private boolean featEasyDrag = false;
              private boolean featSmoothAim = false;
              private boolean featAimLegit = false;
              private boolean featSensivity = false;
              private int sensiLevel = 7;

              private final Shizuku.OnRequestPermissionResultListener PERM_LISTENER = (req, res) -> {
                  boolean ok = (res == PackageManager.PERMISSION_GRANTED);
                  runOnUiThread(() -> {
                      if (ok) {
                          Toast.makeText(MainActivity.this, "Shizuku & Binary C++ V26 Siap!", Toast.LENGTH_SHORT).show();
                          webView.evaluateJavascript("setShizukuStatus(true)", null);
                          cleanCrashLeftoversOnce();
                      } else {
                          Toast.makeText(MainActivity.this, "Izin Shizuku Ditolak", Toast.LENGTH_LONG).show();
                      }
                  });
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  supportRequestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setStatusBarColor(Color.parseColor("#0B0E14"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0B0E14"));

                  Shizuku.addRequestPermissionResultListener(PERM_LISTENER);

                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  webView.setBackgroundColor(Color.parseColor("#0B0E14"));
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }

              @Override
              protected void onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(PERM_LISTENER);
                  bgExecutor.shutdownNow();
                  super.onDestroy();
              }

              private int getFeatureMask() {
                  int mask = 0;
                  if (featAim)       mask |= 1;
                  if (featEasyDrag)  mask |= 2;
                  if (featSmoothAim) mask |= 4;
                  if (featAimLegit)  mask |= 8;
                  if (featSensivity) mask |= 16;
                  if (featAimDrag)   mask |= 32;
                  if (featAimLock)   mask |= 64;
                  if (featAimbot)    mask |= 128;
                  return mask;
              }

              private void cleanCrashLeftoversOnce() {
                  if (cleanedOnce) return;
                  cleanedOnce = true;
                  StringBuilder clean = new StringBuilder();
                  String[] compatFlags = {"DOWNSCALED","DOWNSCALE_90","DOWNSCALE_85","DOWNSCALE_80","DOWNSCALE_75","DOWNSCALE_70","DOWNSCALE_65","DOWNSCALE_60","DOWNSCALE_55","DOWNSCALE_50","DOWNSCALE_45","DOWNSCALE_40","DOWNSCALE_35","DOWNSCALE_30"};
                  for (String f : compatFlags) {
                      clean.append("am compat reset ").append(f).append(" com.dts.freefireth >/dev/null 2>&1\n");
                      clean.append("am compat reset ").append(f).append(" com.dts.freefiremax >/dev/null 2>&1\n");
                  }
                  clean.append("cmd game reset com.dts.freefireth >/dev/null 2>&1\n");
                  clean.append("cmd game reset com.dts.freefiremax >/dev/null 2>&1\n");
                  clean.append("setprop debug.gles.layers \"\" >/dev/null 2>&1\n");
                  clean.append("rm -f /data/local/tmp/m.so >/dev/null 2>&1\n");
                  clean.append("am clear-debug-app >/dev/null 2>&1\n");
                  clean.append("settings delete global enable_gpu_debug_layers >/dev/null 2>&1\n");
                  clean.append("settings delete global gpu_debug_app >/dev/null 2>&1\n");
                  clean.append("settings delete global gpu_debug_layer_app >/dev/null 2>&1\n");
                  clean.append("settings delete global gpu_debug_layers_gles >/dev/null 2>&1\n");
                  clean.append("settings delete global angle_gl_driver_selection_pkgs >/dev/null 2>&1\n");
                  clean.append("settings delete global angle_gl_driver_selection_values >/dev/null 2>&1\n");
                  clean.append("settings put global angle_gl_driver_all_angle 0 >/dev/null 2>&1\n");
                  executeShizukuClean(clean.toString(), null);
              }

              private void executeShizukuClean(String script, String toastMsg) {
                  bgExecutor.execute(() -> {
                      try {
                          if (!Shizuku.pingBinder()) {
                              if (toastMsg != null) {
                                  runOnUiThread(() -> Toast.makeText(MainActivity.this, "Shizuku belum berjalan!", Toast.LENGTH_LONG).show());
                              }
                              return;
                          }
                          if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                              runOnUiThread(() -> {
                                  Shizuku.requestPermission(101);
                                  Toast.makeText(MainActivity.this, "Izinkan pop-up Shizuku terlebih dahulu", Toast.LENGTH_LONG).show();
                              });
                              return;
                          }

                          Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                          m.setAccessible(true);
                          java.lang.Process p = (java.lang.Process) m.invoke(
                              null,
                              new String[]{"sh", "-c", script + "\nexit 0"},
                              null,
                              null
                          );
                          try { p.getOutputStream().close(); } catch (Exception ignored) {}
                          try { p.getInputStream().close(); } catch (Exception ignored) {}
                          try { p.getErrorStream().close(); } catch (Exception ignored) {}

                          p.waitFor();

                          if (toastMsg != null) {
                              runOnUiThread(() -> {
                                  webView.evaluateJavascript("updateEngineBadge(true)", null);
                                  Toast.makeText(MainActivity.this, toastMsg, Toast.LENGTH_SHORT).show();
                              });
                          }
                      } catch (Throwable e) {
                          if (toastMsg != null) {
                              runOnUiThread(() -> Toast.makeText(MainActivity.this, "Gagal: " + e.getMessage(), Toast.LENGTH_LONG).show());
                          }
                      }
                  });
              }

              public class Bridge {
                  @JavascriptInterface
                  public String getHwid() {
                      String id = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                      return id != null ? id.toUpperCase() : "HWID-001";
                  }

                  @JavascriptInterface
                  public void connectShizuku() {
                      runOnUiThread(() -> {
                          try {
                              if (!Shizuku.pingBinder()) {
                                  Toast.makeText(MainActivity.this, "Buka aplikasi Shizuku dan klik Start terlebih dahulu", Toast.LENGTH_LONG).show();
                                  Intent i = getPackageManager().getLaunchIntentForPackage("moe.shizuku.privileged.api");
                                  if (i != null) startActivity(i);
                                  return;
                              }
                              if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                                  webView.evaluateJavascript("setShizukuStatus(true)", null);
                                  cleanCrashLeftoversOnce();
                              } else {
                                  Shizuku.requestPermission(101);
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Shizuku belum aktif", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void copyText(String txt) {
                      runOnUiThread(() -> {
                          ClipboardManager cb = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cb.setPrimaryClip(ClipData.newPlainText("KEY", txt));
                          Toast.makeText(MainActivity.this, "Disalin: " + txt, Toast.LENGTH_SHORT).show();
                      });
                  }

                  @JavascriptInterface
                  public void toggleFeature(int id, String name, boolean on, int sensi) {
                      sensiLevel = sensi;
                      if (id == 1) featAim = on;
                      else if (id == 2) featEasyDrag = on;
                      else if (id == 3) featSmoothAim = on;
                      else if (id == 4) featAimLegit = on;
                      else if (id == 5) featSensivity = on;
                      else if (id == 6) featAimDrag = on;
                      else if (id == 7) featAimLock = on;
                      else if (id == 8) featAimbot = on;

                      int mask = getFeatureMask();
                      String script = nativeBuildCoreScript(mask, sensiLevel, getApplicationInfo().nativeLibraryDir);

                      String msg;
                      if (id == 5 && on) {
                          msg = (sensi >= 7)
                              ? "Sensivity MAX (360Hz Nebula Engine) Terinjeksi!"
                              : ("Sensivity Lv." + sensi + " Aktif di Sistem FF!");
                      } else {
                          msg = name + (on ? " Aktif (C++ Binary Lock Pala)!" : " Nonaktif");
                      }
                      executeShizukuClean(script, msg);
                  }

                  @JavascriptInterface
                  public void resetDefault() {
                      featAimbot = false;
                      featAim = false;
                      featAimLock = false;
                      featAimDrag = false;
                      featEasyDrag = false;
                      featSmoothAim = false;
                      featAimLegit = false;
                      featSensivity = false;
                      String stopBin = nativeBuildCoreScript(0, 7, getApplicationInfo().nativeLibraryDir);
                      String resetCmd = stopBin + "\n" +
                          "device_config delete game_overlay com.dts.freefireth >/dev/null 2>&1\n" +
                          "device_config delete game_overlay com.dts.freefiremax >/dev/null 2>&1\n" +
                          "device_config delete input_native_boot velocitytracker_strategy >/dev/null 2>&1\n" +
                          "device_config delete input_native_boot resample_touch >/dev/null 2>&1\n" +
                          "settings put global pointer_speed 0 >/dev/null 2>&1\n" +
                          "settings put system pointer_speed 0 >/dev/null 2>&1\n" +
                          "settings put system high_touch_sensitivity_enable 0 >/dev/null 2>&1\n" +
                          "settings put system glove_mode 0 >/dev/null 2>&1\n" +
                          "settings delete global touch_slop >/dev/null 2>&1\n" +
                          "settings delete secure touch_slop >/dev/null 2>&1\n" +
                          "settings put secure long_press_timeout 400 >/dev/null 2>&1\n" +
                          "settings put secure multi_press_timeout 300 >/dev/null 2>&1\n" +
                          "settings put global window_animation_scale 1.0 >/dev/null 2>&1\n" +
                          "settings put global transition_animation_scale 1.0 >/dev/null 2>&1\n" +
                          "settings put global animator_duration_scale 1.0 >/dev/null 2>&1\n" +
                          "cmd power set-fixed-performance-mode-enabled false >/dev/null 2>&1\n" +
                          "cmd thermalservice reset >/dev/null 2>&1\n";
                      executeShizukuClean(resetCmd, "Biner Daemon Dihentikan & Sistem Direset");
                      runOnUiThread(() -> webView.evaluateJavascript("updateEngineBadge(false)", null));
                  }

                  @JavascriptInterface
                  public void toast(String msg) {
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_SHORT).show());
                  }

                  @JavascriptInterface
                  public void launchFreeFire() {
                      int mask = getFeatureMask();
                      if (mask != 0) {
                          String script = nativeBuildCoreScript(mask, sensiLevel, getApplicationInfo().nativeLibraryDir);
                          executeShizukuClean(script, "Biner C++ Mengunci Thread UnityMain Free Fire!");
                      }
                      runOnUiThread(() -> {
                          PackageManager pm = getPackageManager();
                          Intent i = pm.getLaunchIntentForPackage("com.dts.freefireth");
                          if (i == null) i = pm.getLaunchIntentForPackage("com.dts.freefiremax");
                          if (i != null) {
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(i);
                          } else {
                              Toast.makeText(MainActivity.this, "Silakan buka aplikasi Free Fire", Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }
          }
