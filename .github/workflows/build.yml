name: Build DANZSTRAIGHT V8 Pure FF Package
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Pure Free Fire Package Injector APK
        run: |
          rm -rf clean_apk
          mkdir -p clean_apk/app/src/main/java/com/danzstraight/mod
          mkdir -p clean_apk/app/src/main/assets

          cat << 'EOF' > clean_apk/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > clean_apk/settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DANZSTRAIGHT"
          include ":app"
          EOF

          cat << 'EOF' > clean_apk/app/build.gradle
          plugins { id "com.android.application" version "8.2.0" }
          android { 
            namespace "com.danzstraight.mod"
            compileSdk 34
            defaultConfig { 
              applicationId "com.danzstraight.mod"
              minSdk 24
              targetSdk 33
              versionCode 80
              versionName "8.0"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation "dev.rikka.shizuku:api:13.1.5"
            implementation "dev.rikka.shizuku:provider:13.1.5"
          }
          EOF

          cat << 'EOF' > clean_apk/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <queries>
                  <package android:name="moe.shizuku.privileged.api" />
                  <package android:name="com.dts.freefireth" />
                  <package android:name="com.dts.freefiremax" />
              </queries>
              <application 
                  android:label="DANZSTRAIGHT" 
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity 
                      android:name=".MainActivity" 
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".InGameService"
                      android:enabled="true"
                      android:exported="false" />
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > clean_apk/app/src/main/java/com/danzstraight/mod/InGameService.java
          package com.danzstraight.mod;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.Process;

          public class InGameService extends Service {
              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  Process.setThreadPriority(Process.THREAD_PRIORITY_URGENT_DISPLAY);
                  String info = intent != null ? intent.getStringExtra("status") : "Injeksi Paket Free Fire Aktif";
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      String cid = "danz_ff_pkg";
                      NotificationChannel ch = new NotificationChannel(cid, "DANZSTRAIGHT FF Engine", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(ch);
                      Notification n = new Notification.Builder(this, cid)
                              .setContentTitle("DANZSTRAIGHT - Sistem Free Fire")
                              .setContentText(info)
                              .setSmallIcon(android.R.drawable.ic_media_play)
                              .setOngoing(true)
                              .build();
                      startForeground(101, n);
                  }
                  return START_STICKY;
              }
          }
          EOF

          cat << 'EOF' > clean_apk/app/src/main/java/com/danzstraight/mod/MainActivity.java
          package com.danzstraight.mod;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.OutputStream;
          import java.lang.reflect.Method;
          import rikka.shizuku.Shizuku;

          public class MainActivity extends Activity {
              private WebView webView;

              private final Shizuku.OnRequestPermissionResultListener PERM_LISTENER = (req, res) -> {
                  boolean ok = (res == PackageManager.PERMISSION_GRANTED);
                  runOnUiThread(() -> {
                      if (ok) {
                          Toast.makeText(MainActivity.this, "Shizuku Terhubung ke Paket Free Fire", Toast.LENGTH_SHORT).show();
                          webView.evaluateJavascript("setShizukuStatus(true)", null);
                      } else {
                          Toast.makeText(MainActivity.this, "Izin Shizuku Ditolak", Toast.LENGTH_LONG).show();
                      }
                  });
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setStatusBarColor(Color.parseColor("#111214"));
                  getWindow().setNavigationBarColor(Color.parseColor("#111214"));

                  Shizuku.addRequestPermissionResultListener(PERM_LISTENER);

                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  webView.setBackgroundColor(Color.parseColor("#111214"));
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }

              @Override
              protected void onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(PERM_LISTENER);
                  super.onDestroy();
              }

              private String execShizukuShell(String commands) {
                  try {
                      if (!Shizuku.pingBinder()) return "ERR: Shizuku belum berjalan";
                      if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                          Shizuku.requestPermission(101);
                          return "ERR: Izinkan pop-up Shizuku terlebih dahulu";
                      }
                      Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                      m.setAccessible(true);
                      java.lang.Process p = (java.lang.Process) m.invoke(null, new String[]{"sh"}, null, null);
                      OutputStream os = p.getOutputStream();
                      os.write((commands + "\nexit\n").getBytes());
                      os.flush();
                      os.close();
                      p.waitFor();
                      return "OK";
                  } catch (Exception e) {
                      return "ERR: " + e.getMessage();
                  }
              }

              private void startKeepAlive(String msg) {
                  Intent svc = new Intent(this, InGameService.class);
                  svc.putExtra("status", msg);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(svc);
                  } else {
                      startService(svc);
                  }
              }

              public class Bridge {
                  @JavascriptInterface
                  public String getHwid() {
                      String id = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                      return id != null ? id.toUpperCase() : "HWID-001";
                  }

                  @JavascriptInterface
                  public void connectShizuku() {
                      runOnUiThread(() -> {
                          try {
                              if (!Shizuku.pingBinder()) {
                                  Toast.makeText(MainActivity.this, "Buka aplikasi Shizuku dan klik Start terlebih dahulu", Toast.LENGTH_LONG).show();
                                  Intent i = getPackageManager().getLaunchIntentForPackage("moe.shizuku.privileged.api");
                                  if (i != null) startActivity(i);
                                  return;
                              }
                              if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                                  webView.evaluateJavascript("setShizukuStatus(true)", null);
                              } else {
                                  Shizuku.requestPermission(101);
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Shizuku belum aktif", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void copyText(String txt) {
                      runOnUiThread(() -> {
                          ClipboardManager cb = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cb.setPrimaryClip(ClipData.newPlainText("KEY", txt));
                          Toast.makeText(MainActivity.this, "Disalin: " + txt, Toast.LENGTH_SHORT).show();
                      });
                  }

                  // MURNI MENEMBAK PAKET & PROSES FREE FIRE (TANPA PENGATURAN HP & TANPA DOWNSCALE)
                  @JavascriptInterface
                  public String runFeature(int id, String name, boolean on, int sensi, int lightMode) {
                      StringBuilder cmd = new StringBuilder();

                      if (id == 1) { // Aim Merah (Drag HS) -> Kompilasi Native Speed & Prioritas Thread Input FF
                          if (on) {
                              cmd.append("cmd package compile -m speed -f com.dts.freefireth\n");
                              cmd.append("cmd package compile -m speed -f com.dts.freefiremax\n");
                              cmd.append("for p in $(pidof com.dts.freefireth com.dts.freefiremax); do renice -n -20 -p $p; done\n");
                          } else {
                              cmd.append("cmd package compile -m speed-profile com.dts.freefireth\n");
                              cmd.append("cmd package compile -m speed-profile com.dts.freefiremax\n");
                          }
                      } else if (id == 2) { // Easy Drag -> Real-Time I/O & CPU Affinity Khusus Proses FF
                          if (on) {
                              cmd.append("for p in $(pidof com.dts.freefireth com.dts.freefiremax); do ionice -c 1 -n 0 -p $p; taskset -p -a ff $p; done\n");
                              cmd.append("cmd activity send-trim-memory com.dts.freefireth RUNNING_LOW\n");
                              cmd.append("cmd activity send-trim-memory com.dts.freefiremax RUNNING_LOW\n");
                          } else {
                              cmd.append("for p in $(pidof com.dts.freefireth com.dts.freefiremax); do ionice -c 2 -n 4 -p $p; done\n");
                          }
                      } else if (id == 3) { // Smooth Aim -> Hardware Game Driver & 120 FPS Khusus Paket FF (Tanpa Downscale)
                          if (on) {
                              cmd.append("settings put global game_driver_opt_in_apps com.dts.freefireth,com.dts.freefiremax\n");
                              cmd.append("settings put global game_driver_prerelease_opt_in_apps com.dts.freefireth,com.dts.freefiremax\n");
                              cmd.append("device_config put game_overlay com.dts.freefireth mode=2,fps=120:mode=3,fps=120\n");
                              cmd.append("device_config put game_overlay com.dts.freefiremax mode=2,fps=120:mode=3,fps=120\n");
                              cmd.append("cmd game set --mode 2 --fps 120 com.dts.freefireth\n");
                              cmd.append("cmd game set --mode 2 --fps 120 com.dts.freefiremax\n");
                          } else {
                              cmd.append("settings delete global game_driver_opt_in_apps\n");
                              cmd.append("settings delete global game_driver_prerelease_opt_in_apps\n");
                              cmd.append("device_config delete game_overlay com.dts.freefireth\n");
                              cmd.append("device_config delete game_overlay com.dts.freefiremax\n");
                          }
                      } else if (id == 4) { // Aim Legit -> Whitelist Daya & Izin Prioritas Penuh Paket FF
                          if (on) {
                              cmd.append("cmd deviceidle whitelist +com.dts.freefireth\n");
                              cmd.append("cmd deviceidle whitelist +com.dts.freefiremax\n");
                              cmd.append("cmd appops set com.dts.freefireth RUN_IN_BACKGROUND allow\n");
                              cmd.append("cmd appops set com.dts.freefiremax RUN_IN_BACKGROUND allow\n");
                              cmd.append("cmd appops set com.dts.freefireth RUN_ANY_IN_BACKGROUND allow\n");
                              cmd.append("cmd appops set com.dts.freefiremax RUN_ANY_IN_BACKGROUND allow\n");
                          } else {
                              cmd.append("cmd deviceidle whitelist -com.dts.freefireth\n");
                              cmd.append("cmd deviceidle whitelist -com.dts.freefiremax\n");
                          }
                      } else if (id == 5) { // Sensitivitas Sistem FF (Level 1 - 7 Langsung ke Thread Priority Proses FF)
                          int niceVal = -(sensi * 2 + 4); // Level 1 (-6) s/d Level 7 (-18) khusus proses FF
                          if (on) {
                              cmd.append("for p in $(pidof com.dts.freefireth com.dts.freefiremax); do renice -n ").append(niceVal).append(" -p $p; done\n");
                              cmd.append("cmd game mode performance com.dts.freefireth\n");
                              cmd.append("cmd game mode performance com.dts.freefiremax\n");
                          } else {
                              cmd.append("for p in $(pidof com.dts.freefireth com.dts.freefiremax); do renice -n 0 -p $p; done\n");
                          }
                      } else if (id == 6) { // Boost Sistem FF -> Standby Bucket Active & Loading Boost Khusus FF
                          if (on) {
                              cmd.append("am set-standby-bucket com.dts.freefireth active\n");
                              cmd.append("am set-standby-bucket com.dts.freefiremax active\n");
                              cmd.append("cmd game mode performance com.dts.freefireth\n");
                              cmd.append("cmd game mode performance com.dts.freefiremax\n");
                              cmd.append("rm -rf /sdcard/Android/data/com.dts.freefireth/cache/*\n");
                              cmd.append("rm -rf /sdcard/Android/data/com.dts.freefiremax/cache/*\n");
                          } else {
                              cmd.append("cmd game mode standard com.dts.freefireth\n");
                              cmd.append("cmd game mode standard com.dts.freefiremax\n");
                          }
                      } else if (id == 7) { // GRAFIK RINGAN (Khusus Paket FF & Tanpa Downscale Sama Sekali)
                          if (on) {
                              if (lightMode == 1) {
                                  // Mode 1: Super Ringan (Production Driver + Loading Boost FF Tanpa Downscale)
                                  cmd.append("settings put global updatable_driver_production_opt_in_apps com.dts.freefireth,com.dts.freefiremax\n");
                                  cmd.append("device_config put game_overlay com.dts.freefireth mode=2,fps=120,loadingBoost=99999999:mode=3,fps=120,loadingBoost=99999999\n");
                                  cmd.append("device_config put game_overlay com.dts.freefiremax mode=2,fps=120,loadingBoost=99999999:mode=3,fps=120,loadingBoost=99999999\n");
                                  cmd.append("cmd game set --mode 2 --fps 120 com.dts.freefireth\n");
                                  cmd.append("cmd game set --mode 2 --fps 120 com.dts.freefiremax\n");
                              } else {
                                  // Mode 2: Mode PC (ANGLE OpenGL Driver Murni Khusus Paket FF Tanpa Downscale)
                                  cmd.append("settings put global angle_gl_driver_selection_pkgs com.dts.freefireth,com.dts.freefiremax\n");
                                  cmd.append("settings put global angle_gl_driver_selection_values angle,angle\n");
                                  cmd.append("device_config put game_overlay com.dts.freefireth mode=2,useAngle=true,fps=120,loadingBoost=99999999:mode=3,useAngle=true,fps=120\n");
                                  cmd.append("device_config put game_overlay com.dts.freefiremax mode=2,useAngle=true,fps=120,loadingBoost=99999999:mode=3,useAngle=true,fps=120\n");
                                  cmd.append("cmd game set --mode 2 --fps 120 com.dts.freefireth\n");
                                  cmd.append("cmd game set --mode 2 --fps 120 com.dts.freefiremax\n");
                              }
                          } else {
                              cmd.append("settings delete global updatable_driver_production_opt_in_apps\n");
                              cmd.append("settings delete global angle_gl_driver_selection_pkgs\n");
                              cmd.append("settings delete global angle_gl_driver_selection_values\n");
                              cmd.append("device_config delete game_overlay com.dts.freefireth\n");
                              cmd.append("device_config delete game_overlay com.dts.freefiremax\n");
                              cmd.append("cmd game reset com.dts.freefireth\n");
                              cmd.append("cmd game reset com.dts.freefiremax\n");
                          }
                      }

                      String res = execShizukuShell(cmd.toString());

                      runOnUiThread(() -> {
                          if (res.equals("OK")) {
                              startKeepAlive(name + " -> com.dts.freefireth");
                              Toast.makeText(MainActivity.this, name + (on ? " Masuk ke Sistem FF" : " Direset dari FF"), Toast.LENGTH_SHORT).show();
                          } else {
                              Toast.makeText(MainActivity.this, res, Toast.LENGTH_LONG).show();
                          }
                      });
                      return res.equals("OK") ? (name + (on ? " : Terinjeksi ke Paket FF" : " : Nonaktif")) : res;
                  }

                  @JavascriptInterface
                  public void resetAll() {
                      execShizukuShell("device_config delete game_overlay com.dts.freefireth\ndevice_config delete game_overlay com.dts.freefiremax\ncmd game reset com.dts.freefireth\ncmd game reset com.dts.freefiremax\nsettings delete global angle_gl_driver_selection_pkgs\nsettings delete global angle_gl_driver_selection_values\nsettings delete global game_driver_opt_in_apps\nsettings delete global updatable_driver_production_opt_in_apps\n");
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, "Semua Konfigurasi Paket Free Fire Direset", Toast.LENGTH_LONG).show());
                  }

                  @JavascriptInterface
                  public void toast(String msg) {
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_SHORT).show());
                  }

                  @JavascriptInterface
                  public void launchFreeFire() {
                      runOnUiThread(() -> {
                          startKeepAlive("Injeksi Paket Free Fire Berjalan");
                          PackageManager pm = getPackageManager();
                          Intent i = pm.getLaunchIntentForPackage("com.dts.freefireth");
                          if (i == null) i = pm.getLaunchIntentForPackage("com.dts.freefiremax");
                          if (i != null) {
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(i);
                              new android.os.Handler().postDelayed(() -> {
                                  execShizukuShell("for p in $(pidof com.dts.freefireth com.dts.freefiremax); do renice -n -20 -p $p; ionice -c 1 -n 0 -p $p; taskset -p -a ff $p; done\n");
                              }, 3500);
                          } else {
                              Toast.makeText(MainActivity.this, "Konfigurasi FF Aktif. Silakan buka Free Fire.", Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }
          }
          EOF

          cat << 'EOF' > clean_apk/app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
          <style>
            :root {
              --bg: #111214;
              --surface: #1A1C20;
              --border: #2A2D34;
              --accent: #D32F2F;
              --active: #2E7D32;
              --active-light: #4CAF50;
              --text: #F1F3F5;
              --muted: #90949C;
            }
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, -apple-system, sans-serif; user-select: none; }
            body { background: var(--bg); color: var(--text); padding: 14px; padding-bottom: 80px; }
            .hidden { display: none !important; }

            .login-wrap { position: fixed; inset: 0; background: var(--bg); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 18px; }
            .login-card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
            .app-name { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
            .app-ver { font-size: 12px; color: var(--muted); margin-top: 2px; margin-bottom: 16px; }
            .section-box { background: #141619; border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 12px; }
            .row-between { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 8px; }
            .status-pill { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: #331B1B; color: #EF5350; font-weight: 600; }
            .status-pill.ok { background: #1B3320; color: #66BB6A; }
            .btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 11px; font-size: 13px; font-weight: 600; cursor: pointer; }
            .btn-secondary { background: #262930; color: var(--text); border: 1px solid var(--border); }
            .input-field { width: 100%; background: #141619; border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 11px; font-size: 13px; margin-bottom: 12px; outline: none; }
            .input-field:focus { border-color: var(--accent); }

            .top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
            .btn-small { background: #262930; color: #EF5350; border: 1px solid #3E2723; padding: 6px 10px; border-radius: 5px; font-size: 11px; font-weight: 600; }

            .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
            .info-item { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
            .info-label { font-size: 11px; color: var(--muted); }
            .info-val { font-size: 13px; font-weight: 700; color: var(--active-light); margin-top: 2px; }

            .module-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
            .module-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; }
            .module-card.active { border-color: var(--active-light); }
            .module-top { display: flex; justify-content: space-between; align-items: center; }
            .module-title { font-size: 14px; font-weight: 600; }
            .module-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }

            .switch { position: relative; width: 42px; height: 22px; flex-shrink: 0; }
            .switch input { opacity: 0; width: 0; height: 0; }
            .slider { position: absolute; inset: 0; background: #2E323B; border-radius: 22px; transition: 0.15s; }
            .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: #B0B5BD; border-radius: 50%; transition: 0.15s; }
            input:checked + .slider { background: var(--active); }
            input:checked + .slider:before { transform: translateX(20px); background: #fff; }

            .sub-control { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
            .step-box { display: flex; align-items: center; gap: 12px; }
            .step-btn { background: #262930; color: #fff; border: 1px solid var(--border); width: 30px; height: 28px; border-radius: 4px; font-weight: 700; }
            .select-box { width: 100%; background: #141619; color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 8px 10px; font-size: 12px; outline: none; }

            .dev-panel { background: var(--surface); border: 1px solid var(--accent); border-radius: 6px; padding: 12px; margin-bottom: 14px; }
            .dev-header { font-size: 13px; font-weight: 700; color: #EF5350; margin-bottom: 10px; display: flex; justify-content: space-between; }
            .key-row { background: #141619; border: 1px solid var(--border); border-radius: 5px; padding: 8px 10px; margin-top: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
            .tag-btn { background: #262930; color: #fff; border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; font-size: 10px; margin-left: 4px; }
            .tag-btn.danger { background: #B71C1C; border-color: #D32F2F; }

            .status-box { background: #141619; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
            .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 54px; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 90; }
            .nav-btn { font-size: 12px; color: var(--muted); font-weight: 500; padding: 8px 12px; }
            .nav-btn.active { color: var(--text); font-weight: 700; border-bottom: 2px solid var(--accent); }
          </style>
          </head>
          <body>

            <div class="login-wrap" id="login-screen">
              <div class="login-card">
                <div class="app-name">DANZSTRAIGHT</div>
                <div class="app-ver">Pure Free Fire Package Injector v8.0</div>

                <div class="section-box">
                  <div class="row-between">
                    <span>Akses Shizuku ADB</span>
                    <span class="status-pill" id="shz-pill">Belum Aktif</span>
                  </div>
                  <button class="btn btn-secondary" onclick="AndroidBridge.connectShizuku()">Hubungkan Shizuku</button>
                </div>

                <div class="section-box">
                  <div class="row-between" style="margin:0">
                    <span>ID Perangkat: <b id="hwid-label">...</b></span>
                    <button class="tag-btn" onclick="AndroidBridge.copyText(myHwid)">Salin</button>
                  </div>
                </div>

                <input type="text" class="input-field" id="key-input" placeholder="Masukkan Kode Lisensi (1 Key 1 HP)">
                <button class="btn" onclick="verifyKey()">Masuk Aplikasi</button>
              </div>
            </div>

            <div class="top-bar">
              <div>
                <div class="app-name">DANZSTRAIGHT</div>
                <div style="font-size:11px;color:var(--muted)">Target Murni: com.dts.freefireth / max (Tanpa Downscale)</div>
              </div>
              <button class="btn-small" onclick="AndroidBridge.resetAll()">Reset FF</button>
            </div>

            <div class="info-grid">
              <div class="info-item">
                <div class="info-label">Target Injeksi</div>
                <div class="info-val">Khusus Paket FF</div>
              </div>
              <div class="info-item">
                <div class="info-label">Sistem HP & Resolusi</div>
                <div class="info-val">100% Tidak Diubah</div>
              </div>
            </div>

            <div class="dev-panel hidden" id="dev-panel">
              <div class="dev-header">
                <span>Manajemen Lisensi Developer</span>
                <span>1 Key = 1 HP</span>
              </div>
              <div style="display:flex;gap:6px;margin-bottom:8px">
                <input type="text" class="input-field" id="custom-key" placeholder="Nama Key (Kosong = Otomatis)" style="margin:0">
                <button class="btn" style="width:auto;padding:0 14px" onclick="createNewKey()">Buat Key</button>
              </div>
              <input type="text" class="input-field" id="target-hwid" placeholder="Opsional: Kunci langsung ke ID Perangkat" style="margin:0">
              <div id="key-list"></div>
            </div>

            <div class="module-list">
              <div class="module-card" id="card-1">
                <div class="module-top">
                  <div>
                    <div class="module-title">Aim Merah (Drag HS)</div>
                    <div class="module-desc">Kompilasi native speed biner Free Fire & kunci prioritas thread input FF</div>
                  </div>
                  <label class="switch"><input type="checkbox" id="sw-1" onchange="toggleMod(1,'Aim Merah FF')"><span class="slider"></span></label>
                </div>
              </div>

              <div class="module-card" id="card-2">
                <div class="module-top">
                  <div>
                    <div class="module-title">Easy Drag</div>
                    <div class="module-desc">I/O Real-Time & ikat semua core CPU khusus pada proses Free Fire</div>
                  </div>
                  <label class="switch"><input type="checkbox" id="sw-2" onchange="toggleMod(2,'Easy Drag FF')"><span class="slider"></span></label>
                </div>
              </div>

              <div class="module-card" id="card-3">
                <div class="module-top">
                  <div>
                    <div class="module-title">Smooth Aim</div>
                    <div class="module-desc">Aktifkan Game Driver perangkat keras & kunci 120 FPS khusus paket FF</div>
                  </div>
                  <label class="switch"><input type="checkbox" id="sw-3" onchange="toggleMod(3,'Smooth Aim FF')"><span class="slider"></span></label>
                </div>
              </div>

              <div class="module-card" id="card-4">
                <div class="module-top">
                  <div>
                    <div class="module-title">Aim Legit</div>
                    <div class="module-desc">Bebaskan paket Free Fire dari pembatasan daya & throttling proses</div>
                  </div>
                  <label class="switch"><input type="checkbox" id="sw-4" onchange="toggleMod(4,'Aim Legit FF')"><span class="slider"></span></label>
                </div>
              </div>

              <div class="module-card" id="card-5">
                <div class="module-top">
                  <div>
                    <div class="module-title">Sensitivitas Proses FF</div>
                    <div class="module-desc">Atur tingkat prioritas respons thread internal Free Fire (Level 1 - 7)</div>
                  </div>
                  <label class="switch"><input type="checkbox" id="sw-5" onchange="toggleMod(5,'Sensitivitas FF')"><span class="slider"></span></label>
                </div>
                <div class="sub-control">
                  <span style="font-size:12px;color:var(--muted)">Level Prioritas Thread FF:</span>
                  <div class="step-box">
                    <button class="step-btn" onclick="changeSensi(-1)">-</button>
                    <b id="sensi-val" style="font-size:13px">4</b>
                    <button class="step-btn" onclick="changeSensi(1)">+</button>
                  </div>
                </div>
              </div>

              <div class="module-card" id="card-6">
                <div class="module-top">
                  <div>
                    <div class="module-title">Boost Sistem FF</div>
                    <div class="module-desc">Kunci standby-bucket Free Fire ke Active & bersihkan cache internal FF</div>
                  </div>
                  <label class="switch"><input type="checkbox" id="sw-6" onchange="toggleMod(6,'Boost Sistem FF')"><span class="slider"></span></label>
                </div>
              </div>

              <div class="module-card" id="card-7">
                <div class="module-top">
                  <div>
                    <div class="module-title">Grafik Ringan (Tanpa Downscale)</div>
                    <div class="module-desc">Optimasi driver grafis khusus paket Free Fire tanpa menurunkan resolusi</div>
                  </div>
                  <label class="switch"><input type="checkbox" id="sw-7" onchange="toggleMod(7,'Grafik Ringan FF')"><span class="slider"></span></label>
                </div>
                <div class="sub-control">
                  <select class="select-box" id="light-mode" onchange="document.getElementById('sw-7').checked=true;toggleMod(7,'Grafik Ringan FF')">
                    <option value="1">Mode 1: Super Ringan (Production Driver + Loading Boost FF)</option>
                    <option value="2">Mode 2: Mode PC (ANGLE OpenGL Driver Khusus Paket FF)</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="status-box" id="status-log">Status: Menunggu perintah...</div>
            <button class="btn" onclick="AndroidBridge.launchFreeFire()">Buka Free Fire Sekarang</button>

            <div class="bottom-bar">
              <div class="nav-btn active" onclick="window.scrollTo(0,0)">Menu Utama</div>
              <div class="nav-btn hidden" id="nav-dev" onclick="document.getElementById('dev-panel').classList.toggle('hidden')">Panel Key</div>
              <div class="nav-btn" onclick="AndroidBridge.resetAll()">Reset FF</div>
              <div class="nav-btn" onclick="AndroidBridge.launchFreeFire()">Buka Game</div>
            </div>

            <script>
              const DEV_KEY = "DANZ-DEV-999";
              let myHwid = window.AndroidBridge ? AndroidBridge.getHwid() : "HWID-01";
              let shizukuOk = false;
              let sensi = 4;

              document.getElementById('hwid-label').innerText = myHwid;

              function setShizukuStatus(ok) {
                shizukuOk = ok;
                const p = document.getElementById('shz-pill');
                if (ok) {
                  p.innerText = "Terhubung";
                  p.classList.add('ok');
                }
              }

              function getKeys() {
                const raw = localStorage.getItem('danz_v8_keys');
                if (!raw) {
                  const def = [{ key: "DANZ-VIP-001", hwid: "", status: "AKTIF" }];
                  localStorage.setItem('danz_v8_keys', JSON.stringify(def));
                  return def;
                }
                return JSON.parse(raw);
              }

              function saveKeys(list) {
                localStorage.setItem('danz_v8_keys', JSON.stringify(list));
                renderKeyList();
              }

              function verifyKey() {
                if (!shizukuOk) {
                  AndroidBridge.toast("Hubungkan dan izinkan Shizuku terlebih dahulu");
                  AndroidBridge.connectShizuku();
                  return;
                }
                const k = document.getElementById('key-input').value.trim().toUpperCase();
                if (!k) { AndroidBridge.toast("Masukkan kode lisensi"); return; }

                if (k === DEV_KEY) {
                  document.getElementById('login-screen').classList.add('hidden');
                  document.getElementById('nav-dev').classList.remove('hidden');
                  document.getElementById('dev-panel').classList.remove('hidden');
                  renderKeyList();
                  return;
                }

                let list = getKeys();
                let item = list.find(x => x.key === k);
                if (!item && k.startsWith("DANZ-KEY-")) {
                  item = { key: k, hwid: myHwid, status: "AKTIF" };
                  list.push(item);
                }
                if (!item) { AndroidBridge.toast("Kode lisensi tidak terdaftar"); return; }
                if (item.status !== "AKTIF") { AndroidBridge.toast("Lisensi ini telah dinonaktifkan oleh Developer"); return; }
                if (item.hwid && item.hwid !== "" && item.hwid !== myHwid) {
                  AndroidBridge.toast("Lisensi sudah terikat di perangkat lain (1 Key 1 HP)");
                  return;
                }
                item.hwid = myHwid;
                saveKeys(list);
                document.getElementById('login-screen').classList.add('hidden');
              }

              function createNewKey() {
                let c = document.getElementById('custom-key').value.trim().toUpperCase();
                let h = document.getElementById('target-hwid').value.trim().toUpperCase();
                let r = Math.random().toString(36).substring(2, 6).toUpperCase();
                let k = c ? c : ("DANZ-KEY-" + r);
                let list = getKeys();
                list.unshift({ key: k, hwid: h, status: "AKTIF" });
                saveKeys(list);
                document.getElementById('custom-key').value = "";
                AndroidBridge.copyText(k);
              }

              function toggleKeyStatus(k) {
                let list = getKeys();
                let it = list.find(x => x.key === k);
                if (it) {
                  it.status = (it.status === "AKTIF") ? "BERHENTI" : "AKTIF";
                  saveKeys(list);
                }
              }

              function resetHwid(k) {
                let list = getKeys();
                let it = list.find(x => x.key === k);
                if (it) {
                  it.hwid = "";
                  saveKeys(list);
                  AndroidBridge.toast("ID Perangkat direset untuk " + k);
                }
              }

              function renderKeyList() {
                document.getElementById('key-list').innerHTML = getKeys().map(x => `
                  <div class="key-row">
                    <div>
                      <b>${x.key}</b>
                      <div style="color:var(--muted)">HP: ${x.hwid || 'Belum Terikat'} | Status: ${x.status}</div>
                    </div>
                    <div>
                      <button class="tag-btn" onclick="AndroidBridge.copyText('${x.key}')">Salin</button>
                      <button class="tag-btn" onclick="resetHwid('${x.key}')">Reset HP</button>
                      <button class="tag-btn danger" onclick="toggleKeyStatus('${x.key}')">${x.status === 'AKTIF' ? 'Stop Key' : 'Aktifkan'}</button>
                    </div>
                  </div>
                `).join('');
              }

              function changeSensi(d) {
                sensi = Math.min(7, Math.max(1, sensi + d));
                document.getElementById('sensi-val').innerText = sensi;
                document.getElementById('sw-5').checked = true;
                toggleMod(5, 'Sensitivitas FF Lv.' + sensi);
              }

              function toggleMod(id, name) {
                const sw = document.getElementById('sw-' + id);
                const card = document.getElementById('card-' + id);
                const mode = parseInt(document.getElementById('light-mode').value || "1");
                if (sw.checked) {
                  card.classList.add('active');
                  const res = AndroidBridge.runFeature(id, name, true, sensi, mode);
                  document.getElementById('status-log').innerText = "Status: " + res;
                } else {
                  card.classList.remove('active');
                  const res = AndroidBridge.runFeature(id, name, false, sensi, 0);
                  document.getElementById('status-log').innerText = "Status: " + res;
                }
              }
            </script>
          </body>
          </html>
          EOF

          echo "sdk.dir=$ANDROID_HOME" > clean_apk/local.properties
          cd clean_apk && gradle assembleDebug --no-daemon

      - name: Upload DANZSTRAIGHT V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: DANZSTRAIGHT-V8-PURE-FF
          path: clean_apk/app/build/outputs/apk/debug/*.apk
