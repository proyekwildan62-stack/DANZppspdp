name: Inject DANZSTRAIGHT ke Free Fire
on: [push, workflow_dispatch]

jobs:
  inject-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Apktool & Signer
        run: |
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar

      - name: Bongkar (Decompile) APK Free Fire
        run: |
          # Pastikan file ff-ori.apk sudah kamu upload ke repo GitHub kamu
          if [ ! -f "ff-ori.apk" ]; then
            echo "Error: File ff-ori.apk tidak ditemukan di repositori!"
            exit 1
          fi
          java -jar apktool.jar d ff-ori.apk -o decompiled_ff -f

      - name: Suntikkan (Inject) Mod
        run: |
          # Membuat folder library jika belum ada
          mkdir -p decompiled_ff/lib/arm64-v8a
          mkdir -p decompiled_ff/lib/armeabi-v7a
          
          # Menyalin file mod libDANZ.so ke dalam APK gamenya
          # Pastikan file libDANZ.so sudah kamu upload ke repo GitHub
          if [ -f "libDANZ.so" ]; then
            cp libDANZ.so decompiled_ff/lib/arm64-v8a/
            cp libDANZ.so decompiled_ff/lib/armeabi-v7a/
            echo "Berhasil menyuntikkan mod ke dalam game!"
          else
            echo "Peringatan: File libDANZ.so tidak ditemukan, injeksi dilewati."
          fi

      - name: Rakit Ulang (Recompile) APK
        run: |
          java -jar apktool.jar b decompiled_ff -o ff-mod-unsigned.apk

      - name: Sign APK (Agar bisa diinstal)
        run: |
          java -jar signer.jar -a ff-mod-unsigned.apk --out final_apk/

      - name: Upload APK Hasil Inject
        uses: actions/upload-artifact@v4
        with:
          name: FREE-FIRE-DANZSTRAIGHT-INJECTED
          path: final_apk/*.apk
