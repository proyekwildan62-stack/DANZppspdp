                                  mainHandler.post(() -> Toast.makeText(ctx, "Shizuku belum aktif/diizinkan!", Toast.LENGTH_SHORT).show());
                              }
                              return;
                          }
                          Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                          m.setAccessible(true);
                          java.lang.Process p = (java.lang.Process) m.invoke(
                              null,
                              new String[]{"sh", "-c", script + "\nexit 0"},
                              null,
                              null
                          );
                          try { p.getOutputStream().close(); } catch (Exception ignored) {}
                          try { p.getInputStream().close(); } catch (Exception ignored) {}
                          try { p.getErrorStream().close(); } catch (Exception ignored) {}
                          p.waitFor();

                          if (toastMsg != null) {
                              mainHandler.post(() -> Toast.makeText(ctx, toastMsg, Toast.LENGTH_SHORT).show());
                          }
                      } catch (Throwable e) {
                          if (toastMsg != null) {
                              mainHandler.post(() -> Toast.makeText(ctx, "Error: " + e.getMessage(), Toast.LENGTH_SHORT).show());
                          }
                      }
                  });
              }

              private final Shizuku.OnRequestPermissionResultListener PERM_LISTENER = (req, res) -> {
                  boolean ok = (res == PackageManager.PERMISSION_GRANTED);
                  runOnUiThread(() -> {
                      if (ok) {
                          Toast.makeText(MainActivity.this, "Shizuku Terhubung! Izin Panel Overlay Diaktifkan.", Toast.LENGTH_SHORT).show();
                          webView.evaluateJavascript("setShizukuStatus(true)", null);
                          cleanAndGrantOverlayPermission();
                      } else {
                          Toast.makeText(MainActivity.this, "Izin Shizuku Ditolak", Toast.LENGTH_LONG).show();
                      }
                  });
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  supportRequestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setStatusBarColor(Color.parseColor("#0B0E14"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0B0E14"));

                  Shizuku.addRequestPermissionResultListener(PERM_LISTENER);

                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  webView.setBackgroundColor(Color.parseColor("#0B0E14"));
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }

              @Override
              protected void onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(PERM_LISTENER);
                  super.onDestroy();
              }

              // Memberikan izin SYSTEM_ALERT_WINDOW otomatis lewat Shizuku agar Panel Melayang langsung bisa muncul di atas Free Fire!
              private void cleanAndGrantOverlayPermission() {
                  if (cleanedOnce) return;
                  cleanedOnce = true;
                  StringBuilder clean = new StringBuilder();
                  clean.append("appops set com.danzstraight.mod SYSTEM_ALERT_WINDOW allow >/dev/null 2>&1\n");
                  clean.append("cmd appops set com.danzstraight.mod SYSTEM_ALERT_WINDOW allow >/dev/null 2>&1\n");
                  clean.append("wm size reset >/dev/null 2>&1\n");
                  clean.append("wm density reset >/dev/null 2>&1\n");
                  String[] compatFlags = {"DOWNSCALED","DOWNSCALE_90","DOWNSCALE_85","DOWNSCALE_80","DOWNSCALE_75","DOWNSCALE_70","DOWNSCALE_65","DOWNSCALE_60","DOWNSCALE_55","DOWNSCALE_50","DOWNSCALE_45","DOWNSCALE_40","DOWNSCALE_35","DOWNSCALE_30"};
                  for (String f : compatFlags) {
                      clean.append("am compat reset ").append(f).append(" com.dts.freefireth >/dev/null 2>&1\n");
                      clean.append("am compat reset ").append(f).append(" com.dts.freefiremax >/dev/null 2>&1\n");
                  }
                  executeShizukuStatic(this, clean.toString(), null);
              }

              private void startFloatingPanelService() {
                  bgExecutor.execute(() -> {
                      // Pastikan izin overlay diberikan oleh Shizuku sebelum membuka panel
                      executeShizukuStatic(
                          MainActivity.this,
                          "appops set com.danzstraight.mod SYSTEM_ALERT_WINDOW allow >/dev/null 2>&1\n" +
                          "cmd appops set com.danzstraight.mod SYSTEM_ALERT_WINDOW allow >/dev/null 2>&1\n",
                          null
                      );
                      mainHandler.postDelayed(() -> {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(MainActivity.this)) {
                              Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                              startActivity(intent);
                              Toast.makeText(MainActivity.this, "Izinkan 'Tampilkan di atas aplikasi lain' satu kali", Toast.LENGTH_LONG).show();
                          } else {
                              startService(new Intent(MainActivity.this, FloatingModService.class));
                              Toast.makeText(MainActivity.this, "Panel Melayang [DZ] Aktif! Ketuk ikon [DZ] di dalam game.", Toast.LENGTH_SHORT).show();
                          }
                      }, 350);
                  });
              }

              public class Bridge {
                  @JavascriptInterface
                  public String getHwid() {
                      String id = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                      return id != null ? id.toUpperCase() : "HWID-001";
                  }

                  @JavascriptInterface
                  public void connectShizuku() {
                      runOnUiThread(() -> {
                          try {
                              if (!Shizuku.pingBinder()) {
                                  Toast.makeText(MainActivity.this, "Buka aplikasi Shizuku dan klik Start terlebih dahulu", Toast.LENGTH_LONG).show();
                                  Intent i = getPackageManager().getLaunchIntentForPackage("moe.shizuku.privileged.api");
                                  if (i != null) startActivity(i);
                                  return;
                              }
                              if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                                  webView.evaluateJavascript("setShizukuStatus(true)", null);
                                  cleanAndGrantOverlayPermission();
                              } else {
                                  Shizuku.requestPermission(101);
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Shizuku belum aktif", Toast.LENGTH_SHORT).show();
                          }
                      });
