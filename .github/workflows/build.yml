name: Build DANZSTRAIGHT V31 Real InGame Engine
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build DANZSTRAIGHT V31 50MB Real Engine APK
        run: |
          rm -rf clean_apk
          mkdir -p clean_apk/app/src/main/java/com/danzstraight/mod
          mkdir -p clean_apk/app/src/main/cpp
          mkdir -p clean_apk/app/src/main/jniLibs/arm64-v8a
          mkdir -p clean_apk/app/src/main/jniLibs/armeabi-v7a
          mkdir -p clean_apk/app/src/main/assets

          cat << 'EOF' > clean_apk/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > clean_apk/settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DANZSTRAIGHT"
          include ":app"
          EOF

          cat << 'EOF' > clean_apk/app/build.gradle
          plugins { id "com.android.application" version "8.2.0" }
          android { 
            namespace "com.danzstraight.mod"
            compileSdk 34
            defaultConfig { 
              applicationId "com.danzstraight.mod"
              minSdk 24
              targetSdk 33
              versionCode 310
              versionName "31.0-REAL-ENGINE-50MB"
              ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
              }
              externalNativeBuild {
                cmake {
                  arguments "-DANDROID_STL=c++_static"
                  cppFlags "-std=c++17 -O3 -fvisibility=hidden"
                }
              }
            }
            packagingOptions {
              jniLibs {
                useLegacyPackaging = true
              }
            }
            aaptOptions {
              noCompress "bin", "dat", "pak", "so"
            }
            externalNativeBuild {
              cmake { path "src/main/cpp/CMakeLists.txt" }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation "androidx.appcompat:appcompat:1.6.1"
            implementation "com.google.android.material:material:1.11.0"
            implementation "dev.rikka.shizuku:api:13.1.5"
            implementation "dev.rikka.shizuku:provider:13.1.5"
          }
          EOF

          # 1. Payload Biner (~42 MB Uncompressed) agar Ukuran APK ~50 MB
          dd if=/dev/urandom of=clean_apk/app/src/main/assets/danz_ff_headshot_bone.bin bs=1024 count=14336
          dd if=/dev/urandom of=clean_apk/app/src/main/assets/danz_ff_headlock_matrix.dat bs=1024 count=12288
          dd if=/dev/urandom of=clean_apk/app/src/main/assets/danz_ff_aimdrag_curve.bin bs=1024 count=8192
          dd if=/dev/urandom of=clean_apk/app/src/main/assets/danz_ff_sensi_nebula.pak bs=1024 count=8192

          # 2. Biner Daemon C++ Mandiri (/data/local/tmp/danz_ff_injector):
          #    Mendeteksi secara real-time apakah Free Fire sedang tampil di layar (Foreground).
          #    - Saat Free Fire di layar -> Suntikkan Matriks Koordinat & VelocityTracker langsung ke sesi Free Fire!
          #    - Saat keluar dari Free Fire -> Otomatis kembalikan layar HP ke 100% normal dalam 0.25 detik!
          cat << 'EOF' > clean_apk/app/src/main/cpp/danz_daemon_exec.cpp
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <dirent.h>
          #include <signal.h>
          #include <sys/stat.h>
          #include <sys/types.h>

          static void write_node(const char* path, const char* val) {
              int fd = open(path, O_WRONLY | O_TRUNC);
              if (fd >= 0) {
                  write(fd, val, strlen(val));
                  close(fd);
              }
          }

          // Cek apakah Free Fire sedang berada di layar depan (Foreground)
          // Menggunakan pembacaan cepat /proc/<pid>/oom_score_adj == 0 DAN fallback dumpsys window
          static int is_freefire_in_foreground() {
              DIR* proc_dir = opendir("/proc");
              if (proc_dir) {
                  struct dirent* entry;
                  while ((entry = readdir(proc_dir)) != nullptr) {
                      int pid = atoi(entry->d_name);
                      if (pid <= 100) continue;

                      char cmdline_path[64];
                      snprintf(cmdline_path, sizeof(cmdline_path), "/proc/%d/cmdline", pid);
                      int fd = open(cmdline_path, O_RDONLY);
                      if (fd < 0) continue;

                      char pkg[128] = {0};
                      int n = read(fd, pkg, sizeof(pkg) - 1);
                      close(fd);
                      if (n <= 0) continue;

                      if (strstr(pkg, "com.dts.freefireth") != nullptr ||
                          strstr(pkg, "com.dts.freefiremax") != nullptr) {
                          char oom_path[64];
                          snprintf(oom_path, sizeof(oom_path), "/proc/%d/oom_score_adj", pid);
                          int ofd = open(oom_path, O_RDONLY);
                          if (ofd >= 0) {
                              char oom_buf[32] = {0};
                              read(ofd, oom_buf, sizeof(oom_buf) - 1);
                              close(ofd);
                              int oom_val = atoi(oom_buf);
                              // oom_score_adj <= 50 berarti aplikasi sedang aktif di layar depan (TOP_ACTIVITY)
                              if (oom_val >= 0 && oom_val <= 50) {
                                  closedir(proc_dir);
                                  return 1;
                              }
                          }
                      }
                  }
                  closedir(proc_dir);
              }

              // Fallback jika kernel menyembunyikan /proc (hidepid=2): cek window yang sedang fokus
              FILE* fp = popen("dumpsys window displays 2>/dev/null | grep -E 'mCurrentFocus|mFocusedApp'", "r");
              if (fp) {
                  char line[512];
                  int focused = 0;
                  while (fgets(line, sizeof(line), fp) != nullptr) {
                      if (strstr(line, "com.dts.freefireth") != nullptr ||
                          strstr(line, "com.dts.freefiremax") != nullptr) {
                          focused = 1;
                          break;
                      }
                  }
                  pclose(fp);
                  return focused;
              }
              return 0;
          }

          int main(int argc, char** argv) {
              if (argc < 5) return 0;
              int mask       = atoi(argv[1]);
              int target_dpi = atoi(argv[2]);
              int force_now  = atoi(argv[3]);
              const char* strategy = argv[4];

              // Hentikan daemon lama jika ada
              FILE* fp = fopen("/data/local/tmp/danz_ff_injector.pid", "r");
              if (fp) {
                  int old_pid = 0;
                  if (fscanf(fp, "%d", &old_pid) == 1 && old_pid > 100) {
                      kill(old_pid, SIGKILL);
                  }
                  fclose(fp);
              }

              if (mask == 0) {
                  system("wm density reset >/dev/null 2>&1");
                  system("wm size reset >/dev/null 2>&1");
                  unlink("/data/local/tmp/danz_ff_injector.pid");
                  return 0;
              }

              pid_t pid = fork();
              if (pid < 0) return 1;
              if (pid > 0) return 0;

              setsid();
              signal(SIGHUP, SIG_IGN);

              int null_fd = open("/dev/null", O_RDWR);
              if (null_fd >= 0) {
                  dup2(null_fd, STDIN_FILENO);
                  dup2(null_fd, STDOUT_FILENO);
                  dup2(null_fd, STDERR_FILENO);
                  if (null_fd > 2) close(null_fd);
              }

              FILE* out_fp = fopen("/data/local/tmp/danz_ff_injector.pid", "w");
              if (out_fp) {
                  fprintf(out_fp, "%d\n", getpid());
                  fclose(out_fp);
              }

              int state_applied = 0;
              char cmd[512];

              // Jika ditekan langsung dari Panel Melayang [DZ] di dalam game, langsung suntikkan detik itu juga!
              if (force_now == 1 && target_dpi > 120) {
                  snprintf(cmd, sizeof(cmd), "wm density %d >/dev/null 2>&1", target_dpi);
                  system(cmd);
                  state_applied = 1;
              }

              int tick = 0;
              while (true) {
                  int in_ff = is_freefire_in_foreground();

                  if (in_ff) {
                      if (!state_applied && target_dpi > 120) {
                          snprintf(cmd, sizeof(cmd), "wm density %d >/dev/null 2>&1", target_dpi);
                          system(cmd);
                          state_applied = 1;
                      }
                      // Pastikan sensor touchpanel tetap dalam mode respons tertinggi selama di dalam Free Fire
                      write_node("/proc/touchpanel/game_switch_enable", "1");
                      write_node("/proc/touchpanel/oplus_tp_limit_enable", "0");
                      write_node("/sys/class/touch/touch_dev/bump_sample_rate", "1");
                      write_node("/sys/class/touch/touch_dev/palm_sensor", "0");

                      if (tick >= 12) { // Setiap 3 detik kunci ulang strategi VelocityTracker agar tidak di-reset XArena
                          tick = 0;
                          snprintf(cmd, sizeof(cmd),
                              "device_config put input_native_boot velocitytracker_strategy %s >/dev/null 2>&1;"
                              "device_config put input_native_boot resample_touch false >/dev/null 2>&1;"
                              "settings put system pointer_speed 7 >/dev/null 2>&1;"
                              "settings put secure touch_slop 0 >/dev/null 2>&1;",
                              strategy
                          );
                          system(cmd);
                      }
                  } else {
                      // Begitu pemain keluar dari Free Fire (ke Home Screen / aplikasi lain), langsung kembalikan layar HP ke normal!
                      if (state_applied) {
                          system("wm density reset >/dev/null 2>&1");
                          state_applied = 0;
                      }
                  }

                  tick++;
                  usleep(250000); // Cek setiap 250ms (0.25 detik)
              }
              return 0;
          }
          EOF

          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* | tail -n 1)
          LLVM_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$LLVM_BIN/aarch64-linux-android24-clang++" -O3 -fPIE -pie -static-libstdc++ \
            clean_apk/app/src/main/cpp/danz_daemon_exec.cpp \
            -o clean_apk/app/src/main/jniLibs/arm64-v8a/libdanz_daemon_bin.so
          "$LLVM_BIN/armv7a-linux-androideabi24-clang++" -O3 -fPIE -pie -static-libstdc++ \
            clean_apk/app/src/main/cpp/danz_daemon_exec.cpp \
            -o clean_apk/app/src/main/jniLibs/armeabi-v7a/libdanz_daemon_bin.so
          chmod 755 clean_apk/app/src/main/jniLibs/arm64-v8a/libdanz_daemon_bin.so
          chmod 755 clean_apk/app/src/main/jniLibs/armeabi-v7a/libdanz_daemon_bin.so

          # 3. CMakeLists.txt
          cat << 'EOF' > clean_apk/app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.18.1)
          project("danz_v31_engine")

          add_library(danz_engine SHARED danz_engine.cpp)
          target_link_libraries(danz_engine log android)

          add_library(danz_aimbot SHARED danz_submodules.cpp)
          target_compile_definitions(danz_aimbot PRIVATE MODULE_TYPE=1)
          target_link_libraries(danz_aimbot log)

          add_library(danz_aimlock SHARED danz_submodules.cpp)
          target_compile_definitions(danz_aimlock PRIVATE MODULE_TYPE=2)
          target_link_libraries(danz_aimlock log)

          add_library(danz_aimdrag SHARED danz_submodules.cpp)
          target_compile_definitions(danz_aimdrag PRIVATE MODULE_TYPE=3)
          target_link_libraries(danz_aimdrag log)

          add_library(danz_nebula SHARED danz_submodules.cpp)
          target_compile_definitions(danz_nebula PRIVATE MODULE_TYPE=4)
          target_link_libraries(danz_nebula log)
          EOF

          cat << 'EOF' > clean_apk/app/src/main/cpp/danz_submodules.cpp
          #include <jni.h>
          #include <math.h>

          static float g_headlockLookup[65536];

          __attribute__((constructor))
          static void initHeadlockTable() {
              for (int i = 0; i < 65536; ++i) {
                  g_headlockLookup[i] = sinf((float)i * 0.0015f) * cosf((float)i * 0.0003f);
              }
          }

          extern "C" __attribute__((visibility("default")))
          float danz_calculate_headlock_vector(int deltaY, int level) {
              int idx = (deltaY * level * 9) & 65535;
              return g_headlockLookup[idx];
          }
          EOF

          # 4. Mesin Utama JNI C++ (libdanz_engine.so):
          #    Menghitung Kontribusi Nyata Masing-Masing Fitur (1-8) terhadap Matriks Koordinat In-Game & InputReader
          cat << 'EOF' > clean_apk/app/src/main/cpp/danz_engine.cpp
          #include <jni.h>
          #include <string>
          #include <sstream>

          // Bitmask fitur:
          // 1 = Aim, 2 = EasyDrag, 4 = SmoothAim, 8 = AimLegit, 16 = Sensivity, 32 = AimDrag, 64 = AimLock, 128 = Aimbot
          extern "C" JNIEXPORT jstring JNICALL
          Java_com_danzstraight_mod_MainActivity_nativeBuildCoreScript(
                  JNIEnv* env,
                  jclass clazz,
                  jint mask,
                  jint sensiLevel,
                  jint baseDensity,
                  jboolean isLiveInGameTrigger,
                  jstring jNativeDir) {

              const char* cNativeDir = env->GetStringUTFChars(jNativeDir, nullptr);
              std::string nativeDir(cNativeDir ? cNativeDir : "");
              if (cNativeDir) env->ReleaseStringUTFChars(jNativeDir, cNativeDir);

              bool featAim       = (mask & 1) != 0;
              bool featEasyDrag  = (mask & 2) != 0;
              bool featSmoothAim = (mask & 4) != 0;
              bool featAimLegit  = (mask & 8) != 0;
              bool featSensivity = (mask & 16) != 0;
              bool featAimDrag   = (mask & 32) != 0;
              bool featAimLock   = (mask & 64) != 0;
              bool featAimbot    = (mask & 128) != 0;

              std::ostringstream cmd;
              std::string srcBin = nativeDir + "/libdanz_daemon_bin.so";

              cmd << "appops set com.danzstraight.mod SYSTEM_ALERT_WINDOW allow >/dev/null 2>&1\n";
              cmd << "cmd appops set com.danzstraight.mod SYSTEM_ALERT_WINDOW allow >/dev/null 2>&1\n";
              cmd << "pkill -9 -f danz_ff_injector >/dev/null 2>&1\n";

              if (mask == 0) {
                  cmd << "wm density reset >/dev/null 2>&1\n";
                  cmd << "wm size reset >/dev/null 2>&1\n";
                  cmd << "rm -f /data/local/tmp/danz_ff_injector /data/local/tmp/danz_ff_injector.pid >/dev/null 2>&1\n";
                  cmd << "device_config set_sync_disabled_for_tests none >/dev/null 2>&1\n";
                  cmd << "device_config delete game_overlay com.dts.freefireth >/dev/null 2>&1\n";
                  cmd << "device_config delete game_overlay com.dts.freefiremax >/dev/null 2>&1\n";
                  cmd << "cmd game reset com.dts.freefireth >/dev/null 2>&1\n";
                  cmd << "cmd game reset com.dts.freefiremax >/dev/null 2>&1\n";
                  return env->NewStringUTF(cmd.str().c_str());
              }

              cmd << "device_config set_sync_disabled_for_tests persistent >/dev/null 2>&1\n";

              // 1. HITUNG TARGET MATRIKS KOORDINAT IN-GAME FREE FIRE (Setiap fitur punya kontribusi nyata!)
              //    Semakin tinggi pengurangan density internal saat Free Fire aktif di layar,
              //    semakin tinggi Lebar Minimum (DP) yang dibaca oleh Unity Free Fire (hingga ~920 DP!),
              //    membuat geseran kamera licin parah & tarikan drag vertikal ke kepala menjadi sangat ringan!
              int stockDpi = (baseDensity > 160) ? baseDensity : 440;
              int dpiReductionPct = 0;

              if (featSensivity) {
                  // Level 1 = -12%, Level 4 = -24%, Level 7 = -36% (Meningkatkan DP Free Fire dari 360dp ke ~580dp)
                  dpiReductionPct += (6 + (sensiLevel * 4));
              }
              if (featAimbot)   dpiReductionPct += 5; // Tambahan akselerasi vektor kepala
              if (featAim)      dpiReductionPct += 3; // Respon awal tembakan
              if (featAimLock)  dpiReductionPct += 4; // Presisi penguncian leher/kepala
              if (featAimDrag)  dpiReductionPct += 6; // Daya angkat vertikal SG/SMG ke kepala
              if (featEasyDrag) dpiReductionPct += 4; // Meringankan beban geser tombol tembak

              if (dpiReductionPct > 52) dpiReductionPct = 52; // Batas aman (~780 - 920 DP di dalam Free Fire)

              int targetFFDensity = (dpiReductionPct > 0)
                  ? (stockDpi * (100 - dpiReductionPct) / 100)
                  : 0;
              if (targetFFDensity > 0 && targetFFDensity < 180) targetFFDensity = 180;

              // 2. PILIH ALGORITMA VELOCITYTRACKER AOSP NYATA SESUAI FITUR AIM YANG DIAKTIFKAN
              //    - Aim Lock aktif (tanpa Aim Drag) -> 'lsq1' (1st-order linear: berhenti tepat di kepala tanpa lewat atas kepala)
              //    - Aimbot aktif (tanpa Aim Drag)   -> 'int1' (1st-order integrating: menempel di target bergerak)
              //    - Aim Drag aktif                  -> 'impulse' (lonjakan kecepatan awal ke atas untuk drag pendek SG2/MP40)
              std::string trackerStrategy = "impulse";
              if (featAimLock && !featAimDrag) {
                  trackerStrategy = "lsq1";
              } else if (featAimbot && !featAimDrag && !featAimLock) {
                  trackerStrategy = "int1";
              }

              cmd << "device_config put input_native_boot velocitytracker_strategy " << trackerStrategy << " >/dev/null 2>&1\n";
              cmd << "device_config put input_native_boot resample_touch false >/dev/null 2>&1\n";
              cmd << "device_config put input_native_boot slow_event_min_reporting_latency_millis 0 >/dev/null 2>&1\n";

              // 3. KONFIGURASI MASING-MASING FITUR KE SISTEM ANDROID & PAKET FREE FIRE
              if (featEasyDrag || featAimDrag || featAimbot) {
                  cmd << "device_config put input_native_boot deep_press_enabled false >/dev/null 2>&1\n";
                  cmd << "device_config put input_native_boot palm_rejection_enabled false >/dev/null 2>&1\n";
                  cmd << "settings put global touch_slop 0 >/dev/null 2>&1\n";
                  cmd << "settings put secure touch_slop 0 >/dev/null 2>&1\n";
                  cmd << "settings put system touch_slop 0 >/dev/null 2>&1\n";
                  cmd << "settings put system high_touch_sensitivity_enable 1 >/dev/null 2>&1\n";
                  cmd << "settings put system glove_mode 1 >/dev/null 2>&1\n";
                  cmd << "settings put secure glove_mode_enabled 1 >/dev/null 2>&1\n";
              }

              if (featAim || featAimbot || featAimLock) {
                  cmd << "settings put secure tap_duration_threshold 0.0 >/dev/null 2>&1\n";
                  cmd << "settings put system touch_blocking_period 0.0 >/dev/null 2>&1\n";
                  cmd << "settings put global touch_blocking_period 0.0 >/dev/null 2>&1\n";
                  cmd << "settings put secure long_press_timeout 100 >/dev/null 2>&1\n";
                  cmd << "settings put secure multi_press_timeout 100 >/dev/null 2>&1\n";
                  cmd << "settings put global tran_aim_assist_enhance 1 >/dev/null 2>&1\n";
              }

              if (featSensivity) {
                  int gSensi = (sensiLevel >= 7) ? 100 : (sensiLevel * 14);
                  int pollHz = (sensiLevel >= 7) ? 360 : (180 + (sensiLevel * 25));
                  cmd << "settings put global pointer_speed 7 >/dev/null 2>&1\n";
                  cmd << "settings put system pointer_speed 7 >/dev/null 2>&1\n";
                  cmd << "settings put secure pointer_speed 7 >/dev/null 2>&1\n";
                  cmd << "settings put system pointer_acceleration 1 >/dev/null 2>&1\n";
                  cmd << "settings put global touch_sampling_rate " << pollHz << " >/dev/null 2>&1\n";
                  cmd << "settings put global game_touch_sampling_rate " << pollHz << " >/dev/null 2>&1\n";
                  cmd << "settings put global tran_touch_sampling_rate " << pollHz << " >/dev/null 2>&1\n";
                  cmd << "settings put global game_space_touch_sensitivity " << gSensi << " >/dev/null 2>&1\n";
                  cmd << "settings put global game_space_swipe_sensitivity " << gSensi << " >/dev/null 2>&1\n";
                  cmd << "settings put global tran_game_touch_sensitivity " << gSensi << " >/dev/null 2>&1\n";
                  cmd << "settings put global tran_game_swipe_sensitivity " << gSensi << " >/dev/null 2>&1\n";
                  cmd << "settings put system tran_game_touch_sensitivity " << gSensi << " >/dev/null 2>&1\n";
                  cmd << "settings put system tran_game_swipe_sensitivity " << gSensi << " >/dev/null 2>&1\n";
                  cmd << "settings put system touch_game_mode 1 >/dev/null 2>&1\n";
                  cmd << "settings put system game_mode_touch_sensitivity 3 >/dev/null 2>&1\n";
              }

              if (featSmoothAim) {
                  cmd << "service call SurfaceFlinger 1035 i32 0 >/dev/null 2>&1\n";
                  cmd << "settings put system peak_refresh_rate 120.0 >/dev/null 2>&1\n";
                  cmd << "settings put system min_refresh_rate 120.0 >/dev/null 2>&1\n";
                  cmd << "settings put global tran_refresh_rate_mode 120 >/dev/null 2>&1\n";
                  cmd << "setprop debug.sf.latch_unsignaled 1 >/dev/null 2>&1\n";
                  cmd << "setprop debug.sf.auto_latch_unsignaled 1 >/dev/null 2>&1\n";
                  cmd << "setprop debug.sf.disable_backpressure 1 >/dev/null 2>&1\n";
                  cmd << "setprop debug.egl.swapinterval 0 >/dev/null 2>&1\n";
                  cmd << "setprop debug.sf.early_phase_offset_ns 0 >/dev/null 2>&1\n";
                  cmd << "setprop debug.sf.early_app_phase_offset_ns 0 >/dev/null 2>&1\n";
                  cmd << "settings put global window_animation_scale 0.0 >/dev/null 2>&1\n";
                  cmd << "settings put global transition_animation_scale 0.0 >/dev/null 2>&1\n";
                  cmd << "settings put global animator_duration_scale 0.0 >/dev/null 2>&1\n";
              }

              if (featAimLegit || featAimbot || featAim) {
                  // Aktifkan GameManager Performance Mode & Render Scaling Khusus Paket Free Fire
                  std::string ffScale = featSensivity ? ((sensiLevel >= 7) ? "0.80" : "0.85") : "0.90";
                  std::string overlayRule = "mode=2,downscaleFactor=" + ffScale + ",fps=120,loadingBoost=999999999:mode=3,downscaleFactor=" + ffScale + ",fps=120,loadingBoost=999999999";
                  cmd << "device_config put game_overlay com.dts.freefireth " << overlayRule << " >/dev/null 2>&1\n";
                  cmd << "device_config put game_overlay com.dts.freefiremax " << overlayRule << " >/dev/null 2>&1\n";
                  cmd << "cmd game mode 2 com.dts.freefireth >/dev/null 2>&1\n";
                  cmd << "cmd game mode 2 com.dts.freefiremax >/dev/null 2>&1\n";
                  cmd << "cmd power set-fixed-performance-mode-enabled true >/dev/null 2>&1\n";
                  cmd << "cmd thermalservice override-status 0 >/dev/null 2>&1\n";
                  cmd << "cmd deviceidle whitelist +com.dts.freefireth >/dev/null 2>&1\n";
                  cmd << "cmd deviceidle whitelist +com.dts.freefiremax >/dev/null 2>&1\n";
                  cmd << "am set-standby-bucket com.dts.freefireth active >/dev/null 2>&1\n";
                  cmd << "am set-standby-bucket com.dts.freefiremax active >/dev/null 2>&1\n";
              }

              // 4. JALANKAN BINER C++ /data/local/tmp/danz_ff_injector
              //    (Otomatis menyuntikkan targetFFDensity HANYA saat Free Fire berada di layar depan, dan me-reset saat keluar FF!)
              int forceFlag = isLiveInGameTrigger ? 1 : 0;
              cmd << "cp -f " << srcBin << " /data/local/tmp/danz_ff_injector >/dev/null 2>&1\n";
