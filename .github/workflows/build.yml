              private void setupDragAndClick(View target, Runnable onClickAction) {
                  target.setOnTouchListener(new View.OnTouchListener() {
                      private int initX, initY;
                      private float touchX, touchY;
                      private boolean moved = false;

                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  initX = params.x;
                                  initY = params.y;
                                  touchX = e.getRawX();
                                  touchY = e.getRawY();
                                  moved = false;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  int dx = (int) (e.getRawX() - touchX);
                                  int dy = (int) (e.getRawY() - touchY);
                                  if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
                                  params.x = initX + dx;
                                  params.y = initY + dy;
                                  try { wm.updateViewLayout(rootContainer, params); } catch (Exception ignored) {}
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (!moved && onClickAction != null) {
                                      onClickAction.run();
                                  }
                                  return true;
                          }
                          return false;
                      }
                  });
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (wm != null && rootContainer != null) {
                      try { wm.removeView(rootContainer); } catch (Exception ignored) {}
                  }
              }
          }
