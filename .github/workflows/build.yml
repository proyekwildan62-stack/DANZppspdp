              public static boolean getFeatureState(int id) {
                  if (id == 1) return featAim;
                  if (id == 2) return featEasyDrag;
                  if (id == 3) return featSmoothAim;
                  if (id == 4) return featAimLegit;
                  if (id == 5) return featSensivity;
                  if (id == 6) return featAimDrag;
                  if (id == 7) return featAimLock;
                  if (id == 8) return featAimbot;
                  return false;
              }

              public static void setFeatureState(int id, boolean on) {
                  if (id == 1) featAim = on;
                  else if (id == 2) featEasyDrag = on;
                  else if (id == 3) featSmoothAim = on;
                  else if (id == 4) featAimLegit = on;
                  else if (id == 5) featSensivity = on;
                  else if (id == 6) featAimDrag = on;
                  else if (id == 7) featAimLock = on;
                  else if (id == 8) featAimbot = on;
              }

              public static int getFeatureMask() {
                  int mask = 0;
                  if (featAim)       mask |= 1;
                  if (featEasyDrag)  mask |= 2;
                  if (featSmoothAim) mask |= 4;
                  if (featAimLegit)  mask |= 8;
                  if (featSensivity) mask |= 16;
                  if (featAimDrag)   mask |= 32;
                  if (featAimLock)   mask |= 64;
                  if (featAimbot)    mask |= 128;
                  return mask;
              }

              // Menghitung nilai Lebar Minimum (DP) efektif yang aktif di dalam Free Fire
              public static int calculateEffectiveFFDp() {
                  int red = 0;
                  if (featSensivity) red += (6 + (sensiLevel * 4));
                  if (featAimbot)    red += 5;
                  if (featAim)       red += 3;
                  if (featAimLock)   red += 4;
                  if (featAimDrag)   red += 6;
                  if (featEasyDrag)  red += 4;
                  if (red > 52) red = 52;
                  int targetDpi = (stockBaseDensity * (100 - red)) / 100;
                  if (targetDpi < 180) targetDpi = 180;
                  return (stockWidthPx * 160) / targetDpi;
              }

              public static void triggerLiveInGameInjection(Context ctx, boolean forceImmediateInGame, String toastMsg) {
                  bgExecutor.execute(() -> {
                      int mask = getFeatureMask();
                      String script = nativeBuildCoreScript(
                          mask,
