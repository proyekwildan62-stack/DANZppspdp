name: Build DANZSTRAIGHT APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Grab Existing APK
        run: |
          mkdir -p final_apk
          find . -name "*.apk" ! -size -100k -exec cp {} final_apk/ \;
          if [ -z "$(ls -A final_apk)" ]; then
            echo "Error: No valid APK found in repository!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DANZSTRAIGHT-APK
          path: final_apk/*.apk
