name: Build DANZSTRAIGHT Tactical V5
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Compile Tactical Carbon V5 APK
        run: |
          mkdir -p clean_apk/app/src/main/java/com/danzstraight/mod
          mkdir -p clean_apk/app/src/main/assets

          cat << 'EOF' > clean_apk/settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DANZSTRAIGHT"
          include ":app"
          EOF

          cat << 'EOF' > clean_apk/app/build.gradle
          plugins { id "com.android.application" version "8.2.0" }
          android { 
            namespace "com.danzstraight.mod"
            compileSdk 34
            defaultConfig { 
              applicationId "com.danzstraight.mod"
              minSdk 24
              targetSdk 34
              versionCode 55
              versionName "5.5-TACTICAL"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation "dev.rikka.shizuku:api:13.1.5"
            implementation "dev.rikka.shizuku:provider:13.1.5"
          }
          EOF

          cat << 'EOF' > clean_apk/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES"/>
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <queries>
                  <package android:name="moe.shizuku.privileged.api" />
                  <package android:name="com.dts.freefireth" />
                  <package android:name="com.dts.freefiremax" />
              </queries>
              <application 
                  android:label="DANZSTRAIGHT" 
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity 
                      android:name=".MainActivity" 
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > clean_apk/app/src/main/java/com/danzstraight/mod/MainActivity.java
          package com.danzstraight.mod;
          import android.app.Activity;
          import android.app.ActivityManager;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.lang.reflect.Method;
          import rikka.shizuku.Shizuku;

          public class MainActivity extends Activity {
              private WebView webView;

              private final Shizuku.OnRequestPermissionResultListener PERM_LISTENER = (req, res) -> {
                  boolean ok = (res == PackageManager.PERMISSION_GRANTED);
                  runOnUiThread(() -> {
                      if (ok) {
                          Toast.makeText(MainActivity.this, "SHIZUKU BINDER CONNECTED", Toast.LENGTH_SHORT).show();
                          webView.evaluateJavascript("onShizukuReady(true)", null);
                      } else {
                          Toast.makeText(MainActivity.this, "SHIZUKU PERMISSION DENIED", Toast.LENGTH_LONG).show();
                      }
                  });
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setStatusBarColor(Color.parseColor("#090A0F"));
                  getWindow().setNavigationBarColor(Color.parseColor("#090A0F"));
                  Shizuku.addRequestPermissionResultListener(PERM_LISTENER);

                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  webView.setBackgroundColor(Color.parseColor("#090A0F"));
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }

              @Override
              protected void onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(PERM_LISTENER);
                  super.onDestroy();
              }

              private String execShizuku(String cmd) {
                  try {
                      if (!Shizuku.pingBinder()) return "ERR: SHIZUKU_OFFLINE";
                      if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                          Shizuku.requestPermission(101);
                          return "ERR: GRANT_SHIZUKU_POPUP";
                      }
                      Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                      m.setAccessible(true);
                      Process p = (Process) m.invoke(null, new String[]{"sh", "-c", cmd}, null, null);
                      BufferedReader r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                      while (r.readLine() != null) {}
                      p.waitFor();
                      return "OK";
                  } catch (Exception e) {
                      return "ERR: " + e.getMessage();
                  }
              }

              public class Bridge {
                  @JavascriptInterface
                  public String getHwid() {
                      String id = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                      return id != null ? id.toUpperCase() : "HWID-001";
                  }

                  @JavascriptInterface
                  public void connectShizuku() {
                      runOnUiThread(() -> {
                          try {
                              if (!Shizuku.pingBinder()) {
                                  Toast.makeText(MainActivity.this, "Jalankan aplikasi Shizuku (Start) terlebih dahulu!", Toast.LENGTH_LONG).show();
                                  Intent i = getPackageManager().getLaunchIntentForPackage("moe.shizuku.privileged.api");
                                  if (i != null) startActivity(i);
                                  return;
                              }
                              if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                                  webView.evaluateJavascript("onShizukuReady(true)", null);
                              } else {
                                  Shizuku.requestPermission(101);
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Shizuku belum aktif!", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void copyText(String txt) {
                      runOnUiThread(() -> {
                          ClipboardManager cb = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cb.setPrimaryClip(ClipData.newPlainText("KEY", txt));
                          Toast.makeText(MainActivity.this, "COPIED: " + txt, Toast.LENGTH_SHORT).show();
                      });
                  }

                  @JavascriptInterface
                  public String runModule(int id, String name, boolean on, int sensi, int mcType) {
                      String cmd = "";
                      if (id == 1) { // Aim Legit
                          cmd = on ? "settings put system pointer_speed 5; settings put secure long_press_timeout 200"
                                   : "settings put system pointer_speed 0; settings put secure long_press_timeout 400";
                      } else if (id == 2) { // Aim Trick
                          cmd = on ? "settings put system pointer_speed 6; settings put global window_animation_scale 0.0; settings put global transition_animation_scale 0.0"
                                   : "settings put global window_animation_scale 1.0; settings put global transition_animation_scale 1.0";
                      } else if (id == 3) { // Drag HS
                          cmd = on ? "settings put system pointer_speed 7; settings put secure long_press_timeout 130; settings put global animator_duration_scale 0.0"
                                   : "settings put system pointer_speed 0; settings put secure long_press_timeout 400; settings put global animator_duration_scale 1.0";
                      } else if (id == 4) { // Sensivity 1-7
                          int dpi = 360 - (sensi * 18);
                          cmd = on ? "settings put system pointer_speed " + sensi + "; wm density " + dpi
                                   : "settings put system pointer_speed 0; wm density reset";
                      } else if (id == 5) { // Boost HP
                          cmd = on ? "cmd game mode performance com.dts.freefireth; cmd game mode performance com.dts.freefiremax; settings put system peak_refresh_rate 120.0; settings put system min_refresh_rate 120.0; pm trim-caches 999999999; am kill-all"
                                   : "settings put system min_refresh_rate 60.0";
                      } else if (id == 6) { // Graphic MC (1. Minecraft / 2. Burik PC)
                          if (on) {
                              cmd = (mcType == 1)
                                  ? "cmd game set --mode performance --downscale 0.5 com.dts.freefireth; cmd game set --mode performance --downscale 0.5 com.dts.freefiremax; wm size 540x960; setprop debug.hwui.renderer skiagl"
                                  : "cmd game set --mode performance --downscale 0.65 com.dts.freefireth; cmd game set --mode performance --downscale 0.65 com.dts.freefiremax; wm size 640x1136; wm density 180; setprop debug.hwui.renderer opengl";
                          } else {
                              cmd = "wm size reset; wm density reset; cmd game reset com.dts.freefireth; cmd game reset com.dts.freefiremax";
                          }
                      } else if (id == 7) { // Easy Drag (NEW)
                          cmd = on ? "settings put system pointer_speed 7; settings put secure multi_press_timeout 100; settings put secure long_press_timeout 120; wm density 280"
                                   : "settings put secure multi_press_timeout 300; settings put secure long_press_timeout 400; wm density reset";
                      } else if (id == 8) { // Smooth Aim (NEW)
                          cmd = on ? "setprop debug.sf.latch_unsignaled 1; setprop debug.performance.tuning 1; settings put system peak_refresh_rate 120.0; settings put global window_animation_scale 0.0"
                                   : "setprop debug.sf.latch_unsignaled 0; settings put global window_animation_scale 1.0";
                      }

                      String res = execShizuku(cmd);
                      runOnUiThread(() -> {
                          if (id == 5 && on) {
                              ActivityManager am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                              for (ApplicationInfo app : getPackageManager().getInstalledApplications(0)) {
                                  if ((app.flags & ApplicationInfo.FLAG_SYSTEM) == 0 && !app.packageName.equals(getPackageName())) {
                                      am.killBackgroundProcesses(app.packageName);
                                  }
                              }
                          }
                          Toast.makeText(MainActivity.this, res.equals("OK") ? (name + (on ? " [INJECTED]" : " [RESET]")) : res, Toast.LENGTH_SHORT).show();
                      });
                      return res.equals("OK") ? ("ADB_OK >> " + name + (on ? " ON" : " OFF")) : res;
                  }

                  @JavascriptInterface
                  public void resetDisplay() {
                      execShizuku("wm size reset; wm density reset; settings put system pointer_speed 0; settings put global window_animation_scale 1.0; settings put global transition_animation_scale 1.0; settings put global animator_duration_scale 1.0");
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, "SYSTEM DISPLAY & DPI RESTORED", Toast.LENGTH_SHORT).show());
                  }

                  @JavascriptInterface
                  public void toast(String msg) {
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_SHORT).show());
                  }

                  @JavascriptInterface
                  public void launchFF() {
                      runOnUiThread(() -> {
                          PackageManager pm = getPackageManager();
                          Intent i = pm.getLaunchIntentForPackage("com.dts.freefireth");
                          if (i == null) i = pm.getLaunchIntentForPackage("com.dts.freefiremax");
                          if (i != null) {
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(i);
                          } else {
                              Toast.makeText(MainActivity.this, "MODULES ACTIVE - OPEN FREE FIRE", Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }
          }
          EOF

          # Antarmuka V5: Tactical Carbon & Crimson (No AI Emojis, Sharp Chamfered UI)
          cat << 'EOF' > clean_apk/app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
          <style>
            :root {
              --bg: #090A0F;
              --panel: #11131A;
              --card: #161922;
              --line: #252A38;
              --red: #E60026;
              --green: #00FF66;
              --txt: #ECEFF4;
              --sub: #7C8496;
            }
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; user-select: none; }
            body {
              background-color: var(--bg);
              background-image: radial-gradient(#1c202b 1px, transparent 1px);
              background-size: 16px 16px;
              color: var(--txt);
              padding: 12px;
              padding-bottom: 80px;
            }
            .hidden { display: none !important; }
            .cut { clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); }

            /* LOGIN GATE */
            .gate { position: fixed; inset: 0; background: #090A0F; z-index: 999; display: flex; align-items: center; justify-content: center; padding: 18px; }
            .gate-box { width: 100%; max-width: 370px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--red); padding: 20px; }
            .brand { font-size: 22px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
            .brand span { color: var(--red); }
            .tag { font-size: 9px; color: var(--sub); letter-spacing: 3px; margin: 4px 0 16px; font-family: monospace; }
            .shz-box { background: var(--card); border: 1px solid var(--line); padding: 12px; margin-bottom: 12px; }
            .row-sb { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11px; }
            .badge { font-size: 10px; font-family: monospace; padding: 2px 7px; background: #2b1116; color: var(--red); border: 1px solid var(--red); font-weight: 700; }
            .badge.ok { background: #0d291a; color: var(--green); border-color: var(--green); }
            .btn-red { width: 100%; background: var(--red); color: #fff; border: none; padding: 10px; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
            .hwid-bar { background: #06070a; border: 1px solid var(--line); padding: 8px 10px; font-size: 11px; font-family: monospace; color: var(--sub); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
            .inp { width: 100%; background: #06070a; border: 1px solid var(--line); color: #fff; padding: 11px; font-size: 12px; font-family: monospace; text-align: center; margin-bottom: 12px; outline: none; }
            .inp:focus { border-color: var(--red); }

            /* TOP HEADER */
            .top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 12px; }
            .btn-rst { background: #1c1f2b; color: var(--red); border: 1px solid var(--red); padding: 6px 10px; font-size: 10px; font-weight: 800; font-family: monospace; }

            /* TELEMETRY BAR */
            .tele { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
            .tele-box { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--red); padding: 8px 10px; }
            .tele-lbl { font-size: 9px; color: var(--sub); font-family: monospace; letter-spacing: 1px; }
            .tele-val { font-size: 13px; font-weight: 800; margin-top: 2px; color: var(--green); font-family: monospace; }

            /* GRID MODULES */
            .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 12px; }
            .card { background: var(--card); border: 1px solid var(--line); padding: 11px; display: flex; flex-direction: column; justify-content: space-between; min-height: 112px; position: relative; }
            .card::before { content: ""; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: #2c3242; }
            .card.on { border-color: #2c4a38; background: linear-gradient(160deg, #161922 50%, #0e2418 100%); }
            .card.on::before { background: var(--green); box-shadow: 0 0 8px var(--green); }
            .c-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }
            .c-id { font-size: 9px; font-family: monospace; color: var(--red); font-weight: 700; }
            .c-title { font-size: 13px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; margin: 2px 0; }
            .c-desc { font-size: 10px; color: var(--sub); line-height: 1.25; }

            /* TACTICAL SWITCH */
            .sw { position: relative; width: 36px; height: 18px; flex-shrink: 0; }
            .sw input { opacity: 0; width: 0; height: 0; }
            .sl { position: absolute; inset: 0; background: #0b0d12; border: 1px solid var(--line); transition: .15s; }
            .sl:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background: var(--sub); transition: .15s; }
            input:checked + .sl { border-color: var(--green); background: #0a2215; }
            input:checked + .sl:before { transform: translateX(18px); background: var(--green); }

            .c-foot { margin-top: 8px; display: flex; justify-content: flex-end; }
            .btn-act { background: #1e222f; border: 1px solid #32384c; color: var(--txt); font-size: 10px; font-family: monospace; font-weight: 700; padding: 5px 10px; width: 100%; text-align: center; }
            .btn-act.on { background: #0d291a; border-color: var(--green); color: var(--green); }

            /* SENSI & SELECT */
            .s-box { display: flex; justify-content: space-between; align-items: center; width: 100%; background: #0b0d12; border: 1px solid var(--line); padding: 2px; }
            .s-btn { background: #1e222f; color: #fff; border: none; width: 26px; height: 22px; font-weight: 900; }
            .sel { width: 100%; background: #0b0d12; color: var(--green); border: 1px solid var(--line); padding: 5px; font-size: 10px; font-family: monospace; font-weight: 700; outline: none; }

            /* CONSOLE LOG & LAUNCHER */
            .console { background: #06070a; border: 1px solid var(--line); padding: 8px 10px; font-family: monospace; font-size: 10px; color: var(--green); margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .btn-launch { width: 100%; background: var(--red); color: #fff; border: none; padding: 13px; font-size: 13px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }

            /* ADMIN PANEL */
            .adm { background: var(--panel); border: 1px solid var(--red); padding: 12px; margin-bottom: 12px; }
            .adm-t { font-size: 11px; font-family: monospace; color: var(--red); font-weight: 800; margin-bottom: 8px; display: flex; justify-content: space-between; }
            .k-row { background: var(--card); border: 1px solid var(--line); padding: 7px 9px; margin-top: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-family: monospace; }
            .k-btn { background: #262b3b; color: #fff; border: none; padding: 4px 7px; font-size: 9px; font-family: monospace; margin-left: 4px; }
            .k-btn.stop { background: var(--red); }

            /* BOTTOM BAR */
            .nav { position: fixed; bottom: 0; left: 0; right: 0; height: 52px; background: #0c0e14; border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; z-index: 90; }
            .n-it { font-size: 10px; font-family: monospace; color: var(--sub); text-transform: uppercase; letter-spacing: 1px; padding: 8px; }
            .n-it.act { color: var(--red); font-weight: 900; border-bottom: 2px solid var(--red); }
          </style>
          </head>
          <body>

            <!-- LOGIN GATE -->
            <div class="gate" id="gate">
              <div class="gate-box cut">
                <div class="brand">DANZ<span>STRAIGHT</span></div>
                <div class="tag">SYS.KERNEL // SHIZUKU ADB ENGINE V5.5</div>

                <div class="shz-box">
                  <div class="row-sb">
                    <span>SHIZUKU BINDER</span>
                    <span class="badge" id="shz-st">DISCONNECTED</span>
                  </div>
                  <button class="btn-red cut" onclick="AndroidBridge.connectShizuku()">AUTHORIZE SHIZUKU ACCESS</button>
                </div>

                <div class="hwid-bar">
                  <span>HWID: <b id="hwid-val" style="color:#fff">...</b></span>
                  <button class="k-btn" onclick="AndroidBridge.copyText(myHwid)">COPY</button>
                </div>

                <input type="text" class="inp" id="k-inp" placeholder="ENTER LICENSE KEY (1-KEY 1-DEVICE)">
                <button class="btn-red cut" onclick="loginKey()">INITIALIZE SYSTEM</button>
              </div>
            </div>

            <!-- HEADER -->
            <div class="top">
              <div>
                <div class="brand">DANZ<span>STRAIGHT</span></div>
                <div class="tag" style="margin:0">TACTICAL ANDROID INJECTOR // V5.5</div>
              </div>
              <button class="btn-rst" onclick="AndroidBridge.resetDisplay()">RESET DISPLAY</button>
            </div>

            <!-- TELEMETRY -->
            <div class="tele">
              <div class="tele-box">
                <div class="tele-lbl">ADB PRIVILEGE</div>
                <div class="tele-val">SHIZUKU ACTIVE</div>
              </div>
              <div class="tele-box">
                <div class="tele-lbl">FRAME & TOUCH</div>
                <div class="tele-val" id="fps-txt">120HZ // UNLOCKED</div>
              </div>
            </div>

            <!-- ADMIN KEY MANAGER -->
            <div class="adm hidden" id="adm-box">
              <div class="adm-t"><span>[DEV] LICENSE CONTROL UNIT</span><span>1 KEY = 1 HWID</span></div>
              <div style="display:flex;gap:6px;margin-bottom:6px">
                <input type="text" class="inp" id="new-k" placeholder="Custom Key (Blank=Auto)" style="margin:0;text-align:left">
                <button class="btn-red" style="width:auto;padding:0 12px" onclick="createKey()">CREATE</button>
              </div>
              <input type="text" class="inp" id="new-hwid" placeholder="Optional: Lock to Target HWID" style="margin:0;text-align:left">
              <div id="k-list"></div>
            </div>

            <!-- 8 TACTICAL MODULES -->
            <div class="grid">
              <div class="card cut" id="c-1">
                <div class="c-head">
                  <div><div class="c-id">MOD // 01</div><div class="c-title">Aim Legit</div><div class="c-desc">Natural recoil & pointer stabilization</div></div>
                  <label class="sw"><input type="checkbox" id="sw-1" onchange="trig(1,'AIM_LEGIT')"><span class="sl"></span></label>
                </div>
                <div class="c-foot"><button class="btn-act" id="b-1" onclick="btn(1,'AIM_LEGIT')">EXECUTE</button></div>
              </div>

              <div class="card cut" id="c-2">
                <div class="c-head">
                  <div><div class="c-id">MOD // 02</div><div class="c-title">Aim Trick</div><div class="c-desc">Zero window transition & fast flick</div></div>
                  <label class="sw"><input type="checkbox" id="sw-2" onchange="trig(2,'AIM_TRICK')"><span class="sl"></span></label>
                </div>
                <div class="c-foot"><button class="btn-act" id="b-2" onclick="btn(2,'AIM_TRICK')">EXECUTE</button></div>
              </div>

              <div class="card cut" id="c-3">
                <div class="c-head">
                  <div><div class="c-id">MOD // 03</div><div class="c-title">Drag HS</div><div class="c-desc">Max pointer velocity (+7) & 130ms tap</div></div>
                  <label class="sw"><input type="checkbox" id="sw-3" onchange="trig(3,'DRAG_HS')"><span class="sl"></span></label>
                </div>
                <div class="c-foot"><button class="btn-act" id="b-3" onclick="btn(3,'DRAG_HS')">EXECUTE</button></div>
              </div>

              <!-- NEW: EASY DRAG -->
              <div class="card cut" id="c-7">
                <div class="c-head">
                  <div><div class="c-id">MOD // 04</div><div class="c-title">Easy Drag</div><div class="c-desc">100ms multi-press & low drag friction</div></div>
                  <label class="sw"><input type="checkbox" id="sw-7" onchange="trig(7,'EASY_DRAG')"><span class="sl"></span></label>
                </div>
                <div class="c-foot"><button class="btn-act" id="b-7" onclick="btn(7,'EASY_DRAG')">EXECUTE</button></div>
              </div>

              <!-- NEW: SMOOTH AIM -->
              <div class="card cut" id="c-8">
                <div class="c-head">
                  <div><div class="c-id">MOD // 05</div><div class="c-title">Smooth Aim</div><div class="c-desc">Unsignaled buffer latch & steady crosshair</div></div>
                  <label class="sw"><input type="checkbox" id="sw-8" onchange="trig(8,'SMOOTH_AIM')"><span class="sl"></span></label>
                </div>
                <div class="c-foot"><button class="btn-act" id="b-8" onclick="btn(8,'SMOOTH_AIM')">EXECUTE</button></div>
              </div>

              <div class="card cut" id="c-4">
                <div class="c-head">
                  <div><div class="c-id">MOD // 06</div><div class="c-title">Sensivity</div><div class="c-desc">Gamelan scale 1-7 + DPI matrix</div></div>
                  <label class="sw"><input type="checkbox" id="sw-4" onchange="trig(4,'SENSIVITY')"><span class="sl"></span></label>
                </div>
                <div class="c-foot">
                  <div class="s-box">
                    <button class="s-btn" onclick="chSensi(-1)">-</button>
                    <span id="s-num" style="font-family:monospace;font-weight:800;font-size:12px">4</span>
                    <button class="s-btn" onclick="chSensi(1)">+</button>
                  </div>
                </div>
              </div>

              <div class="card cut" id="c-5">
                <div class="c-head">
                  <div><div class="c-id">MOD // 07</div><div class="c-title">Boost HP</div><div class="c-desc">Purge background tasks & lock 120Hz</div></div>
                  <label class="sw"><input type="checkbox" id="sw-5" onchange="trig(5,'BOOST_HP')"><span class="sl"></span></label>
                </div>
                <div class="c-foot"><button class="btn-act" id="b-5" onclick="btn(5,'BOOST_HP')">EXECUTE</button></div>
              </div>

              <div class="card cut" id="c-6">
                <div class="c-head">
                  <div><div class="c-id">MOD // 08</div><div class="c-title">Graphic MC</div><div class="c-desc">Hardware downscale & renderer</div></div>
                  <label class="sw"><input type="checkbox" id="sw-6" onchange="trig(6,'GRAPHIC_MC')"><span class="sl"></span></label>
                </div>
                <div class="c-foot">
                  <select class="sel" id="mc-sel" onchange="document.getElementById('sw-6').checked=true;trig(6,'GRAPHIC_MC')">
                    <option value="1">1. MINECRAFT</option>
                    <option value="2">2. BURIK PC</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- TERMINAL LOG & LAUNCH -->
            <div class="console" id="log-box">> SYS_READY: WAITING FOR MODULE EXECUTION...</div>
            <button class="btn-launch cut" onclick="AndroidBridge.launchFF()">LAUNCH FREE FIRE // EXECUTE</button>

            <!-- BOTTOM NAV -->
            <div class="nav">
              <div class="n-it act" onclick="window.scrollTo(0,0)">MODULES</div>
              <div class="n-it hidden" id="nav-adm" onclick="document.getElementById('adm-box').classList.toggle('hidden')">KEY ADMIN</div>
              <div class="n-it" onclick="AndroidBridge.resetDisplay()">RESTORE</div>
              <div class="n-it" onclick="AndroidBridge.launchFF()">LAUNCH</div>
            </div>

            <script>
              const MASTER_KEY = "DANZ-DEV-999";
              let myHwid = window.AndroidBridge ? AndroidBridge.getHwid() : "HWID-01";
              let shzOk = false;
              let sensi = 4;

              document.getElementById('hwid-val').innerText = myHwid;

              function onShizukuReady(ok) {
                shzOk = ok;
                const el = document.getElementById('shz-st');
                if (ok) { el.innerText = "AUTHORIZED"; el.classList.add('ok'); }
              }

              function getDb() {
                const r = localStorage.getItem('danz_v5_db');
                if (!r) {
                  const d = [{ key: "DANZ-VIP-001", hwid: "", status: "ACTIVE" }];
                  localStorage.setItem('danz_v5_db', JSON.stringify(d));
                  return d;
                }
                return JSON.parse(r);
              }

              function saveDb(d) {
                localStorage.setItem('danz_v5_db', JSON.stringify(d));
                renderKeys();
              }

              function loginKey() {
                if (!shzOk) {
                  AndroidBridge.toast("Authorize Shizuku first!");
                  AndroidBridge.connectShizuku();
                  return;
                }
                const k = document.getElementById('k-inp').value.trim().toUpperCase();
                if (!k) { AndroidBridge.toast("Enter License Key!"); return; }

                if (k === MASTER_KEY) {
                  document.getElementById('gate').classList.add('hidden');
                  document.getElementById('nav-adm').classList.remove('hidden');
                  document.getElementById('adm-box').classList.remove('hidden');
                  renderKeys();
                  return;
                }

                let db = getDb();
                let item = db.find(x => x.key === k);
                if (!item && k.startsWith("DANZ-KEY-")) {
                  item = { key: k, hwid: myHwid, status: "ACTIVE" };
                  db.push(item);
                }
                if (!item) { AndroidBridge.toast("INVALID KEY"); return; }
                if (item.status !== "ACTIVE") { AndroidBridge.toast("KEY STOPPED BY DEVELOPER"); return; }
                if (item.hwid && item.hwid !== "" && item.hwid !== myHwid) {
                  AndroidBridge.toast("HWID LOCKED TO ANOTHER DEVICE");
                  return;
                }
                item.hwid = myHwid;
                saveDb(db);
                document.getElementById('gate').classList.add('hidden');
              }

              function createKey() {
                let c = document.getElementById('new-k').value.trim().toUpperCase();
                let h = document.getElementById('new-hwid').value.trim().toUpperCase();
                let r = Math.random().toString(36).substring(2, 6).toUpperCase();
                let k = c ? c : ("DANZ-KEY-" + r);
                let db = getDb();
                db.unshift({ key: k, hwid: h, status: "ACTIVE" });
                saveDb(db);
                AndroidBridge.copyText(k);
              }

              function stopKey(k) {
                let db = getDb();
                let it = db.find(x => x.key === k);
                if (it) { it.status = (it.status === "ACTIVE") ? "STOPPED" : "ACTIVE"; saveDb(db); }
              }

              function renderKeys() {
                document.getElementById('k-list').innerHTML = getDb().map(x => `
                  <div class="k-row">
                    <div><b style="color:#00FF66">${x.key}</b><br><span style="color:#7C8496">HWID: ${x.hwid || 'UNBOUND'} | ${x.status}</span></div>
                    <div>
                      <button class="k-btn" onclick="AndroidBridge.copyText('${x.key}')">COPY</button>
                      <button class="k-btn stop" onclick="stopKey('${x.key}')">${x.status === 'ACTIVE' ? 'STOP' : 'ENABLE'}</button>
                    </div>
                  </div>
                `).join('');
              }

              function chSensi(d) {
                sensi = Math.min(7, Math.max(1, sensi + d));
                document.getElementById('s-num').innerText = sensi;
                document.getElementById('sw-4').checked = true;
                trig(4, 'SENSIVITY_LV' + sensi);
              }

              function btn(id, name) {
                const s = document.getElementById('sw-' + id);
                s.checked = !s.checked;
                trig(id, name);
              }

              function trig(id, name) {
                const s = document.getElementById('sw-' + id);
                const c = document.getElementById('c-' + id);
                const b = document.getElementById('b-' + id);
                const mc = parseInt(document.getElementById('mc-sel').value || "1");
                if (s.checked) {
                  c.classList.add('on');
                  if (b) { b.innerText = "ACTIVE"; b.classList.add('on'); }
                  const out = AndroidBridge.runModule(id, name, true, sensi, mc);
                  document.getElementById('log-box').innerText = "> " + out;
                } else {
                  c.classList.remove('on');
                  if (b) { b.innerText = "EXECUTE"; b.classList.remove('on'); }
                  const out = AndroidBridge.runModule(id, name, false, sensi, 0);
                  document.getElementById('log-box').innerText = "> " + out;
                }
              }
            </script>
          </body>
          </html>
          EOF

          echo "sdk.dir=$ANDROID_HOME" > clean_apk/local.properties
          cd clean_apk && gradle assembleDebug --no-daemon

      - name: Upload Tactical V5 APK
        uses: actions/upload-artifact@v4
        with:
          name: DANZSTRAIGHT-V5-TACTICAL
          path: clean_apk/app/build/outputs/apk/debug/*.apk
