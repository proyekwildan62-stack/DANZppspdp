                  b.setPadding(dp(6), 0, dp(6), 0);
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(Color.parseColor(bgHex));
                  gd.setCornerRadius(dp(6));
                  b.setBackground(gd);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(38), dp(26));
                  lp.leftMargin = dp(4);
