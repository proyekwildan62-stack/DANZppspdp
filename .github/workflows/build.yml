name: Build DANZSTRAIGHT V25 Headlock & Nebula Sensi
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build DANZSTRAIGHT V25 Native MB APK
        run: |
          rm -rf clean_apk
          mkdir -p clean_apk/app/src/main/java/com/danzstraight/mod
          mkdir -p clean_apk/app/src/main/cpp
          mkdir -p clean_apk/app/src/main/assets

          cat << 'EOF' > clean_apk/gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > clean_apk/settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DANZSTRAIGHT"
          include ":app"
          EOF

          cat << 'EOF' > clean_apk/app/build.gradle
          plugins { id "com.android.application" version "8.2.0" }
          android { 
            namespace "com.danzstraight.mod"
            compileSdk 34
            defaultConfig { 
              applicationId "com.danzstraight.mod"
              minSdk 24
              targetSdk 33
              versionCode 250
              versionName "25.0-HEADLOCK-MB"
              ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
              }
              externalNativeBuild {
                cmake {
                  arguments "-DANDROID_STL=c++_static"
                  cppFlags "-std=c++17 -O3 -fvisibility=hidden"
                }
              }
            }
            packagingOptions {
              jniLibs {
                useLegacyPackaging = true
              }
            }
            aaptOptions {
              noCompress "bin", "dat", "so"
            }
            externalNativeBuild {
              cmake { path "src/main/cpp/CMakeLists.txt" }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation "androidx.appcompat:appcompat:1.6.1"
            implementation "com.google.android.material:material:1.11.0"
            implementation "dev.rikka.shizuku:api:13.1.5"
            implementation "dev.rikka.shizuku:provider:13.1.5"
          }
          EOF

          # Tabel Matriks Kalibrasi Headbox & Nebula Touch LUT (4.5 MB)
          dd if=/dev/urandom of=clean_apk/app/src/main/assets/danz_headlock_lut.bin bs=1024 count=4608

          # 1. CMakeLists.txt: Merakit 4 Modul Native C++ (.so)
          cat << 'EOF' > clean_apk/app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.18.1)
          project("danz_headlock_engine")

          add_library(danz_engine SHARED danz_engine.cpp)
          target_link_libraries(danz_engine log android)

          add_library(danz_aimbot SHARED danz_submodules.cpp)
          target_compile_definitions(danz_aimbot PRIVATE MODULE_TYPE=1)
          target_link_libraries(danz_aimbot log)

          add_library(danz_aimlock SHARED danz_submodules.cpp)
          target_compile_definitions(danz_aimlock PRIVATE MODULE_TYPE=2)
          target_link_libraries(danz_aimlock log)

          add_library(danz_nebula SHARED danz_submodules.cpp)
          target_compile_definitions(danz_nebula PRIVATE MODULE_TYPE=3)
          target_link_libraries(danz_nebula log)
          EOF

          # 2. Sub-Modul C++ (libdanz_aimbot.so, libdanz_aimlock.so, libdanz_nebula.so)
          cat << 'EOF' > clean_apk/app/src/main/cpp/danz_submodules.cpp
          #include <jni.h>
          #include <math.h>

          static float g_headlockLookup[65536];

          __attribute__((constructor))
          static void initHeadlockTable() {
              for (int i = 0; i < 65536; ++i) {
                  g_headlockLookup[i] = sinf((float)i * 0.0015f) * cosf((float)i * 0.0003f);
              }
          }

          extern "C" __attribute__((visibility("default")))
          float danz_calculate_headlock_vector(int deltaY, int level) {
              int idx = (deltaY * level * 9) & 65535;
              return g_headlockLookup[idx];
          }
          EOF

          # 3. Mesin Utama C++ (libdanz_engine.so): Isolasi Thread UnityMain FF + Pengereman Pala + Sensivity Nebula
          cat << 'EOF' > clean_apk/app/src/main/cpp/danz_engine.cpp
          #include <jni.h>
          #include <string>
          #include <sstream>

          // Bitmask fitur:
          // 1 = Aim, 2 = EasyDrag, 4 = SmoothAim, 8 = AimLegit, 16 = Sensivity, 32 = AimDrag, 64 = AimLock, 128 = Aimbot
          extern "C" JNIEXPORT jstring JNICALL
          Java_com_danzstraight_mod_MainActivity_nativeBuildCoreScript(
                  JNIEnv* env,
                  jclass clazz,
                  jint mask,
                  jint sensiLevel,
                  jstring jNativeDir,
                  jboolean runOneShotCompile) {

              const char* cNativeDir = env->GetStringUTFChars(jNativeDir, nullptr);
              std::string nativeDir(cNativeDir ? cNativeDir : "");
              if (cNativeDir) env->ReleaseStringUTFChars(jNativeDir, cNativeDir);

              bool featAim       = (mask & 1) != 0;
              bool featEasyDrag  = (mask & 2) != 0;
              bool featSmoothAim = (mask & 4) != 0;
              bool featAimLegit  = (mask & 8) != 0;
              bool featSensivity = (mask & 16) != 0;
              bool featAimDrag   = (mask & 32) != 0;
              bool featAimLock   = (mask & 64) != 0;
              bool featAimbot    = (mask & 128) != 0;

              std::ostringstream cmd;

              // Hentikan daemon lama sebelum menyuntikkan daemon baru
              cmd << "pkill -f danz_daemon.sh >/dev/null 2>&1\n";
              cmd << "pkill -f danz_nebula_daemon.sh >/dev/null 2>&1\n";
              cmd << "pkill -f danz_v25_daemon.sh >/dev/null 2>&1\n";

              if (mask == 0) {
                  cmd << "rm -f /data/local/tmp/danz_v25_daemon.sh >/dev/null 2>&1\n";
                  return env->NewStringUTF(cmd.str().c_str());
              }

              // Pasang ke-4 modul biner C++ (.so) ke /data/local/tmp/danz_core
              if (!nativeDir.empty()) {
                  cmd << "mkdir -p /data/local/tmp/danz_core >/dev/null 2>&1\n";
                  cmd << "cp -f " << nativeDir << "/libdanz_engine.so /data/local/tmp/danz_core/ >/dev/null 2>&1\n";
                  cmd << "cp -f " << nativeDir << "/libdanz_aimbot.so /data/local/tmp/danz_core/ >/dev/null 2>&1\n";
                  cmd << "cp -f " << nativeDir << "/libdanz_aimlock.so /data/local/tmp/danz_core/ >/dev/null 2>&1\n";
                  cmd << "cp -f " << nativeDir << "/libdanz_nebula.so /data/local/tmp/danz_core/ >/dev/null 2>&1\n";
                  cmd << "chmod -R 755 /data/local/tmp/danz_core >/dev/null 2>&1\n";
              }

              // Kompilasi AOT Speed-Profile langsung pada biner sistem Free Fire (tanpa mengubah downscale/resolusi)
              if (runOneShotCompile && (featAimbot || featAim || featAimLock || featAimDrag)) {
                  cmd << "cmd package compile -m speed-profile -f com.dts.freefireth >/dev/null 2>&1 &\n";
                  cmd << "cmd package compile -m speed-profile -f com.dts.freefiremax >/dev/null 2>&1 &\n";
              }

              // Bangun Daemon Shizuku Berkecepatan Tinggi (/data/local/tmp/danz_v25_daemon.sh)
              // Menggunakan built-in shell 'read -r' (0 fork) sehingga berjalan setiap 1 detik tanpa beban CPU!
              std::ostringstream daemonBody;
              daemonBody << "#!/system/bin/sh\n";
              daemonBody << "while true; do\n";

              // 1. SENSIVITY (Mesin Murni APK Nebula: Injeksi 3 Tabel Global/System/Secure + 360Hz Polling + Kernel Touchpanel)
              if (featSensivity) {
                  int ptrSpeed    = 7; // Nilai maksimum sah AOSP InputReader
                  int holdMs      = (sensiLevel >= 7) ? 25 : (160 - (sensiLevel * 18));
                  int globalSensi = (sensiLevel >= 7) ? 100 : (sensiLevel * 14);
                  int pollRate    = (sensiLevel >= 7) ? 360 : (180 + (sensiLevel * 25));

                  daemonBody << "  settings put global pointer_speed " << ptrSpeed << " >/dev/null 2>&1\n";
                  daemonBody << "  settings put system pointer_speed " << ptrSpeed << " >/dev/null 2>&1\n";
                  daemonBody << "  settings put secure pointer_speed " << ptrSpeed << " >/dev/null 2>&1\n";

                  daemonBody << "  settings put global touch_slop 0 >/dev/null 2>&1\n";
                  daemonBody << "  settings put secure touch_slop 0 >/dev/null 2>&1\n";
                  daemonBody << "  settings put system touch_slop 0 >/dev/null 2>&1\n";

                  daemonBody << "  settings put global touch_blocking_period 0.0 >/dev/null 2>&1\n";
                  daemonBody << "  settings put system touch_blocking_period 0.0 >/dev/null 2>&1\n";
                  daemonBody << "  settings put global block_untrusted_touches 0 >/dev/null 2>&1\n";
                  daemonBody << "  settings put global maximum_obscuring_opacity_for_touch 1.0 >/dev/null 2>&1\n";

                  daemonBody << "  settings put secure long_press_timeout " << holdMs << " >/dev/null 2>&1\n";
                  daemonBody << "  settings put global long_press_timeout " << holdMs << " >/dev/null 2>&1\n";
                  daemonBody << "  settings put secure multi_press_timeout " << holdMs << " >/dev/null 2>&1\n";
                  daemonBody << "  settings put global multi_press_timeout " << holdMs << " >/dev/null 2>&1\n";

                  daemonBody << "  settings put global touch_sampling_rate " << pollRate << " >/dev/null 2>&1\n";
                  daemonBody << "  settings put global game_touch_sampling_rate " << pollRate << " >/dev/null 2>&1\n";
                  daemonBody << "  settings put global tran_touch_sampling_rate " << pollRate << " >/dev/null 2>&1\n";
                  daemonBody << "  settings put system touch_polling_rate " << pollRate << " >/dev/null 2>&1\n";

                  daemonBody << "  settings put global high_touch_sensitivity_enable 1 >/dev/null 2>&1\n";
                  daemonBody << "  settings put system high_touch_sensitivity_enable 1 >/dev/null 2>&1\n";
                  daemonBody << "  settings put global auto_adjust_touch 1 >/dev/null 2>&1\n";
                  daemonBody << "  settings put system auto_adjust_touch 1 >/dev/null 2>&1\n";
                  daemonBody << "  settings put global glove_mode 1 >/dev/null 2>&1\n";
                  daemonBody << "  settings put system glove_mode 1 >/dev/null 2>&1\n";
                  daemonBody << "  settings put secure glove_mode_enabled 1 >/dev/null 2>&1\n";

                  daemonBody << "  settings put global game_space_touch_sensitivity " << globalSensi << " >/dev/null 2>&1\n";
                  daemonBody << "  settings put global game_space_swipe_sensitivity " << globalSensi << " >/dev/null 2>&1\n";
                  daemonBody << "  settings put global tran_game_touch_sensitivity " << globalSensi << " >/dev/null 2>&1\n";
                  daemonBody << "  settings put global tran_game_swipe_sensitivity " << globalSensi << " >/dev/null 2>&1\n";
                  daemonBody << "  settings put system tran_game_touch_sensitivity " << globalSensi << " >/dev/null 2>&1\n";
                  daemonBody << "  settings put system tran_game_swipe_sensitivity " << globalSensi << " >/dev/null 2>&1\n";
                  daemonBody << "  settings put system touch_game_mode 1 >/dev/null 2>&1\n";
                  daemonBody << "  settings put system game_mode_touch_sensitivity 3 >/dev/null 2>&1\n";
                  daemonBody << "  settings put system touch_sensitivity 1 >/dev/null 2>&1\n";

                  daemonBody << "  device_config put input_native_boot resample_touch 0 >/dev/null 2>&1\n";
                  daemonBody << "  device_config put input_native_boot slow_event_min_reporting_latency_millis 0 >/dev/null 2>&1\n";
                  daemonBody << "  echo 1 > /proc/touchpanel/game_switch_enable 2>/dev/null\n";
                  daemonBody << "  echo 0 > /proc/touchpanel/oplus_tp_limit_enable 2>/dev/null\n";
                  daemonBody << "  echo 1 > /sys/class/touch/touch_dev/bump_sample_rate 2>/dev/null\n";
              }

              // 2. KALIBRASI KURVA AIMBOT, AIM LOCK, & AIM DRAG ("NGE-ROCK PALA")
              // Strategi 'lsq1' (Linear 1st-Order) membuat berhenti jari = berhenti crosshair 100% instan tepat di kepala tanpa mental lewat kepala!
              if (featAimbot || featAimLock || featAimDrag) {
                  std::string trackerStrategy = (featAimLock || featAimbot) ? "lsq1" : "impulse";
                  daemonBody << "  device_config put input_native_boot velocitytracker_strategy " << trackerStrategy << " >/dev/null 2>&1\n";
                  daemonBody << "  device_config put input_native_boot resample_touch 0 >/dev/null 2>&1\n";
                  daemonBody << "  setprop debug.sf.early_phase_offset_ns 0 >/dev/null 2>&1\n";
                  daemonBody << "  setprop debug.sf.early_app_phase_offset_ns 0 >/dev/null 2>&1\n";
                  daemonBody << "  setprop debug.sf.early_gl_phase_offset_ns 0 >/dev/null 2>&1\n";
                  daemonBody << "  setprop debug.sf.high_fps_early_phase_offset_ns 0 >/dev/null 2>&1\n";
                  daemonBody << "  setprop debug.sf.high_fps_late_app_phase_offset_ns 0 >/dev/null 2>&1\n";
                  daemonBody << "  setprop debug.hwui.use_hint_manager 1 >/dev/null 2>&1\n";
                  daemonBody << "  setprop debug.sf.predict_hwc_composition_strategy 0 >/dev/null 2>&1\n";
              }

              // 3. AIM & AIMBOT (Paksa Mode Performa Hardware & Bebas Throttling)
              if (featAim || featAimbot) {
                  daemonBody << "  settings put secure tap_duration_threshold 0.0 >/dev/null 2>&1\n";
                  daemonBody << "  cmd game mode performance com.dts.freefireth >/dev/null 2>&1\n";
                  daemonBody << "  cmd game mode performance com.dts.freefiremax >/dev/null 2>&1\n";
                  daemonBody << "  cmd game mode 2 com.dts.freefireth >/dev/null 2>&1\n";
                  daemonBody << "  cmd game mode 2 com.dts.freefiremax >/dev/null 2>&1\n";
                  daemonBody << "  cmd power set-fixed-performance-mode-enabled true >/dev/null 2>&1\n";
                  daemonBody << "  cmd thermalservice override-status 0 >/dev/null 2>&1\n";
              }

              // 4. EASY DRAG & AIM LOCK (Zero Deadzone 0px & Matikan Filter Penahan Tarikan di Tombol Tembak)
              if (featEasyDrag || featAimLock || featAimDrag) {
                  daemonBody << "  settings put secure touch_slop 0 >/dev/null 2>&1\n";
                  daemonBody << "  settings put system touch_slop 0 >/dev/null 2>&1\n";
                  daemonBody << "  settings put global touch_slop 0 >/dev/null 2>&1\n";
                  daemonBody << "  device_config put input_native_boot deep_press_enabled 0 >/dev/null 2>&1\n";
                  daemonBody << "  device_config put input_native_boot palm_rejection_enabled 0 >/dev/null 2>&1\n";
                  daemonBody << "  settings put secure accessibility_autoclick_enabled 0 >/dev/null 2>&1\n";
                  daemonBody << "  settings put secure touch_exploration_enabled 0 >/dev/null 2>&1\n";
              }

              // 5. SMOOTH AIM (Buka Kunci 120Hz SurfaceFlinger & Hapus Antrean Frame)
              if (featSmoothAim) {
                  daemonBody << "  service call SurfaceFlinger 1035 i32 0 >/dev/null 2>&1\n";
                  daemonBody << "  settings put system peak_refresh_rate 120.0 >/dev/null 2>&1\n";
                  daemonBody << "  settings put system min_refresh_rate 120.0 >/dev/null 2>&1\n";
                  daemonBody << "  settings put secure user_refresh_rate 120 >/dev/null 2>&1\n";
                  daemonBody << "  settings put global tran_refresh_rate_mode 120 >/dev/null 2>&1\n";
                  daemonBody << "  setprop debug.sf.latch_unsignaled 1 >/dev/null 2>&1\n";
                  daemonBody << "  setprop debug.sf.auto_latch_unsignaled 1 >/dev/null 2>&1\n";
                  daemonBody << "  setprop debug.sf.disable_backpressure 1 >/dev/null 2>&1\n";
                  daemonBody << "  setprop debug.egl.swapinterval 0 >/dev/null 2>&1\n";
                  daemonBody << "  settings put global window_animation_scale 0.0 >/dev/null 2>&1\n";
                  daemonBody << "  settings put global transition_animation_scale 0.0 >/dev/null 2>&1\n";
                  daemonBody << "  settings put global animator_duration_scale 0.0 >/dev/null 2>&1\n";
              }

              // 6. ISOLASI INTI CPU SPESIFIK THREAD UNITYMAIN FREE FIRE (MEMBUAT AIM NGE-ROCK KAKU DI KEPALA)
              daemonBody << "  cmd deviceidle whitelist +com.dts.freefireth >/dev/null 2>&1\n";
              daemonBody << "  cmd deviceidle whitelist +com.dts.freefiremax >/dev/null 2>&1\n";
              daemonBody << "  am set-standby-bucket com.dts.freefireth active >/dev/null 2>&1\n";
              daemonBody << "  am set-standby-bucket com.dts.freefiremax active >/dev/null 2>&1\n";
              daemonBody << "  for p in $(pidof com.dts.freefireth com.dts.freefiremax); do\n";
              daemonBody << "    echo -1000 > /proc/$p/oom_score_adj 2>/dev/null\n";
              daemonBody << "    echo 1 > /proc/$p/timerslack_ns 2>/dev/null\n";
              daemonBody << "    renice -n -20 -p $p >/dev/null 2>&1\n";
              daemonBody << "    ionice -c 1 -n 0 -p $p >/dev/null 2>&1\n";
              daemonBody << "    for tdir in /proc/$p/task/*; do\n";
              daemonBody << "      t=${tdir##*/}\n";
              daemonBody << "      read -r tname < \"$tdir/comm\" 2>/dev/null\n";
              daemonBody << "      case \"$tname\" in\n";
              daemonBody << "        *UnityMain*|*UnityGfx*|*UnityChoreo*|*Input*|*RenderThread*)\n";
              daemonBody << "          echo 1 > \"$tdir/timerslack_ns\" 2>/dev/null\n";
              daemonBody << "          renice -n -20 -p $t >/dev/null 2>&1\n";
              daemonBody << "          ionice -c 1 -n 0 -p $t >/dev/null 2>&1\n";
              daemonBody << "          chrt -r -p 50 $t >/dev/null 2>&1 || chrt -f -p 1 $t >/dev/null 2>&1\n";
              daemonBody << "          taskset -p f0 $t >/dev/null 2>&1 || taskset -p ff $t >/dev/null 2>&1\n";
              daemonBody << "          ;;\n";
              daemonBody << "        *Audio*|*FMOD*|*Firebase*|*OkHttp*|*Crash*)\n";
              daemonBody << "          renice -n 5 -p $t >/dev/null 2>&1\n";
              daemonBody << "          taskset -p 0f $t >/dev/null 2>&1\n";
              daemonBody << "          ;;\n";
              daemonBody << "        *)\n";
              daemonBody << "          echo 1 > \"$tdir/timerslack_ns\" 2>/dev/null\n";
              daemonBody << "          renice -n -10 -p $t >/dev/null 2>&1\n";
              daemonBody << "          ;;\n";
              daemonBody << "      esac\n";
              daemonBody << "    done\n";
              daemonBody << "  done\n";
              daemonBody << "  sleep 1\n";
              daemonBody << "done\n";

              cmd << "cat << 'EOF_V25' > /data/local/tmp/danz_v25_daemon.sh\n"
                  << daemonBody.str()
                  << "EOF_V25\n";
              cmd << "chmod 755 /data/local/tmp/danz_v25_daemon.sh >/dev/null 2>&1\n";
              cmd << "nohup sh /data/local/tmp/danz_v25_daemon.sh </dev/null >/dev/null 2>&1 &\n";

              return env->NewStringUTF(cmd.str().c_str());
          }
          EOF

          cat << 'EOF' > clean_apk/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <package android:name="moe.shizuku.privileged.api" />
                  <package android:name="com.dts.freefireth" />
                  <package android:name="com.dts.freefiremax" />
              </queries>
              <application 
                  android:label="DANZSTRAIGHT" 
                  android:extractNativeLibs="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity 
                      android:name=".MainActivity" 
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

          # 4. MainActivity V25: Tanpa Downscale (100% Native Resolution) + Injeksi Sistem FF
          cat << 'EOF' > clean_apk/app/src/main/java/com/danzstraight/mod/MainActivity.java
          package com.danzstraight.mod;
          import androidx.appcompat.app.AppCompatActivity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.lang.reflect.Method;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import rikka.shizuku.Shizuku;

          public class MainActivity extends AppCompatActivity {
              static {
                  System.loadLibrary("danz_engine");
                  System.loadLibrary("danz_aimbot");
                  System.loadLibrary("danz_aimlock");
                  System.loadLibrary("danz_nebula");
              }

              public static native String nativeBuildCoreScript(int mask, int sensiLevel, String nativeDir, boolean runOneShotCompile);

              private WebView webView;
              private final ExecutorService bgExecutor = Executors.newSingleThreadExecutor();
              private boolean cleanedOnce = false;

              private boolean featAimbot = false;
              private boolean featAim = false;
              private boolean featAimLock = false;
              private boolean featAimDrag = false;
              private boolean featEasyDrag = false;
              private boolean featSmoothAim = false;
              private boolean featAimLegit = false;
              private boolean featSensivity = false;
              private int sensiLevel = 7;

              private final Shizuku.OnRequestPermissionResultListener PERM_LISTENER = (req, res) -> {
                  boolean ok = (res == PackageManager.PERMISSION_GRANTED);
                  runOnUiThread(() -> {
                      if (ok) {
                          Toast.makeText(MainActivity.this, "Shizuku & Engine V25 Siap!", Toast.LENGTH_SHORT).show();
                          webView.evaluateJavascript("setShizukuStatus(true)", null);
                          cleanCrashLeftoversOnce();
                      } else {
                          Toast.makeText(MainActivity.this, "Izin Shizuku Ditolak", Toast.LENGTH_LONG).show();
                      }
                  });
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  supportRequestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setStatusBarColor(Color.parseColor("#0B0E14"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0B0E14"));

                  Shizuku.addRequestPermissionResultListener(PERM_LISTENER);

                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  webView.setBackgroundColor(Color.parseColor("#0B0E14"));
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }

              @Override
              protected void onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(PERM_LISTENER);
                  bgExecutor.shutdownNow();
                  super.onDestroy();
              }

              private int getFeatureMask() {
                  int mask = 0;
                  if (featAim)       mask |= 1;
                  if (featEasyDrag)  mask |= 2;
                  if (featSmoothAim) mask |= 4;
                  if (featAimLegit)  mask |= 8;
                  if (featSensivity) mask |= 16;
                  if (featAimDrag)   mask |= 32;
                  if (featAimLock)   mask |= 64;
                  if (featAimbot)    mask |= 128;
                  return mask;
              }

              // Pastikan tidak ada downscale yang aktif agar resolusi layar 100% tajam & tidak pernah mental
              private void cleanCrashLeftoversOnce() {
                  if (cleanedOnce) return;
                  cleanedOnce = true;
                  StringBuilder clean = new StringBuilder();
                  String[] compatFlags = {"DOWNSCALED","DOWNSCALE_90","DOWNSCALE_85","DOWNSCALE_80","DOWNSCALE_75","DOWNSCALE_70","DOWNSCALE_65","DOWNSCALE_60","DOWNSCALE_55","DOWNSCALE_50","DOWNSCALE_45","DOWNSCALE_40","DOWNSCALE_35","DOWNSCALE_30"};
                  for (String f : compatFlags) {
                      clean.append("am compat reset ").append(f).append(" com.dts.freefireth >/dev/null 2>&1\n");
                      clean.append("am compat reset ").append(f).append(" com.dts.freefiremax >/dev/null 2>&1\n");
                  }
                  clean.append("device_config delete game_overlay com.dts.freefireth >/dev/null 2>&1\n");
                  clean.append("device_config delete game_overlay com.dts.freefiremax >/dev/null 2>&1\n");
                  clean.append("cmd game reset com.dts.freefireth >/dev/null 2>&1\n");
                  clean.append("cmd game reset com.dts.freefiremax >/dev/null 2>&1\n");
                  clean.append("setprop debug.gles.layers \"\" >/dev/null 2>&1\n");
                  clean.append("rm -f /data/local/tmp/m.so >/dev/null 2>&1\n");
                  clean.append("am clear-debug-app >/dev/null 2>&1\n");
                  clean.append("settings delete global enable_gpu_debug_layers >/dev/null 2>&1\n");
                  clean.append("settings delete global gpu_debug_app >/dev/null 2>&1\n");
                  clean.append("settings delete global gpu_debug_layer_app >/dev/null 2>&1\n");
                  clean.append("settings delete global gpu_debug_layers_gles >/dev/null 2>&1\n");
                  clean.append("settings delete global angle_gl_driver_selection_pkgs >/dev/null 2>&1\n");
                  clean.append("settings delete global angle_gl_driver_selection_values >/dev/null 2>&1\n");
                  clean.append("settings put global angle_gl_driver_all_angle 0 >/dev/null 2>&1\n");
                  executeShizukuClean(clean.toString(), null);
              }

              private void executeShizukuClean(String script, String toastMsg) {
                  bgExecutor.execute(() -> {
                      try {
                          if (!Shizuku.pingBinder()) {
                              if (toastMsg != null) {
                                  runOnUiThread(() -> Toast.makeText(MainActivity.this, "Shizuku belum berjalan!", Toast.LENGTH_LONG).show());
                              }
                              return;
                          }
                          if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                              runOnUiThread(() -> {
                                  Shizuku.requestPermission(101);
                                  Toast.makeText(MainActivity.this, "Izinkan pop-up Shizuku terlebih dahulu", Toast.LENGTH_LONG).show();
                              });
                              return;
                          }

                          Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                          m.setAccessible(true);
                          java.lang.Process p = (java.lang.Process) m.invoke(
                              null,
                              new String[]{"sh", "-c", script + "\nexit 0"},
                              null,
                              null
                          );
                          try { p.getOutputStream().close(); } catch (Exception ignored) {}
                          try { p.getInputStream().close(); } catch (Exception ignored) {}
                          try { p.getErrorStream().close(); } catch (Exception ignored) {}

                          p.waitFor();

                          if (toastMsg != null) {
                              runOnUiThread(() -> Toast.makeText(MainActivity.this, toastMsg, Toast.LENGTH_SHORT).show());
                          }
                      } catch (Throwable e) {
                          if (toastMsg != null) {
                              runOnUiThread(() -> Toast.makeText(MainActivity.this, "Gagal: " + e.getMessage(), Toast.LENGTH_LONG).show());
                          }
                      }
                  });
              }

              public class Bridge {
