                AndroidBridge.resetDefault();
              }

              function getKeys() {
                const r = localStorage.getItem('danz_v30_keys');
                if (!r) {
                  const d = [{ key: "DANZ-VIP-001", hwid: "", status: "AKTIF" }];
                  localStorage.setItem('danz_v30_keys', JSON.stringify(d));
                  return d;
                }
                return JSON.parse(r);
              }

              function saveKeys(list) {
                localStorage.setItem('danz_v30_keys', JSON.stringify(list));
                renderKeyList();
              }

              function verifyKey() {
                if (!shizukuOk) {
                  AndroidBridge.toast("Hubungkan & izinkan Shizuku terlebih dahulu");
                  AndroidBridge.connectShizuku();
                  return;
                }
                const k = document.getElementById('key-input').value.trim().toUpperCase();
                if (!k) { AndroidBridge.toast("Masukkan kode lisensi"); return; }

                if (k === DEV_KEY) {
                  document.getElementById('login-screen').classList.add('hidden');
                  document.getElementById('dev-panel').classList.remove('hidden');
                  document.getElementById('nav-dev').classList.remove('hidden');
                  renderKeyList();
                  return;
                }

                let list = getKeys();
                let item = list.find(x => x.key === k);
                if (!item && k.startsWith("DANZ-KEY-")) {
                  item = { key: k, hwid: myHwid, status: "AKTIF" };
                  list.push(item);
                }
                if (!item) { AndroidBridge.toast("Key tidak terdaftar"); return; }
                if (item.status !== "AKTIF") { AndroidBridge.toast("Key telah diberhentikan oleh Developer"); return; }
                if (item.hwid && item.hwid !== "" && item.hwid !== myHwid) {
                  AndroidBridge.toast("Key sudah terikat di perangkat lain (1 Key 1 HP)");
                  return;
                }
                item.hwid = myHwid;
                saveKeys(list);
                document.getElementById('login-screen').classList.add('hidden');
              }

              function createNewKey() {
                let c = document.getElementById('custom-key').value.trim().toUpperCase();
                let h = document.getElementById('target-hwid').value.trim().toUpperCase();
                let r = Math.random().toString(36).substring(2, 6).toUpperCase();
                let k = c ? c : ("DANZ-KEY-" + r);
                let list = getKeys();
                list.unshift({ key: k, hwid: h, status: "AKTIF" });
                saveKeys(list);
                document.getElementById('custom-key').value = "";
                AndroidBridge.copyText(k);
              }

              function toggleKeyStatus(k) {
                let list = getKeys();
                let it = list.find(x => x.key === k);
                if (it) { it.status = (it.status === "AKTIF") ? "STOP" : "AKTIF"; saveKeys(list); }
              }

              function renderKeyList() {
                document.getElementById('key-list').innerHTML = getKeys().map(x => `
                  <div class="key-item">
                    <div><b>${x.key}</b><div style="color:var(--muted)">HP: ${x.hwid || 'Free'} | ${x.status}</div></div>
                    <div>
                      <button class="sm-btn" onclick="AndroidBridge.copyText('${x.key}')">Salin</button>
                      <button class="sm-btn stop" onclick="toggleKeyStatus('${x.key}')">${x.status === 'AKTIF' ? 'Stop Key' : 'Aktifkan'}</button>
                    </div>
                  </div>
                `).join('');
              }
            </script>
          </body>
          </html>
          EOF

          echo "sdk.dir=$ANDROID_HOME" > clean_apk/local.properties
          cd clean_apk && gradle assembleDebug --no-daemon

      - name: Upload DANZSTRAIGHT V30 APK
        uses: actions/upload-artifact@v4
        with:
          name: DANZSTRAIGHT-V30-FLOATING-INJECTOR
          path: clean_apk/app/build/outputs/apk/debug/*.apk
