          package com.danzstraight.mod;
          import androidx.appcompat.app.AppCompatActivity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.lang.reflect.Method;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import rikka.shizuku.Shizuku;

          public class MainActivity extends AppCompatActivity {
              static {
                  System.loadLibrary("danz_engine");
                  System.loadLibrary("danz_aimbot");
                  System.loadLibrary("danz_aimlock");
                  System.loadLibrary("danz_aimdrag");
                  System.loadLibrary("danz_nebula");
              }

              public static native String nativeBuildCoreScript(int mask, int sensiLevel, String nativeDir, String cachePayloadDir);

              private WebView webView;
              private final ExecutorService bgExecutor = Executors.newSingleThreadExecutor();
              private boolean cleanedOnce = false;

              private boolean featAimbot = false;
              private boolean featAim = false;
              private boolean featAimLock = false;
              private boolean featAimDrag = false;
              private boolean featEasyDrag = false;
              private boolean featSmoothAim = false;
              private boolean featAimLegit = false;
              private boolean featSensivity = false;
              private int sensiLevel = 7;

              private final Shizuku.OnRequestPermissionResultListener PERM_LISTENER = (req, res) -> {
                  boolean ok = (res == PackageManager.PERMISSION_GRANTED);
                  runOnUiThread(() -> {
                      if (ok) {
                          Toast.makeText(MainActivity.this, "Shizuku Terhubung ke Sistem Free Fire!", Toast.LENGTH_SHORT).show();
                          webView.evaluateJavascript("setShizukuStatus(true)", null);
                          cleanAndPrepareFFEnv();
                      } else {
                          Toast.makeText(MainActivity.this, "Izin Shizuku Ditolak", Toast.LENGTH_LONG).show();
                      }
                  });
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  supportRequestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setStatusBarColor(Color.parseColor("#0B0E14"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0B0E14"));

                  Shizuku.addRequestPermissionResultListener(PERM_LISTENER);

                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  webView.setBackgroundColor(Color.parseColor("#0B0E14"));
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }

              @Override
              protected void onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(PERM_LISTENER);
                  bgExecutor.shutdownNow();
                  super.onDestroy();
              }

              private int getFeatureMask() {
                  int mask = 0;
                  if (featAim)       mask |= 1;
                  if (featEasyDrag)  mask |= 2;
                  if (featSmoothAim) mask |= 4;
                  if (featAimLegit)  mask |= 8;
                  if (featSensivity) mask |= 16;
                  if (featAimDrag)   mask |= 32;
                  if (featAimLock)   mask |= 64;
                  if (featAimbot)    mask |= 128;
                  return mask;
              }

              // Menyiapkan header payload biner untuk disuntikkan ke dalam folder /Android/data/com.dts.freefireth/files/danz_modules/
              private String preparePayloadDirectory() {
                  File dir = new File(getExternalCacheDir(), "ff_payloads");
                  if (!dir.exists()) dir.mkdirs();
                  String[] assets = {"danz_ff_aimbot_lut.bin", "danz_ff_headlock_matrix.dat", "danz_ff_aimdrag_curve.bin", "danz_ff_sensi_engine.pak"};
                  byte[] buf = new byte[65536];
                  for (String name : assets) {
                      File out = new File(dir, name);
                      if (!out.exists()) {
                          try (InputStream is = getAssets().open(name);
                               FileOutputStream fos = new FileOutputStream(out)) {
                              int n = is.read(buf);
                              if (n > 0) fos.write(buf, 0, n);
                          } catch (Exception ignored) {}
                      }
                  }
                  return dir.getAbsolutePath();
              }

              // Pastikan sistem HP (wm size & density) kembali 100% normal dan bersih dari sisa versi sebelumnya
              private void cleanAndPrepareFFEnv() {
                  if (cleanedOnce) return;
                  cleanedOnce = true;
                  StringBuilder clean = new StringBuilder();
                  clean.append("wm size reset >/dev/null 2>&1\n");
                  clean.append("wm density reset >/dev/null 2>&1\n");
                  String[] compatFlags = {"DOWNSCALED","DOWNSCALE_90","DOWNSCALE_85","DOWNSCALE_80","DOWNSCALE_75","DOWNSCALE_70","DOWNSCALE_65","DOWNSCALE_60","DOWNSCALE_55","DOWNSCALE_50","DOWNSCALE_45","DOWNSCALE_40","DOWNSCALE_35","DOWNSCALE_30"};
                  for (String f : compatFlags) {
                      clean.append("am compat reset ").append(f).append(" com.dts.freefireth >/dev/null 2>&1\n");
                      clean.append("am compat reset ").append(f).append(" com.dts.freefiremax >/dev/null 2>&1\n");
                  }
                  clean.append("setprop debug.gles.layers \"\" >/dev/null 2>&1\n");
                  clean.append("rm -f /data/local/tmp/m.so >/dev/null 2>&1\n");
                  clean.append("am clear-debug-app >/dev/null 2>&1\n");
                  clean.append("settings delete global enable_gpu_debug_layers >/dev/null 2>&1\n");
                  clean.append("settings delete global angle_gl_driver_selection_pkgs >/dev/null 2>&1\n");
                  clean.append("settings delete global angle_gl_driver_selection_values >/dev/null 2>&1\n");
                  clean.append("settings put global angle_gl_driver_all_angle 0 >/dev/null 2>&1\n");
                  executeShizukuClean(clean.toString(), null);
              }

              private void executeShizukuClean(String script, String toastMsg) {
                  bgExecutor.execute(() -> {
                      try {
                          if (!Shizuku.pingBinder()) {
                              if (toastMsg != null) {
                                  runOnUiThread(() -> Toast.makeText(MainActivity.this, "Shizuku belum berjalan!", Toast.LENGTH_LONG).show());
                              }
                              return;
                          }
                          if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                              runOnUiThread(() -> {
                                  Shizuku.requestPermission(101);
                                  Toast.makeText(MainActivity.this, "Izinkan pop-up Shizuku terlebih dahulu", Toast.LENGTH_LONG).show();
                              });
                              return;
                          }

                          Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                          m.setAccessible(true);
                          java.lang.Process p = (java.lang.Process) m.invoke(
                              null,
                              new String[]{"sh", "-c", script + "\nexit 0"},
                              null,
                              null
                          );
                          try { p.getOutputStream().close(); } catch (Exception ignored) {}
                          try { p.getInputStream().close(); } catch (Exception ignored) {}
                          try { p.getErrorStream().close(); } catch (Exception ignored) {}

                          p.waitFor();

                          if (toastMsg != null) {
                              runOnUiThread(() -> {
                                  webView.evaluateJavascript("updateEngineBadge(" + (getFeatureMask() != 0) + ")", null);
                                  Toast.makeText(MainActivity.this, toastMsg, Toast.LENGTH_SHORT).show();
                              });
                          }
                      } catch (Throwable e) {
                          if (toastMsg != null) {
                              runOnUiThread(() -> Toast.makeText(MainActivity.this, "Gagal: " + e.getMessage(), Toast.LENGTH_LONG).show());
                          }
                      }
                  });
              }

              public class Bridge {
                  @JavascriptInterface
                  public String getHwid() {
                      String id = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                      return id != null ? id.toUpperCase() : "HWID-001";
                  }

                  @JavascriptInterface
                  public void connectShizuku() {
                      runOnUiThread(() -> {
                          try {
                              if (!Shizuku.pingBinder()) {
                                  Toast.makeText(MainActivity.this, "Buka aplikasi Shizuku dan klik Start terlebih dahulu", Toast.LENGTH_LONG).show();
                                  Intent i = getPackageManager().getLaunchIntentForPackage("moe.shizuku.privileged.api");
                                  if (i != null) startActivity(i);
                                  return;
                              }
                              if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                                  webView.evaluateJavascript("setShizukuStatus(true)", null);
                                  cleanAndPrepareFFEnv();
                              } else {
                                  Shizuku.requestPermission(101);
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Shizuku belum aktif", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void copyText(String txt) {
                      runOnUiThread(() -> {
                          ClipboardManager cb = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cb.setPrimaryClip(ClipData.newPlainText("KEY", txt));
                          Toast.makeText(MainActivity.this, "Disalin: " + txt, Toast.LENGTH_SHORT).show();
                      });
                  }

                  @JavascriptInterface
                  public void toggleFeature(int id, String name, boolean on, int sensi) {
                      sensiLevel = sensi;
                      if (id == 1) featAim = on;
                      else if (id == 2) featEasyDrag = on;
                      else if (id == 3) featSmoothAim = on;
                      else if (id == 4) featAimLegit = on;
                      else if (id == 5) featSensivity = on;
                      else if (id == 6) featAimDrag = on;
                      else if (id == 7) featAimLock = on;
                      else if (id == 8) featAimbot = on;

                      bgExecutor.execute(() -> {
                          String payloadDir = preparePayloadDirectory();
                          int mask = getFeatureMask();
                          String script = nativeBuildCoreScript(mask, sensiLevel, getApplicationInfo().nativeLibraryDir, payloadDir);

                          String msg;
                          if (id == 5 && on) {
                              msg = "Sensivity Lv." + sensi + " Masuk ke Sistem Free Fire (Tanpa Ubah Layar HP)!";
                          } else {
                              msg = name + (on ? " Terinjeksi ke Sistem Free Fire!" : " Dihapus dari Sistem Free Fire");
                          }
                          executeShizukuClean(script, msg);
                      });
                  }

                  @JavascriptInterface
                  public void resetDefault() {
                      featAimbot = false;
                      featAim = false;
                      featAimLock = false;
                      featAimDrag = false;
                      featEasyDrag = false;
                      featSmoothAim = false;
                      featAimLegit = false;
                      featSensivity = false;
                      String stopBin = nativeBuildCoreScript(0, 7, getApplicationInfo().nativeLibraryDir, "");
                      executeShizukuClean(stopBin, "Semua Modul Dihapus dari Sistem Free Fire!");
                      runOnUiThread(() -> webView.evaluateJavascript("updateEngineBadge(false)", null));
                  }

                  @JavascriptInterface
                  public void toast(String msg) {
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_SHORT).show());
                  }

                  @JavascriptInterface
                  public void launchFreeFire() {
                      bgExecutor.execute(() -> {
                          int mask = getFeatureMask();
                          if (mask != 0) {
                              String payloadDir = preparePayloadDirectory();
                              String script = nativeBuildCoreScript(mask, sensiLevel, getApplicationInfo().nativeLibraryDir, payloadDir);
                              executeShizukuClean(script, "Modul C++ Aktif di Dalam Sistem Free Fire!");
                          }
                      });
                      runOnUiThread(() -> {
                          PackageManager pm = getPackageManager();
                          Intent i = pm.getLaunchIntentForPackage("com.dts.freefireth");
                          if (i == null) i = pm.getLaunchIntentForPackage("com.dts.freefiremax");
                          if (i != null) {
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(i);
                          } else {
                              Toast.makeText(MainActivity.this, "Silakan buka aplikasi Free Fire", Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }
          }
