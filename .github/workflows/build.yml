name: Build DANZSTRAIGHT V13 Direct FF Graphics & Auto-Aim
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build DANZSTRAIGHT V13 APK
        run: |
          rm -rf clean_apk
          mkdir -p clean_apk/app/src/main/java/com/danzstraight/mod
          mkdir -p clean_apk/app/src/main/cpp
          mkdir -p clean_apk/app/src/main/assets

          cat << 'EOF' > clean_apk/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > clean_apk/settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DANZSTRAIGHT"
          include ":app"
          EOF

          cat << 'EOF' > clean_apk/app/build.gradle
          plugins { id "com.android.application" version "8.2.0" }
          android { 
            namespace "com.danzstraight.mod"
            compileSdk 34
            defaultConfig { 
              applicationId "com.danzstraight.mod"
              minSdk 24
              targetSdk 33
              versionCode 130
              versionName "13.0"
              ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
            }
            packagingOptions {
              jniLibs {
                useLegacyPackaging = true
              }
            }
            externalNativeBuild {
              cmake { path "src/main/cpp/CMakeLists.txt" }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation "dev.rikka.shizuku:api:13.1.5"
            implementation "dev.rikka.shizuku:provider:13.1.5"
          }
          EOF

          cat << 'EOF' > clean_apk/app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.18.1)
          project("danz_mc")

          add_library(mc_ekstrem SHARED danz_mc_layer.cpp)
          target_compile_definitions(mc_ekstrem PRIVATE MC_BASE_LVL=8 MC_LOD=8.5f MC_SHARP=1)
          target_link_libraries(mc_ekstrem GLESv2 GLESv3 log)
          EOF

          cat << 'EOF' > clean_apk/app/src/main/cpp/danz_mc_layer.cpp
          #include <GLES2/gl2.h>
          #include <GLES3/gl3.h>
          #include <string.h>

          #define GL_TEXTURE_MAX_ANISOTROPY_EXT 0x84FE
          typedef void* (*PFNEGLGETNEXTLAYERPROCADDRESSPROC)(void*, const char*);
          typedef void (*PFN_glTexStorage2D)(GLenum, GLsizei, GLenum, GLsizei, GLsizei);
          typedef void (*PFN_glTexParameteri)(GLenum, GLenum, GLint);
          typedef void (*PFN_glTexParameterf)(GLenum, GLenum, GLfloat);
          typedef void (*PFN_glSamplerParameteri)(GLuint, GLenum, GLint);
          typedef void (*PFN_glSamplerParameterf)(GLuint, GLenum, GLfloat);

          static PFN_glTexStorage2D real_glTexStorage2D = nullptr;
          static PFN_glTexParameteri real_glTexParameteri = nullptr;
          static PFN_glTexParameterf real_glTexParameterf = nullptr;
          static PFN_glSamplerParameteri real_glSamplerParameteri = nullptr;
          static PFN_glSamplerParameterf real_glSamplerParameterf = nullptr;

          static void hook_glTexStorage2D(GLenum target, GLsizei levels, GLenum internalformat, GLsizei width, GLsizei height) {
              if (real_glTexStorage2D) real_glTexStorage2D(target, levels, internalformat, width, height);
              if (target == GL_TEXTURE_2D && levels > 2 && real_glTexParameteri && real_glTexParameterf) {
                  int base = (levels - 1 < 8) ? (levels - 1) : 8;
                  real_glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_BASE_LEVEL, base);
                  real_glTexParameterf(GL_TEXTURE_2D, GL_TEXTURE_MIN_LOD, 8.5f);
                  real_glTexParameterf(GL_TEXTURE_2D, GL_TEXTURE_MAX_ANISOTROPY_EXT, 1.0f);
                  real_glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_NEAREST);
                  real_glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_NEAREST_MIPMAP_NEAREST);
              }
          }

          static void hook_glTexParameteri(GLenum target, GLenum pname, GLint param) {
              if (!real_glTexParameteri) return;
              if (target == GL_TEXTURE_2D) {
                  if (pname == GL_TEXTURE_MAG_FILTER) param = GL_NEAREST;
                  else if (pname == GL_TEXTURE_MIN_FILTER && param >= 0x2700 && param <= 0x2703) {
                      param = GL_NEAREST_MIPMAP_NEAREST;
                  }
              }
              real_glTexParameteri(target, pname, param);
          }

          static void hook_glSamplerParameteri(GLuint sampler, GLenum pname, GLint param) {
              if (!real_glSamplerParameteri) return;
              if (pname == GL_TEXTURE_MAG_FILTER) param = GL_NEAREST;
              else if (pname == GL_TEXTURE_MIN_FILTER && param >= 0x2700 && param <= 0x2703) {
                  param = GL_NEAREST_MIPMAP_NEAREST;
                  if (real_glSamplerParameterf) real_glSamplerParameterf(sampler, GL_TEXTURE_MIN_LOD, 8.5f);
              }
              real_glSamplerParameteri(sampler, pname, param);
          }

          extern "C" __attribute__((visibility("default")))
          void AndroidGLESLayer_Initialize(void* layer_id, PFNEGLGETNEXTLAYERPROCADDRESSPROC get_next_proc) {
              real_glTexStorage2D = (PFN_glTexStorage2D)get_next_proc(layer_id, "glTexStorage2D");
              real_glTexParameteri = (PFN_glTexParameteri)get_next_proc(layer_id, "glTexParameteri");
              real_glTexParameterf = (PFN_glTexParameterf)get_next_proc(layer_id, "glTexParameterf");
              real_glSamplerParameteri = (PFN_glSamplerParameteri)get_next_proc(layer_id, "glSamplerParameteri");
              real_glSamplerParameterf = (PFN_glSamplerParameterf)get_next_proc(layer_id, "glSamplerParameterf");
          }

          extern "C" __attribute__((visibility("default")))
          void* AndroidGLESLayer_GetProcAddress(const char* name, void* next) {
              if (!name) return next;
              if (strcmp(name, "glTexStorage2D") == 0) return (void*)hook_glTexStorage2D;
              if (strcmp(name, "glTexParameteri") == 0) return (void*)hook_glTexParameteri;
              if (strcmp(name, "glSamplerParameteri") == 0) return (void*)hook_glSamplerParameteri;
              return next;
          }
          EOF

          cat << 'EOF' > clean_apk/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              android:forceQueryable="true">
              <queries>
                  <package android:name="moe.shizuku.privileged.api" />
                  <package android:name="com.dts.freefireth" />
                  <package android:name="com.dts.freefiremax" />
              </queries>
              <application 
                  android:label="DANZSTRAIGHT" 
                  android:extractNativeLibs="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity 
                      android:name=".MainActivity" 
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

          # MainActivity V13: Tanpa am compat DOWNSCALED (Skala Tombol Aman) + Auto Aim Loop In-Game
          cat << 'EOF' > clean_apk/app/src/main/java/com/danzstraight/mod/MainActivity.java
          package com.danzstraight.mod;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.lang.reflect.Method;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import rikka.shizuku.Shizuku;

          public class MainActivity extends Activity {
              private WebView webView;
              private final ExecutorService bgExecutor = Executors.newSingleThreadExecutor();
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private boolean autoAimWatcherActive = false;
              private int currentSensi = 7;

              private final Shizuku.OnRequestPermissionResultListener PERM_LISTENER = (req, res) -> {
                  boolean ok = (res == PackageManager.PERMISSION_GRANTED);
                  runOnUiThread(() -> {
                      if (ok) {
                          Toast.makeText(MainActivity.this, "Shizuku Terhubung!", Toast.LENGTH_SHORT).show();
                          webView.evaluateJavascript("setShizukuStatus(true)", null);
                      } else {
                          Toast.makeText(MainActivity.this, "Izin Shizuku Ditolak", Toast.LENGTH_LONG).show();
                      }
                  });
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setStatusBarColor(Color.parseColor("#0D1117"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0D1117"));

                  Shizuku.addRequestPermissionResultListener(PERM_LISTENER);

                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  webView.setBackgroundColor(Color.parseColor("#0D1117"));
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }

              @Override
              protected void onDestroy() {
                  autoAimWatcherActive = false;
                  Shizuku.removeRequestPermissionResultListener(PERM_LISTENER);
                  bgExecutor.shutdownNow();
                  super.onDestroy();
              }

              // Menjaga suntikan Aim & Sensitivitas tetap menempel pada proses UnityMain selama Free Fire dimainkan
              private void startInGameAimWatcher() {
                  if (autoAimWatcherActive) return;
                  autoAimWatcherActive = true;
                  Runnable watcher = new Runnable() {
                      @Override
                      public void run() {
                          if (!autoAimWatcherActive) return;
                          String script = buildAimInjectionScript(currentSensi);
                          executeShizukuSilent(script);
                          mainHandler.postDelayed(this, 5000);
                      }
                  };
                  mainHandler.postDelayed(watcher, 3000);
              }

              private String buildAimInjectionScript(int sensi) {
                  int holdDelay = Math.max(65, 210 - (sensi * 20));
                  int slop = Math.max(1, 7 - sensi);
                  int niceVal = -(sensi * 2 + 6);
                  return "device_config put input_native_boot velocitytracker_strategy impulse >/dev/null 2>&1\n" +
                         "device_config put input_native_boot palm_rejection_enabled 0 >/dev/null 2>&1\n" +
                         "settings put system pointer_speed " + sensi + " >/dev/null 2>&1\n" +
                         "settings put system touch_blocking_period 0.0 >/dev/null 2>&1\n" +
                         "settings put secure tap_duration_threshold 0.0 >/dev/null 2>&1\n" +
                         "settings put secure long_press_timeout " + holdDelay + " >/dev/null 2>&1\n" +
                         "settings put secure multi_press_timeout " + holdDelay + " >/dev/null 2>&1\n" +
                         "settings put secure touch_slop " + slop + " >/dev/null 2>&1\n" +
                         "settings put system touch_game_mode 1 >/dev/null 2>&1\n" +
                         "settings put system game_mode_touch_sensitivity 3 >/dev/null 2>&1\n" +
                         "settings put system touch_sensitivity 1 >/dev/null 2>&1\n" +
                         "setprop debug.egl.swapinterval 0 >/dev/null 2>&1\n" +
                         "setprop debug.sf.latch_unsignaled 1 >/dev/null 2>&1\n" +
                         "setprop debug.sf.disable_backpressure 1 >/dev/null 2>&1\n" +
                         "for p in $(pidof com.dts.freefireth com.dts.freefiremax); do " +
                         "  renice -n -20 -p $p >/dev/null 2>&1; " +
                         "  ionice -c 1 -n 0 -p $p >/dev/null 2>&1; " +
                         "  for t in $(ls /proc/$p/task 2>/dev/null); do " +
                         "    renice -n " + niceVal + " -p $t >/dev/null 2>&1; " +
                         "    chrt -f -p 1 $t >/dev/null 2>&1; " +
                         "    taskset -p ff $t >/dev/null 2>&1; " +
                         "  done; " +
                         "done\n";
              }

              private void executeShizukuSilent(String script) {
                  bgExecutor.execute(() -> {
                      try {
                          if (!Shizuku.pingBinder() || Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) return;
                          Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                          m.setAccessible(true);
                          java.lang.Process p = (java.lang.Process) m.invoke(null, new String[]{"sh", "-c", script + "\nexit 0"}, null, null);
                          try { p.getOutputStream().close(); } catch (Exception ignored) {}
                          try { p.getInputStream().close(); } catch (Exception ignored) {}
                          try { p.getErrorStream().close(); } catch (Exception ignored) {}
                          p.waitFor();
                      } catch (Throwable ignored) {}
                  });
              }

              private void executeShizukuClean(String script, String toastMsg) {
                  bgExecutor.execute(() -> {
                      try {
                          if (!Shizuku.pingBinder()) {
                              runOnUiThread(() -> {
                                  webView.evaluateJavascript("onSaveComplete()", null);
                                  Toast.makeText(MainActivity.this, "Shizuku belum berjalan!", Toast.LENGTH_LONG).show();
                              });
                              return;
                          }
                          if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                              runOnUiThread(() -> {
                                  webView.evaluateJavascript("onSaveComplete()", null);
                                  Shizuku.requestPermission(101);
                                  Toast.makeText(MainActivity.this, "Izinkan pop-up Shizuku terlebih dahulu", Toast.LENGTH_LONG).show();
                              });
                              return;
                          }

                          Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                          m.setAccessible(true);
                          java.lang.Process p = (java.lang.Process) m.invoke(
                              null,
                              new String[]{"sh", "-c", script + "\nexit 0"},
                              null,
                              null
                          );
                          try { p.getOutputStream().close(); } catch (Exception ignored) {}
                          try { p.getInputStream().close(); } catch (Exception ignored) {}
                          try { p.getErrorStream().close(); } catch (Exception ignored) {}

                          p.waitFor();

                          runOnUiThread(() -> {
                              webView.evaluateJavascript("onSaveComplete()", null);
                              Toast.makeText(MainActivity.this, toastMsg, Toast.LENGTH_SHORT).show();
                          });
                      } catch (Throwable e) {
                          runOnUiThread(() -> {
                              webView.evaluateJavascript("onSaveComplete()", null);
                              Toast.makeText(MainActivity.this, "Gagal: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          });
                      }
                  });
              }

              public class Bridge {
                  @JavascriptInterface
                  public String getHwid() {
                      String id = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                      return id != null ? id.toUpperCase() : "HWID-001";
                  }

                  @JavascriptInterface
                  public void connectShizuku() {
                      runOnUiThread(() -> {
                          try {
                              if (!Shizuku.pingBinder()) {
                                  Toast.makeText(MainActivity.this, "Buka aplikasi Shizuku dan klik Start terlebih dahulu", Toast.LENGTH_LONG).show();
                                  Intent i = getPackageManager().getLaunchIntentForPackage("moe.shizuku.privileged.api");
                                  if (i != null) startActivity(i);
                                  return;
                              }
                              if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                                  webView.evaluateJavascript("setShizukuStatus(true)", null);
                              } else {
                                  Shizuku.requestPermission(101);
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Shizuku belum aktif", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void copyText(String txt) {
                      runOnUiThread(() -> {
                          ClipboardManager cb = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cb.setPrimaryClip(ClipData.newPlainText("KEY", txt));
                          Toast.makeText(MainActivity.this, "Disalin: " + txt, Toast.LENGTH_SHORT).show();
                      });
                  }

                  // INJEKSI TEKSTUR & MODE RINGAN LANGSUNG KE RENDER PIPELINE FF (TANPA am compat AGAR SKALA TOMBOL TIDAK MEMBESAR)
                  @JavascriptInterface
                  public void applyGraphicStudio(boolean enableTex, int texLevel, boolean sharpPixel, boolean hardLod, boolean enableLight, int resPercent) {
                      String nativeDir = getApplicationInfo().nativeLibraryDir;
                      StringBuilder cmd = new StringBuilder();

                      // 1. Matikan semua flag am compat DOWNSCALED (Penyebab tombol HUD membesar di V10!)
                      String[] compatFlags = {"DOWNSCALED","DOWNSCALE_90","DOWNSCALE_85","DOWNSCALE_80","DOWNSCALE_75","DOWNSCALE_70","DOWNSCALE_65","DOWNSCALE_60","DOWNSCALE_55","DOWNSCALE_50","DOWNSCALE_45","DOWNSCALE_40","DOWNSCALE_35","DOWNSCALE_30"};
                      for (String f : compatFlags) {
                          cmd.append("am compat reset ").append(f).append(" com.dts.freefireth >/dev/null 2>&1\n");
                          cmd.append("am compat reset ").append(f).append(" com.dts.freefiremax >/dev/null 2>&1\n");
                      }

                      if (!enableTex && !enableLight) {
                          cmd.append("device_config delete game_overlay com.dts.freefireth >/dev/null 2>&1\n");
                          cmd.append("device_config delete game_overlay com.dts.freefiremax >/dev/null 2>&1\n");
                          cmd.append("cmd game reset com.dts.freefireth >/dev/null 2>&1\n");
                          cmd.append("cmd game reset com.dts.freefiremax >/dev/null 2>&1\n");
                          cmd.append("setprop debug.gles.layers \"\"\n");
                          cmd.append("setprop debug.egl.force_msaa 0\n");
                          cmd.append("settings delete global angle_gl_driver_selection_pkgs >/dev/null 2>&1\n");
                          cmd.append("settings delete global angle_gl_driver_selection_values >/dev/null 2>&1\n");
                          cmd.append("am force-stop com.dts.freefireth >/dev/null 2>&1\n");
                          cmd.append("am force-stop com.dts.freefiremax >/dev/null 2>&1\n");
                          executeShizukuClean(cmd.toString(), "Sistem Grafik Free Fire Direset ke Asli!");
                          return;
                      }

                      // 2. Hitung skala render 3D yang AMAN bagi HUD Free Fire (0.50 s/d 0.85 tidak membuat tombol membesar!)
                      int finalPct = 85;
                      if (enableLight) {
                          finalPct = Math.max(50, Math.min(90, resPercent));
                      }
                      if (enableTex && texLevel > 1) {
                          // Level 2 (Ringan)=75%, Level 3 (Retro)=65%, Level 4 (Kotak)=55%, Level 5 (Ekstrem)=50%
                          int texPct = 85;
                          if (texLevel == 2) texPct = 75;
                          else if (texLevel == 3) texPct = 65;
                          else if (texLevel == 4) texPct = 55;
                          else if (texLevel >= 5) texPct = 50;

                          if (!enableLight || texPct < finalPct) {
                              finalPct = texPct;
                          }
                      }

                      String factorStr = (finalPct % 10 == 0) ? ("0." + (finalPct / 10)) : ("0." + finalPct);

                      // 3. Konfigurasi Filter Tekstur (Piksel Tajam & Batas Jarak Tegas)
                      String useAngle = sharpPixel ? ",useAngle=true" : "";
                      if (sharpPixel) {
                          cmd.append("setprop debug.egl.force_msaa 0 >/dev/null 2>&1\n");
                          cmd.append("setprop debug.hwui.renderer skiagl >/dev/null 2>&1\n");
                          cmd.append("settings put global angle_gl_driver_selection_pkgs com.dts.freefireth,com.dts.freefiremax >/dev/null 2>&1\n");
                          cmd.append("settings put global angle_gl_driver_selection_values angle,angle >/dev/null 2>&1\n");
                      } else {
                          cmd.append("setprop debug.hwui.renderer opengl >/dev/null 2>&1\n");
                          cmd.append("settings put global angle_gl_driver_selection_pkgs com.dts.freefireth,com.dts.freefiremax >/dev/null 2>&1\n");
                          cmd.append("settings put global angle_gl_driver_selection_values native,native >/dev/null 2>&1\n");
                      }

                      if (hardLod) {
                          cmd.append("setprop debug.gles.layers libmc_ekstrem.so >/dev/null 2>&1\n");
                          cmd.append("settings put global enable_gpu_debug_layers 1 >/dev/null 2>&1\n");
                          cmd.append("settings put global gpu_debug_app com.dts.freefireth >/dev/null 2>&1\n");
                          cmd.append("settings put global gpu_debug_layer_app com.danzstraight.mod >/dev/null 2>&1\n");
                          cmd.append("settings put global gpu_debug_layers_gles libmc_ekstrem.so >/dev/null 2>&1\n");
                      }

                      // 4. Suntikkan SurfaceFlinger Buffer Scaling via game_overlay & cmd game (Tanpa am compat agar ukuran tombol tetap normal!)
                      String overlayRule = "mode=1,downscaleFactor=" + factorStr + useAngle +
                                           ":mode=2,downscaleFactor=" + factorStr + useAngle +
                                           ":mode=3,downscaleFactor=" + factorStr + useAngle;
                      cmd.append("device_config put game_overlay com.dts.freefireth ").append(overlayRule).append(" >/dev/null 2>&1\n");
                      cmd.append("device_config put game_overlay com.dts.freefiremax ").append(overlayRule).append(" >/dev/null 2>&1\n");

                      cmd.append("cmd game mode 2 com.dts.freefireth >/dev/null 2>&1\n");
                      cmd.append("cmd game mode 2 com.dts.freefiremax >/dev/null 2>&1\n");
                      cmd.append("cmd game downscale ").append(factorStr).append(" com.dts.freefireth >/dev/null 2>&1\n");
                      cmd.append("cmd game downscale ").append(factorStr).append(" com.dts.freefiremax >/dev/null 2>&1\n");
                      cmd.append("cmd game set --mode 2 --downscale ").append(factorStr).append(" com.dts.freefireth >/dev/null 2>&1\n");
                      cmd.append("cmd game set --mode 2 --downscale ").append(factorStr).append(" com.dts.freefiremax >/dev/null 2>&1\n");

                      // 5. Bersihkan Shader Cache Free Fire agar wajib memuat ulang tekstur saat dibuka
                      cmd.append("rm -rf /sdcard/Android/data/com.dts.freefireth/cache/UnityShaderCache/* >/dev/null 2>&1\n");
                      cmd.append("rm -rf /sdcard/Android/data/com.dts.freefiremax/cache/UnityShaderCache/* >/dev/null 2>&1\n");
                      cmd.append("rm -rf /storage/emulated/0/Android/data/com.dts.freefireth/cache/UnityShaderCache/* >/dev/null 2>&1\n");
                      cmd.append("rm -rf /storage/emulated/0/Android/data/com.dts.freefiremax/cache/UnityShaderCache/* >/dev/null 2>&1\n");

                      // 6. Sertakan juga injeksi Aim & Sensitivitas sekaligus
                      cmd.append(buildAimInjectionScript(currentSensi));

                      // 7. Restart proses Free Fire agar perubahan grafik langsung aktif
                      cmd.append("am force-stop com.dts.freefireth >/dev/null 2>&1\n");
                      cmd.append("am force-stop com.dts.freefiremax >/dev/null 2>&1\n");

                      startInGameAimWatcher();
                      executeShizukuClean(cmd.toString(), "Grafik FF (Skala Render " + finalPct + "% + Aim Licin) Tersimpan!");
                  }

                  @JavascriptInterface
                  public void runAimModule(int id, String name, boolean on, int sensi) {
                      currentSensi = sensi;
                      startInGameAimWatcher();
                      String script = buildAimInjectionScript(sensi);
                      executeShizukuClean(script, name + (on ? " Aktif (Auto-Hook In-Game)!" : " Diperbarui"));
                  }

                  @JavascriptInterface
                  public void toast(String msg) {
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_SHORT).show());
                  }

                  @JavascriptInterface
                  public void launchFreeFire() {
                      runOnUiThread(() -> {
                          startInGameAimWatcher();
                          PackageManager pm = getPackageManager();
                          Intent i = pm.getLaunchIntentForPackage("com.dts.freefireth");
                          if (i == null) i = pm.getLaunchIntentForPackage("com.dts.freefiremax");
                          if (i != null) {
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(i);
