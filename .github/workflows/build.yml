                  clean.append("wm density reset >/dev/null 2>&1\n");
                  executeShizukuStatic(this, clean.toString(), null);
              }

              private void startFloatingPanelService() {
                  bgExecutor.execute(() -> {
                      executeShizukuStatic(
                          MainActivity.this,
                          "appops set com.danzstraight.mod SYSTEM_ALERT_WINDOW allow >/dev/null 2>&1\n" +
                          "cmd appops set com.danzstraight.mod SYSTEM_ALERT_WINDOW allow >/dev/null 2>&1\n",
                          null
                      );
                      mainHandler.postDelayed(() -> {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(MainActivity.this)) {
                              Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                              startActivity(intent);
                              Toast.makeText(MainActivity.this, "Izinkan 'Tampilkan di atas aplikasi lain' satu kali", Toast.LENGTH_LONG).show();
                          } else {
                              startService(new Intent(MainActivity.this, FloatingModService.class));
                              Toast.makeText(MainActivity.this, "Panel In-Game [DZ] Aktif!", Toast.LENGTH_SHORT).show();
                          }
                      }, 300);
                  });
              }

              public class Bridge {
                  @JavascriptInterface
                  public String getHwid() {
                      String id = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                      return id != null ? id.toUpperCase() : "HWID-001";
                  }

                  @JavascriptInterface
                  public void connectShizuku() {
                      runOnUiThread(() -> {
                          try {
                              if (!Shizuku.pingBinder()) {
                                  Toast.makeText(MainActivity.this, "Buka aplikasi Shizuku dan klik Start terlebih dahulu", Toast.LENGTH_LONG).show();
                                  Intent i = getPackageManager().getLaunchIntentForPackage("moe.shizuku.privileged.api");
                                  if (i != null) startActivity(i);
                                  return;
                              }
                              if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                                  webView.evaluateJavascript("setShizukuStatus(true)", null);
                                  cleanAndGrantOverlayPermission();
                              } else {
                                  Shizuku.requestPermission(101);
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Shizuku belum aktif", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void copyText(String txt) {
                      runOnUiThread(() -> {
                          ClipboardManager cb = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cb.setPrimaryClip(ClipData.newPlainText("KEY", txt));
                          Toast.makeText(MainActivity.this, "Disalin: " + txt, Toast.LENGTH_SHORT).show();
                      });
                  }

                  @JavascriptInterface
                  public void openFloatingPanel() {
                      runOnUiThread(() -> startFloatingPanelService());
                  }

                  @JavascriptInterface
                  public void closeFloatingPanel() {
                      runOnUiThread(() -> {
                          stopService(new Intent(MainActivity.this, FloatingModService.class));
                          Toast.makeText(MainActivity.this, "Panel Melayang Ditutup", Toast.LENGTH_SHORT).show();
                      });
                  }

                  @JavascriptInterface
                  public void toggleFeature(int id, String name, boolean on, int sensi) {
                      sensiLevel = sensi;
                      setFeatureState(id, on);
                      int effDp = calculateEffectiveFFDp();
                      // Saat di dalam menu aplikasi, jangan paksa ubah layar HP (false), biarkan daemon C++ mengaktifkannya otomatis saat Free Fire dibuka!
                      triggerLiveInGameInjection(
                          MainActivity.this,
                          false,
                          name + (on ? " Siap (" + effDp + " DP otomatis aktif saat masuk FF)!" : " Nonaktif")
                      );
                      runOnUiThread(() -> webView.evaluateJavascript("updateEngineBadge(" + effDp + ")", null));
                  }

                  @JavascriptInterface
                  public void resetDefault() {
                      featAimbot = false;
                      featAim = false;
                      featAimLock = false;
                      featAimDrag = false;
                      featEasyDrag = false;
                      featSmoothAim = false;
                      featAimLegit = false;
                      featSensivity = false;
                      stopService(new Intent(MainActivity.this, FloatingModService.class));
                      String stopBin = nativeBuildCoreScript(0, 7, stockBaseDensity, false, getApplicationInfo().nativeLibraryDir);
                      executeShizukuStatic(MainActivity.this, stopBin, "Semua Fitur Dihapus & Layar 100% Standar!");
                      runOnUiThread(() -> webView.evaluateJavascript("updateEngineBadge(360)", null));
                  }

                  @JavascriptInterface
                  public void toast(String msg) {
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_SHORT).show());
                  }

                  @JavascriptInterface
                  public void launchFreeFire() {
                      runOnUiThread(() -> startFloatingPanelService());
                      int effDp = calculateEffectiveFFDp();
                      triggerLiveInGameInjection(
                          MainActivity.this,
                          false,
                          "Membuka Free Fire (" + effDp + " DP + Auto-Restore Saat Keluar FF)!"
                      );
                      runOnUiThread(() -> {
                          PackageManager pm = getPackageManager();
                          Intent i = pm.getLaunchIntentForPackage("com.dts.freefireth");
                          if (i == null) i = pm.getLaunchIntentForPackage("com.dts.freefiremax");
                          if (i != null) {
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(i);
                          } else {
                              Toast.makeText(MainActivity.this, "Silakan buka aplikasi Free Fire", Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }
          }
