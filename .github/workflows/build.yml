              function moveSplit(type, val) {
                const layer = document.getElementById(type === 'tex' ? 'tex-after-layer' : 'res-after-layer');
                const line = document.getElementById(type === 'tex' ? 'tex-line' : 'res-line');
                const handle = document.getElementById(type === 'tex' ? 'tex-handle' : 'res-handle');
                layer.style.clipPath = `polygon(${val}% 0, 100% 0, 100% 100%, ${val}% 100%)`;
                line.style.left = val + '%';
                handle.style.left = val + '%';
              }

              function selectPreset(p) {
                ['halus','retro','kotak','kustom'].forEach(x => {
                  document.getElementById('pr-' + x).classList.toggle('active', x === p);
                });
                const sl = document.getElementById('tex-slider');
                const sharp = document.getElementById('sw-sharp');
                const lod = document.getElementById('sw-lod');
                if (p === 'halus') { sl.value = 2; sharp.checked = false; lod.checked = false; }
                else if (p === 'retro') { sl.value = 3; sharp.checked = true; lod.checked = false; }
                else if (p === 'kotak') { sl.value = 5; sharp.checked = true; lod.checked = true; }
                onTexSliderChange(sl.value, false);
              }

              function onTexSliderChange(val, switchToCustom = true) {
                if (switchToCustom) {
                  ['halus','retro','kotak','kustom'].forEach(x => {
                    document.getElementById('pr-' + x).classList.toggle('active', x === 'kustom');
                  });
                }
                document.getElementById('tex-lvl-name').innerText = LVL_NAMES[val];
                for (let i = 1; i <= 5; i++) {
                  document.getElementById('tk-' + i).classList.toggle('active', i == val);
                }
                updateTexVisual();
              }

              function updateTexVisual() {
                const lvl = parseInt(document.getElementById('tex-slider').value);
                const sharp = document.getElementById('sw-sharp').checked;
                const afterLayer = document.getElementById('tex-after-layer');
                const groundAfter = document.getElementById('tex-ground-after');
                const pxSize = 14 + (lvl * 12);
                afterLayer.style.backgroundSize = pxSize + 'px ' + pxSize + 'px';
                groundAfter.style.backgroundSize = pxSize + 'px ' + pxSize + 'px';
                afterLayer.style.filter = sharp ? 'none' : 'blur(2px)';
              }

              function onResSliderChange(val) {
                document.getElementById('res-val-txt').innerText = val + '%';
                document.getElementById('sw-ff-light').checked = true;
                const blurPx = ((100 - val) / 18).toFixed(1);
                document.getElementById('res-after-layer').style.filter = `blur(${blurPx}px)`;
              }

              function saveGraphicStudio() {
                document.getElementById('btn-save-1').innerText = "Menyimpan...";
                document.getElementById('btn-save-2').innerText = "Menyimpan...";
                const enableTex = document.getElementById('sw-ff-tex').checked;
                const texLvl = parseInt(document.getElementById('tex-slider').value);
                const sharp = document.getElementById('sw-sharp').checked;
                const lod = document.getElementById('sw-lod').checked;
                const enableLight = document.getElementById('sw-ff-light').checked;
                const resPct = parseInt(document.getElementById('res-slider').value);
                AndroidBridge.applyGraphicStudio(enableTex, texLvl, sharp, lod, enableLight, resPct);
              }

              function onSaveComplete() {
                document.getElementById('btn-save-1').innerText = "Simpan";
                document.getElementById('btn-save-2').innerText = "Simpan";
              }

              function resetGraphicStudio() {
                document.getElementById('tex-slider').value = 1;
                document.getElementById('sw-ff-light').checked = false;
                onTexSliderChange(1, false);
                AndroidBridge.applyGraphicStudio(false, 1, false, false, false, 100);
              }

              function trigAim(id, name) {
                const on = document.getElementById('sw-aim-' + id).checked;
                const s = parseInt(document.getElementById('sensi-slider').value);
                AndroidBridge.runAimModule(id, name, on, s);
              }

              function onSensiSlide(val) {
                document.getElementById('sensi-txt').innerText = 'Level ' + val + (val == 7 ? ' (Max Licin)' : '');
              }

              function onSensiChange(val) {
                onSensiSlide(val);
                AndroidBridge.runAimModule(5, 'Sensitivitas Licin Lv.' + val, true, parseInt(val));
              }

              function getKeys() {
                const r = localStorage.getItem('danz_v13_keys');
                if (!r) {
                  const d = [{ key: "DANZ-VIP-001", hwid: "", status: "AKTIF" }];
                  localStorage.setItem('danz_v13_keys', JSON.stringify(d));
                  return d;
                }
                return JSON.parse(r);
              }

              function saveKeys(list) {
                localStorage.setItem('danz_v13_keys', JSON.stringify(list));
                renderKeyList();
              }

              function verifyKey() {
                if (!shizukuOk) {
                  AndroidBridge.toast("Hubungkan & izinkan Shizuku terlebih dahulu");
                  AndroidBridge.connectShizuku();
                  return;
                }
                const k = document.getElementById('key-input').value.trim().toUpperCase();
                if (!k) { AndroidBridge.toast("Masukkan kode lisensi"); return; }

                if (k === DEV_KEY) {
                  document.getElementById('login-screen').classList.add('hidden');
                  document.getElementById('dev-panel').classList.remove('hidden');
                  renderKeyList();
                  return;
                }

                let list = getKeys();
                let item = list.find(x => x.key === k);
                if (!item && k.startsWith("DANZ-KEY-")) {
                  item = { key: k, hwid: myHwid, status: "AKTIF" };
                  list.push(item);
                }
                if (!item) { AndroidBridge.toast("Key tidak terdaftar"); return; }
                if (item.status !== "AKTIF") { AndroidBridge.toast("Key telah diberhentikan oleh Developer"); return; }
                if (item.hwid && item.hwid !== "" && item.hwid !== myHwid) {
                  AndroidBridge.toast("Key sudah terikat di perangkat lain (1 Key 1 HP)");
                  return;
                }
                item.hwid = myHwid;
                saveKeys(list);
                document.getElementById('login-screen').classList.add('hidden');
              }

              function createNewKey() {
                let c = document.getElementById('custom-key').value.trim().toUpperCase();
                let h = document.getElementById('target-hwid').value.trim().toUpperCase();
                let r = Math.random().toString(36).substring(2, 6).toUpperCase();
                let k = c ? c : ("DANZ-KEY-" + r);
                let list = getKeys();
                list.unshift({ key: k, hwid: h, status: "AKTIF" });
                saveKeys(list);
                document.getElementById('custom-key').value = "";
                AndroidBridge.copyText(k);
              }

              function toggleKeyStatus(k) {
                let list = getKeys();
                let it = list.find(x => x.key === k);
                if (it) { it.status = (it.status === "AKTIF") ? "STOP" : "AKTIF"; saveKeys(list); }
              }

              function renderKeyList() {
                document.getElementById('key-list').innerHTML = getKeys().map(x => `
                  <div class="key-item">
                    <div><b>${x.key}</b><div style="color:var(--muted)">HP: ${x.hwid || 'Free'} | ${x.status}</div></div>
                    <div>
                      <button class="sm-btn" onclick="AndroidBridge.copyText('${x.key}')">Salin</button>
                      <button class="sm-btn stop" onclick="toggleKeyStatus('${x.key}')">${x.status === 'AKTIF' ? 'Stop Key' : 'Aktifkan'}</button>
                    </div>
                  </div>
                `).join('');
              }
            </script>
          </body>
          </html>
          EOF

          echo "sdk.dir=$ANDROID_HOME" > clean_apk/local.properties
          cd clean_apk && gradle assembleDebug --no-daemon

      - name: Upload DANZSTRAIGHT V13 APK
        uses: actions/upload-artifact@v4
        with:
          name: DANZSTRAIGHT-V13-DIRECT-FF
          path: clean_apk/app/build/outputs/apk/debug/*.apk
