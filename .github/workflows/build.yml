                  if (featAimLegit)  mask |= 8;
                  if (featSensivity) mask |= 16;
                  if (featAimDrag)   mask |= 32;
                  if (featAimLock)   mask |= 64;
                  if (featAimbot)    mask |= 128;
                  return mask;
              }

              // Menyiapkan File Kepala (headshot_bone_v30.cfg, unity_head_aimassist.xml, & .bin) untuk disuntikkan ke Free Fire
              public static String prepareHeadshotFiles(Context ctx) {
                  File dir = new File(ctx.getExternalCacheDir(), "ff_headshot_v30");
                  if (!dir.exists()) dir.mkdirs();
                  String[] smallFiles = {"headshot_bone_v30.cfg", "unity_head_aimassist.xml"};
                  for (String name : smallFiles) {
                      File out = new File(dir, name);
                      try (InputStream is = ctx.getAssets().open(name);
                           FileOutputStream fos = new FileOutputStream(out)) {
                          byte[] b = new byte[4096];
                          int n;
                          while ((n = is.read(b)) > 0) fos.write(b, 0, n);
                      } catch (Exception ignored) {}
                  }
                  String[] binFiles = {"danz_ff_headshot_bone.bin", "danz_ff_headlock_matrix.dat", "danz_ff_aimdrag_curve.bin", "danz_ff_sensi_nebula.pak"};
                  byte[] headerBuf = new byte[65536];
                  for (String name : binFiles) {
                      File out = new File(dir, name);
                      if (!out.exists()) {
                          try (InputStream is = ctx.getAssets().open(name);
                               FileOutputStream fos = new FileOutputStream(out)) {
                              int n = is.read(headerBuf);
                              if (n > 0) fos.write(headerBuf, 0, n);
                          } catch (Exception ignored) {}
                      }
                  }
                  return dir.getAbsolutePath();
              }

