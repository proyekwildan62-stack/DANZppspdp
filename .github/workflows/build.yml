name: Build DANZSTRAIGHT V16 Pure Aim & Slippery Sensi
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build DANZSTRAIGHT V16 APK
        run: |
          rm -rf clean_apk
          mkdir -p clean_apk/app/src/main/java/com/danzstraight/mod
          mkdir -p clean_apk/app/src/main/assets

          cat << 'EOF' > clean_apk/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > clean_apk/settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DANZSTRAIGHT"
          include ":app"
          EOF

          cat << 'EOF' > clean_apk/app/build.gradle
          plugins { id "com.android.application" version "8.2.0" }
          android { 
            namespace "com.danzstraight.mod"
            compileSdk 34
            defaultConfig { 
              applicationId "com.danzstraight.mod"
              minSdk 24
              targetSdk 33
              versionCode 160
              versionName "16.0"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation "dev.rikka.shizuku:api:13.1.5"
            implementation "dev.rikka.shizuku:provider:13.1.5"
          }
          EOF

          cat << 'EOF' > clean_apk/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <package android:name="moe.shizuku.privileged.api" />
                  <package android:name="com.dts.freefireth" />
                  <package android:name="com.dts.freefiremax" />
              </queries>
              <application 
                  android:label="DANZSTRAIGHT" 
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity 
                      android:name=".MainActivity" 
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

          # MainActivity V16: Fokus Murni Aim Headshot & Pelicin Layar In-Game Free Fire (Tanpa Grafik MC)
          cat << 'EOF' > clean_apk/app/src/main/java/com/danzstraight/mod/MainActivity.java
          package com.danzstraight.mod;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.lang.reflect.Method;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import rikka.shizuku.Shizuku;

          public class MainActivity extends Activity {
              private WebView webView;
              private final ExecutorService bgExecutor = Executors.newSingleThreadExecutor();
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private boolean autoWatcherRunning = false;

              private boolean aimMerahOn = true;
              private boolean easyDragOn = true;
              private boolean smoothAimOn = true;
              private boolean aimLegitOn = true;
              private boolean sensiActive = true;
              private int currentSensi = 7;

              private final Shizuku.OnRequestPermissionResultListener PERM_LISTENER = (req, res) -> {
                  boolean ok = (res == PackageManager.PERMISSION_GRANTED);
                  runOnUiThread(() -> {
                      if (ok) {
                          Toast.makeText(MainActivity.this, "Shizuku Terhubung!", Toast.LENGTH_SHORT).show();
                          webView.evaluateJavascript("setShizukuStatus(true)", null);
                          cleanLeftoverGraphicHooks();
                      } else {
                          Toast.makeText(MainActivity.this, "Izin Shizuku Ditolak", Toast.LENGTH_LONG).show();
                      }
                  });
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setStatusBarColor(Color.parseColor("#0B0E14"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0B0E14"));

                  Shizuku.addRequestPermissionResultListener(PERM_LISTENER);

                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  webView.setBackgroundColor(Color.parseColor("#0B0E14"));
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }

              @Override
              protected void onDestroy() {
                  autoWatcherRunning = false;
                  Shizuku.removeRequestPermissionResultListener(PERM_LISTENER);
                  bgExecutor.shutdownNow();
                  super.onDestroy();
              }

              // Membersihkan semua sisa pengaturan Grafik MC / Downscale / ANGLE dari versi lama agar FF tidak pernah mental
              private void cleanLeftoverGraphicHooks() {
                  StringBuilder clean = new StringBuilder();
                  String[] compatFlags = {"DOWNSCALED","DOWNSCALE_90","DOWNSCALE_85","DOWNSCALE_80","DOWNSCALE_75","DOWNSCALE_70","DOWNSCALE_65","DOWNSCALE_60","DOWNSCALE_55","DOWNSCALE_50","DOWNSCALE_45","DOWNSCALE_40","DOWNSCALE_35","DOWNSCALE_30"};
                  for (String f : compatFlags) {
                      clean.append("am compat reset ").append(f).append(" com.dts.freefireth >/dev/null 2>&1\n");
                      clean.append("am compat reset ").append(f).append(" com.dts.freefiremax >/dev/null 2>&1\n");
                  }
                  clean.append("device_config delete game_overlay com.dts.freefireth >/dev/null 2>&1\n");
                  clean.append("device_config delete game_overlay com.dts.freefiremax >/dev/null 2>&1\n");
                  clean.append("cmd game reset com.dts.freefireth >/dev/null 2>&1\n");
                  clean.append("cmd game reset com.dts.freefiremax >/dev/null 2>&1\n");
                  clean.append("setprop debug.gles.layers \"\" >/dev/null 2>&1\n");
                  clean.append("rm -f /data/local/tmp/m.so >/dev/null 2>&1\n");
                  clean.append("am clear-debug-app >/dev/null 2>&1\n");
                  clean.append("settings delete global enable_gpu_debug_layers >/dev/null 2>&1\n");
                  clean.append("settings delete global gpu_debug_app >/dev/null 2>&1\n");
                  clean.append("settings delete global gpu_debug_layer_app >/dev/null 2>&1\n");
                  clean.append("settings delete global gpu_debug_layers_gles >/dev/null 2>&1\n");
                  clean.append("settings delete global angle_gl_driver_selection_pkgs >/dev/null 2>&1\n");
                  clean.append("settings delete global angle_gl_driver_selection_values >/dev/null 2>&1\n");
                  clean.append("settings put global angle_gl_driver_all_angle 0 >/dev/null 2>&1\n");
                  executeShizukuSilent(clean.toString());
              }

              // Watcher Otomatis: Menjaga Aim & Kelicinan Layar tetap menempel di sistem Free Fire setiap 5 detik selama bermain
              private void startInGameAimWatcher() {
                  if (autoWatcherRunning) return;
                  autoWatcherRunning = true;
                  Runnable watcher = new Runnable() {
                      @Override
                      public void run() {
                          if (!autoWatcherRunning) return;
                          executeShizukuSilent(buildFullFFSystemScript(false));
                          mainHandler.postDelayed(this, 5000);
                      }
                  };
                  mainHandler.postDelayed(watcher, 3000);
              }

              // Rangkaian Injeksi Aim Headshot & Pelicin Layar Langsung ke Sistem & Thread Free Fire
              private String buildFullFFSystemScript(boolean includeCompile) {
                  StringBuilder cmd = new StringBuilder();

                  // 1. SENSITIVITAS PELICIN LAYAR IN-GAME (Level 1 - 7)
                  if (sensiActive) {
                      int holdMs = Math.max(55, 195 - (currentSensi * 20)); // Level 7 = 55ms
                      int xarenaSensi = 30 + (currentSensi * 10); // Level 7 = 100 (Max Licin)
                      int maxEvents = 180 + (currentSensi * 50); // Level 7 = 530 events/sec
                      int flingMax = 12000 + (currentSensi * 3000); // Level 7 = 33000

                      cmd.append("settings put system pointer_speed ").append(currentSensi).append(" >/dev/null 2>&1\n");
                      cmd.append("device_config put input_native_boot resample_touch 0 >/dev/null 2>&1\n");
                      cmd.append("device_config put input_native_boot slow_event_min_reporting_latency_millis 0 >/dev/null 2>&1\n");
                      cmd.append("settings put secure long_press_timeout ").append(holdMs).append(" >/dev/null 2>&1\n");
                      cmd.append("settings put secure multi_press_timeout ").append(holdMs).append(" >/dev/null 2>&1\n");
                      cmd.append("settings put global game_space_touch_sensitivity ").append(xarenaSensi).append(" >/dev/null 2>&1\n");
                      cmd.append("settings put global game_space_swipe_sensitivity ").append(xarenaSensi).append(" >/dev/null 2>&1\n");
                      cmd.append("settings put system touch_game_mode 1 >/dev/null 2>&1\n");
                      cmd.append("settings put system game_mode_touch_sensitivity 3 >/dev/null 2>&1\n");
                      cmd.append("settings put system touch_sensitivity 1 >/dev/null 2>&1\n");
                      cmd.append("setprop windowsmgr.max_events_per_sec ").append(maxEvents).append(" >/dev/null 2>&1\n");
                      cmd.append("setprop view.scroll_friction 0.0 >/dev/null 2>&1\n");
                      cmd.append("setprop view.minimum_fling_velocity 1 >/dev/null 2>&1\n");
                      cmd.append("setprop view.maximum_fling_velocity ").append(flingMax).append(" >/dev/null 2>&1\n");
                  }

                  // 2. AIM MERAH (DRAG HS) -> Impulse Velocity Tracker + Game Mode Performance FF
                  if (aimMerahOn) {
                      cmd.append("device_config put input_native_boot velocitytracker_strategy impulse >/dev/null 2>&1\n");
                      cmd.append("settings put system touch_blocking_period 0.0 >/dev/null 2>&1\n");
                      cmd.append("settings put secure tap_duration_threshold 0.0 >/dev/null 2>&1\n");
                      cmd.append("cmd game mode performance com.dts.freefireth >/dev/null 2>&1\n");
                      cmd.append("cmd game mode performance com.dts.freefiremax >/dev/null 2>&1\n");
                      cmd.append("cmd game mode 2 com.dts.freefireth >/dev/null 2>&1\n");
                      cmd.append("cmd game mode 2 com.dts.freefiremax >/dev/null 2>&1\n");
                      if (includeCompile) {
                          cmd.append("cmd package compile -m speed-profile -f com.dts.freefireth >/dev/null 2>&1 &\n");
                          cmd.append("cmd package compile -m speed-profile -f com.dts.freefiremax >/dev/null 2>&1 &\n");
                      }
                  }

                  // 3. EASY DRAG (PELICIN TARIKAN VERTIKAL) -> Zero Touch Slop & Palm Rejection Off
                  if (easyDragOn) {
                      cmd.append("settings put secure touch_slop 0 >/dev/null 2>&1\n");
                      cmd.append("settings put system touch_slop 0 >/dev/null 2>&1\n");
                      cmd.append("device_config put input_native_boot deep_press_enabled 0 >/dev/null 2>&1\n");
                      cmd.append("device_config put input_native_boot palm_rejection_enabled 0 >/dev/null 2>&1\n");
                      cmd.append("settings put secure touch_exploration_enabled 0 >/dev/null 2>&1\n");
                  }

                  // 4. SMOOTH AIM (UNLOCK FPS & HAPUS DELAY FRAME)
                  if (smoothAimOn) {
                      cmd.append("settings put system peak_refresh_rate 120.0 >/dev/null 2>&1\n");
                      cmd.append("settings put system min_refresh_rate 120.0 >/dev/null 2>&1\n");
                      cmd.append("settings put secure user_refresh_rate 120 >/dev/null 2>&1\n");
                      cmd.append("settings put global tran_refresh_rate_mode 120 >/dev/null 2>&1\n");
                      cmd.append("setprop debug.sf.latch_unsignaled 1 >/dev/null 2>&1\n");
                      cmd.append("setprop debug.sf.disable_backpressure 1 >/dev/null 2>&1\n");
                      cmd.append("setprop debug.performance.tuning 1 >/dev/null 2>&1\n");
                      cmd.append("settings put global window_animation_scale 0.0 >/dev/null 2>&1\n");
                      cmd.append("settings put global transition_animation_scale 0.0 >/dev/null 2>&1\n");
                      cmd.append("settings put global animator_duration_scale 0.0 >/dev/null 2>&1\n");
                      cmd.append("cmd thermalservice override-status 0 >/dev/null 2>&1\n");
                      cmd.append("cmd power set-fixed-performance-mode-enabled true >/dev/null 2>&1\n");
                  }

                  // 5. AIM LEGIT & INJEKSI LANGSUNG KE SELURUH SUB-THREAD UNITY FREE FIRE (UnityMain, UnityGfxDeviceW, InputReader)
                  if (aimLegitOn || aimMerahOn || easyDragOn) {
                      int niceVal = -(currentSensi * 2 + 6); // Level 7 = -20 (Prioritas Maksimum)
                      cmd.append("cmd deviceidle whitelist +com.dts.freefireth >/dev/null 2>&1\n");
                      cmd.append("cmd deviceidle whitelist +com.dts.freefiremax >/dev/null 2>&1\n");
                      cmd.append("am set-standby-bucket com.dts.freefireth active >/dev/null 2>&1\n");
                      cmd.append("am set-standby-bucket com.dts.freefiremax active >/dev/null 2>&1\n");
                      cmd.append("cmd appops set com.dts.freefireth RUN_IN_BACKGROUND allow >/dev/null 2>&1\n");
                      cmd.append("cmd appops set com.dts.freefiremax RUN_IN_BACKGROUND allow >/dev/null 2>&1\n");
                      cmd.append(
                          "for p in $(pidof com.dts.freefireth com.dts.freefiremax); do " +
                          "  renice -n -20 -p $p >/dev/null 2>&1; " +
                          "  ionice -c 1 -n 0 -p $p >/dev/null 2>&1; " +
                          "  for t in $(ls /proc/$p/task 2>/dev/null); do " +
                          "    renice -n " + niceVal + " -p $t >/dev/null 2>&1; " +
                          "    ionice -c 1 -n 0 -p $t >/dev/null 2>&1; " +
                          "    taskset -p ff $t >/dev/null 2>&1; " +
                          "  done; " +
                          "done\n"
                      );
                  }

                  return cmd.toString();
              }

              private void executeShizukuSilent(String script) {
                  bgExecutor.execute(() -> {
                      try {
                          if (!Shizuku.pingBinder() || Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) return;
                          Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                          m.setAccessible(true);
                          java.lang.Process p = (java.lang.Process) m.invoke(null, new String[]{"sh", "-c", script + "\nexit 0"}, null, null);
                          try { p.getOutputStream().close(); } catch (Exception ignored) {}
                          try { p.getInputStream().close(); } catch (Exception ignored) {}
                          try { p.getErrorStream().close(); } catch (Exception ignored) {}
                          p.waitFor();
                      } catch (Throwable ignored) {}
                  });
              }

              private void executeShizukuClean(String script, String toastMsg) {
                  bgExecutor.execute(() -> {
                      try {
                          if (!Shizuku.pingBinder()) {
                              runOnUiThread(() -> Toast.makeText(MainActivity.this, "Shizuku belum berjalan!", Toast.LENGTH_LONG).show());
                              return;
                          }
                          if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                              runOnUiThread(() -> {
                                  Shizuku.requestPermission(101);
                                  Toast.makeText(MainActivity.this, "Izinkan pop-up Shizuku terlebih dahulu", Toast.LENGTH_LONG).show();
                              });
                              return;
                          }

                          Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                          m.setAccessible(true);
                          java.lang.Process p = (java.lang.Process) m.invoke(
                              null,
                              new String[]{"sh", "-c", script + "\nexit 0"},
                              null,
                              null
                          );
                          try { p.getOutputStream().close(); } catch (Exception ignored) {}
                          try { p.getInputStream().close(); } catch (Exception ignored) {}
                          try { p.getErrorStream().close(); } catch (Exception ignored) {}

                          p.waitFor();

                          runOnUiThread(() -> Toast.makeText(MainActivity.this, toastMsg, Toast.LENGTH_SHORT).show());
                      } catch (Throwable e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Gagal: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  });
              }

              public class Bridge {
                  @JavascriptInterface
                  public String getHwid() {
                      String id = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                      return id != null ? id.toUpperCase() : "HWID-001";
                  }

                  @JavascriptInterface
                  public void connectShizuku() {
                      runOnUiThread(() -> {
                          try {
                              if (!Shizuku.pingBinder()) {
                                  Toast.makeText(MainActivity.this, "Buka aplikasi Shizuku dan klik Start terlebih dahulu", Toast.LENGTH_LONG).show();
                                  Intent i = getPackageManager().getLaunchIntentForPackage("moe.shizuku.privileged.api");
                                  if (i != null) startActivity(i);
                                  return;
                              }
                              if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                                  webView.evaluateJavascript("setShizukuStatus(true)", null);
                                  cleanLeftoverGraphicHooks();
                              } else {
                                  Shizuku.requestPermission(101);
                              }
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Shizuku belum aktif", Toast.LENGTH_SHORT).show();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void copyText(String txt) {
                      runOnUiThread(() -> {
                          ClipboardManager cb = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cb.setPrimaryClip(ClipData.newPlainText("KEY", txt));
                          Toast.makeText(MainActivity.this, "Disalin: " + txt, Toast.LENGTH_SHORT).show();
                      });
                  }

                  @JavascriptInterface
                  public void updateModule(int id, String name, boolean on, int sensi) {
                      currentSensi = sensi;
                      if (id == 1) aimMerahOn = on;
                      else if (id == 2) easyDragOn = on;
                      else if (id == 3) smoothAimOn = on;
                      else if (id == 4) aimLegitOn = on;
                      else if (id == 5) sensiActive = on;

                      startInGameAimWatcher();
                      String script = buildFullFFSystemScript(id == 1 && on);
                      executeShizukuClean(script, name + (on ? " Aktif di Sistem FF!" : " Nonaktif"));
                  }

                  @JavascriptInterface
                  public void injectAllMax() {
                      aimMerahOn = true;
                      easyDragOn = true;
                      smoothAimOn = true;
                      aimLegitOn = true;
                      sensiActive = true;
                      cleanLeftoverGraphicHooks();
                      startInGameAimWatcher();
                      executeShizukuClean(buildFullFFSystemScript(true), "Semua Modul Aim Headshot & Layar Licin Terinjeksi ke FF!");
                  }

                  @JavascriptInterface
                  public void resetDefault() {
                      autoWatcherRunning = false;
                      cleanLeftoverGraphicHooks();
                      String resetCmd =
                          "device_config delete input_native_boot velocitytracker_strategy >/dev/null 2>&1\n" +
                          "device_config delete input_native_boot resample_touch >/dev/null 2>&1\n" +
                          "settings put system pointer_speed 0 >/dev/null 2>&1\n" +
                          "settings delete secure touch_slop >/dev/null 2>&1\n" +
                          "settings put secure long_press_timeout 400 >/dev/null 2>&1\n" +
                          "settings put secure multi_press_timeout 300 >/dev/null 2>&1\n" +
                          "settings put global window_animation_scale 1.0 >/dev/null 2>&1\n" +
                          "settings put global transition_animation_scale 1.0 >/dev/null 2>&1\n" +
                          "settings put global animator_duration_scale 1.0 >/dev/null 2>&1\n" +
                          "cmd thermalservice reset >/dev/null 2>&1\n" +
                          "cmd power set-fixed-performance-mode-enabled false >/dev/null 2>&1\n";
                      executeShizukuClean(resetCmd, "Semua Pengaturan Dikembalikan ke Standar");
                  }

                  @JavascriptInterface
                  public void toast(String msg) {
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_SHORT).show());
                  }

                  @JavascriptInterface
                  public void launchFreeFire() {
                      runOnUiThread(() -> {
                          cleanLeftoverGraphicHooks();
                          startInGameAimWatcher();
                          PackageManager pm = getPackageManager();
                          Intent i = pm.getLaunchIntentForPackage("com.dts.freefireth");
                          if (i == null) i = pm.getLaunchIntentForPackage("com.dts.freefiremax");
                          if (i != null) {
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(i);
                              // Tunggu 4 detik hingga mesin UnityMain Free Fire terbuka, lalu suntikkan prioritas & pelicin layar!
                              mainHandler.postDelayed(() -> {
                                  executeShizukuClean(
                                      buildFullFFSystemScript(false),
                                      "Aim Headshot & Sensi Super Licin Aktif di In-Game!"
                                  );
                              }, 4000);
                          } else {
                              Toast.makeText(MainActivity.this, "Silakan buka aplikasi Free Fire", Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }
          }
          EOF

          # Antarmuka V16: Bersih, Tanpa Grafik MC, Fokus Penuh pada Aim Headshot & Pelicin Layar + Admin Key
          cat << 'EOF' > clean_apk/app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
          <style>
            :root {
              --bg: #0B0E14;
              --card: #131822;
              --card-2: #1A212E;
              --border: #263042;
              --accent: #00E5FF;
              --accent-glow: rgba(0, 229, 255, 0.22);
              --green: #00E676;
              --text: #F0F6FC;
              --muted: #8B949E;
              --danger: #FF3B30;
            }
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, Roboto, sans-serif; user-select: none; }
            body { background: var(--bg); color: var(--text); padding: 14px; padding-bottom: 88px; }
            .hidden { display: none !important; }

            /* LOGIN GATE */
            .login-wrap { position: fixed; inset: 0; background: var(--bg); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 18px; }
            .login-box { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
            .brand-title { font-size: 20px; font-weight: 900; letter-spacing: 0.5px; }
            .brand-title span { color: var(--accent); }
            .brand-sub { font-size: 11px; color: var(--muted); margin: 4px 0 16px; }
            .box-inner { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
            .row-sb { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 8px; }
            .pill { font-size: 11px; padding: 3px 9px; border-radius: 20px; background: #331B1B; color: var(--danger); font-weight: 700; }
            .pill.ok { background: #103321; color: var(--green); }
            .inp { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; color: #fff; padding: 12px; font-size: 13px; margin-bottom: 12px; outline: none; }
            .btn-main { width: 100%; background: var(--accent); color: #04141C; border: none; border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 900; box-shadow: 0 0 18px var(--accent-glow); cursor: pointer; }
            .btn-dark { width: 100%; background: var(--card-2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 12px; font-weight: 700; cursor: pointer; }

            /* HEADER */
            .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
            .btn-rst { background: #26161B; color: #FF6B6B; border: 1px solid #4A222A; padding: 7px 11px; border-radius: 8px; font-size: 11px; font-weight: 700; }

            /* STATUS BANNER */
            .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
            .st-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
            .st-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
            .st-val { font-size: 13px; font-weight: 800; color: var(--green); margin-top: 3px; }

            /* SENSITIVITAS PELICIN LAYAR CARD */
            .sensi-card { background: linear-gradient(145deg, #151E2E, #111622); border: 1.5px solid var(--accent); border-radius: 14px; padding: 14px; margin-bottom: 14px; box-shadow: 0 0 16px var(--accent-glow); }
            .sensi-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
            .sensi-title { font-size: 15px; font-weight: 900; color: var(--accent); }
            .sensi-desc { font-size: 11px; color: var(--muted); margin-bottom: 12px; line-height: 1.35; }
            .range-styled { -webkit-appearance: none; width: 100%; height: 7px; border-radius: 4px; background: #263042; outline: none; margin-bottom: 10px; }
            .range-styled::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: 0 0 10px var(--accent); cursor: pointer; }
            .ticks-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-weight: 700; }
            .ticks-row span.active { color: var(--accent); font-weight: 900; }

            /* AIM MODULE CARDS */
            .sec-title { font-size: 11px; color: var(--muted); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
            .aim-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; transition: 0.15s; }
            .aim-card.on { border-color: #235C42; background: linear-gradient(145deg, #131822 60%, #0F261D 100%); }
            .aim-title { font-size: 14px; font-weight: 800; margin-bottom: 3px; }
            .aim-sub { font-size: 11px; color: var(--muted); line-height: 1.3; padding-right: 10px; }

            /* SWITCH */
            .sw { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
            .sw input { opacity: 0; width: 0; height: 0; }
            .sl { position: absolute; inset: 0; background: #263042; border-radius: 24px; transition: .2s; }
            .sl:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #8B949E; border-radius: 50%; transition: .2s; }
            input:checked + .sl { background: var(--green); }
            input:checked + .sl:before { transform: translateX(20px); background: #041F11; }

            /* ACTION BUTTONS */
            .btn-row { display: flex; gap: 10px; margin-top: 6px; margin-bottom: 14px; }
            .btn-inject { flex: 1; background: var(--card-2); color: var(--accent); border: 1px solid var(--accent); border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 800; cursor: pointer; }

            /* ADMIN KEY PANEL */
            .dev-panel { background: var(--card); border: 1px solid var(--accent); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
            .key-item { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
            .sm-btn { background: var(--card-2); color: #fff; border: 1px solid var(--border); padding: 5px 8px; border-radius: 6px; font-size: 10px; margin-left: 4px; }
            .sm-btn.stop { background: #5a1818; border-color: var(--danger); }

            /* BOTTOM NAV */
            .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 90; }
            .nav-it { font-size: 12px; color: var(--muted); font-weight: 700; padding: 8px 12px; cursor: pointer; }
            .nav-it.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
          </style>
          </head>
          <body>

            <!-- GERBANG AWAL SHIZUKU & LISENSI 1 KEY 1 DEVICE -->
            <div class="login-wrap" id="login-screen">
              <div class="login-box">
                <div class="brand-title">DANZ<span>STRAIGHT</span></div>
                <div class="brand-sub">Pure Aim Headshot & Slippery Sensi v16.0</div>

                <div class="box-inner">
                  <div class="row-sb">
                    <span>Status Shizuku ADB</span>
                    <span class="pill" id="shz-pill">Belum Terhubung</span>
                  </div>
                  <button class="btn-dark" onclick="AndroidBridge.connectShizuku()">Hubungkan Shizuku</button>
                </div>

                <div class="box-inner">
                  <div class="row-sb" style="margin:0">
                    <span>ID Perangkat: <b id="hwid-label">...</b></span>
                    <button class="sm-btn" onclick="AndroidBridge.copyText(myHwid)">Salin</button>
                  </div>
                </div>

                <input type="text" class="inp" id="key-input" placeholder="Masukkan License Key (1 Key 1 Device)">
                <button class="btn-main" onclick="verifyKey()">Masuk Aplikasi</button>
              </div>
            </div>

            <!-- HEADER -->
            <div class="header">
              <div>
                <div class="brand-title">DANZ<span>STRAIGHT</span></div>
                <div style="font-size:11px;color:var(--muted)">Direct Free Fire Aim & Touch Injector</div>
              </div>
              <button class="btn-rst" onclick="AndroidBridge.resetDefault()">Reset Standar</button>
            </div>

            <div class="status-grid">
              <div class="st-card">
                <div class="st-lbl">Target Sistem</div>
                <div class="st-val">Free Fire / FF MAX</div>
              </div>
              <div class="st-card">
                <div class="st-lbl">Status Injeksi</div>
                <div class="st-val" id="st-txt">Auto-Hook Aktif</div>
              </div>
            </div>

            <!-- 1. FITUR UTAMA: SENSITIVITAS PELICIN LAYAR IN-GAME -->
            <div class="sensi-card">
              <div class="sensi-head">
                <span class="sensi-title">Sensivity Pelicin Layar FF</span>
                <label class="sw"><input type="checkbox" id="sw-5" checked onchange="trigMod(5,'Sensivity Pelicin')"><span class="sl"></span></label>
              </div>
              <div class="sensi-desc">
                Mematikan jeda interpolasi sentuhan (<i>resample_touch 0</i>) & membuka sensitivitas XArena 100% agar geser layar sedikit saja langsung licin di dalam game.
              </div>
              <div class="row-sb" style="margin-bottom:8px">
                <span style="font-size:12px;font-weight:700">Tingkat Kelicinan Geser:</span>
                <b style="font-size:13px;color:var(--accent)" id="sensi-txt">Level 7 (Super Licin)</b>
              </div>
              <input type="range" min="1" max="7" step="1" value="7" class="range-styled" id="sensi-slider" oninput="onSensiSlide(this.value)" onchange="onSensiChange(this.value)">
              <div class="ticks-row">
                <span>Lv.1 (Ringan)</span>
                <span>Lv.4 (Cepat)</span>
                <span class="active">Lv.7 (Geser Sedikit Licin)</span>
              </div>
            </div>

            <!-- 2. MODUL AIM HEADSHOT SISTEM FREE FIRE -->
            <div class="sec-title">MODUL AIM SISTEM FREE FIRE</div>

            <div class="aim-card on" id="card-1">
              <div>
                <div class="aim-title">Aim Merah (Drag HS)</div>
                <div class="aim-sub">Impulse Velocity Tracker + kompilasi cepat sistem senjata Free Fire agar tarikan ke atas langsung mengarah ke kepala</div>
              </div>
              <label class="sw"><input type="checkbox" id="sw-1" checked onchange="trigMod(1,'Aim Merah (Drag HS)')"><span class="sl"></span></label>
            </div>

            <div class="aim-card on" id="card-2">
              <div>
                <div class="aim-title">Easy Drag (Anti Nyangkut Dada)</div>
                <div class="aim-sub">Hapus deadzone sentuhan (Touch Slop 0px) & pangkas jeda tahan tombol tembak ke 55ms</div>
              </div>
              <label class="sw"><input type="checkbox" id="sw-2" checked onchange="trigMod(2,'Easy Drag')"><span class="sl"></span></label>
            </div>

            <div class="aim-card on" id="card-3">
              <div>
                <div class="aim-title">Smooth Aim (120Hz & Zero Delay)</div>
                <div class="aim-sub">Buka kunci FPS XArena + matikan frame backpressure agar bidikan tidak patah-patah saat war jarak dekat</div>
              </div>
              <label class="sw"><input type="checkbox" id="sw-3" checked onchange="trigMod(3,'Smooth Aim')"><span class="sl"></span></label>
            </div>

            <div class="aim-card on" id="card-4">
              <div>
                <div class="aim-title">Aim Legit (Lock Thread UnityMain)</div>
                <div class="aim-sub">Suntikkan prioritas Real-Time (-20) langsung ke seluruh sub-thread proses Free Fire setiap 5 detik</div>
              </div>
              <label class="sw"><input type="checkbox" id="sw-4" checked onchange="trigMod(4,'Aim Legit')"><span class="sl"></span></label>
            </div>

            <!-- PANEL DEVELOPER KEY (MUNCUL SAAT LOGIN PAKAI DANZ-DEV-999) -->
            <div class="dev-panel hidden" id="dev-panel">
              <div class="row-sb" style="margin-bottom:10px">
                <b style="color:var(--accent);font-size:13px">Developer Key Manager</b>
                <span style="font-size:11px;color:var(--muted)">1 Key = 1 Device</span>
              </div>
              <div style="display:flex;gap:6px;margin-bottom:8px">
                <input type="text" class="inp" id="custom-key" placeholder="Nama Key (Kosong = Acak)" style="margin:0">
                <button class="btn-main" style="width:auto;padding:0 14px" onclick="createNewKey()">Buat Key</button>
              </div>
              <input type="text" class="inp" id="target-hwid" placeholder="Opsional: Kunci ke ID Perangkat" style="margin:0">
              <div id="key-list"></div>
            </div>

            <div class="btn-row">
              <button class="btn-inject" onclick="AndroidBridge.injectAllMax()">Simpan & Injeksi Semua</button>
            </div>

            <button class="btn-main" onclick="AndroidBridge.launchFreeFire()">Buka Free Fire Sekarang</button>

            <div class="bottom-nav">
              <div class="nav-it active" onclick="window.scrollTo(0,0)">Aim & Sensi</div>
              <div class="nav-it hidden" id="nav-dev" onclick="document.getElementById('dev-panel').classList.toggle('hidden')">Panel Key</div>
              <div class="nav-it" onclick="AndroidBridge.injectAllMax()">Simpan</div>
              <div class="nav-it" onclick="AndroidBridge.launchFreeFire()">Main FF</div>
            </div>

            <script>
              const DEV_KEY = "DANZ-DEV-999";
              let myHwid = window.AndroidBridge ? AndroidBridge.getHwid() : "HWID-01";
              let shizukuOk = false;

              document.getElementById('hwid-label').innerText = myHwid;

              function setShizukuStatus(ok) {
                shizukuOk = ok;
                const p = document.getElementById('shz-pill');
                if (ok) { p.innerText = "Terhubung"; p.classList.add('ok'); }
              }

              function trigMod(id, name) {
                const sw = document.getElementById('sw-' + id);
                const card = document.getElementById('card-' + id);
                if (card) card.classList.toggle('on', sw.checked);
                const s = parseInt(document.getElementById('sensi-slider').value);
                document.getElementById('st-txt').innerText = name + (sw.checked ? " : Aktif" : " : Nonaktif");
                AndroidBridge.updateModule(id, name, sw.checked, s);
              }

              function onSensiSlide(val) {
                document.getElementById('sensi-txt').innerText = 'Level ' + val + (val == 7 ? ' (Super Licin)' : '');
              }

              function onSensiChange(val) {
                onSensiSlide(val);
                document.getElementById('sw-5').checked = true;
                AndroidBridge.updateModule(5, 'Sensivity Licin Lv.' + val, true, parseInt(val));
              }

              function getKeys() {
                const r = localStorage.getItem('danz_v16_keys');
                if (!r) {
                  const d = [{ key: "DANZ-VIP-001", hwid: "", status: "AKTIF" }];
                  localStorage.setItem('danz_v16_keys', JSON.stringify(d));
                  return d;
                }
                return JSON.parse(r);
              }

              function saveKeys(list) {
                localStorage.setItem('danz_v16_keys', JSON.stringify(list));
                renderKeyList();
              }

              function verifyKey() {
                if (!shizukuOk) {
                  AndroidBridge.toast("Hubungkan & izinkan Shizuku terlebih dahulu");
                  AndroidBridge.connectShizuku();
                  return;
                }
                const k = document.getElementById('key-input').value.trim().toUpperCase();
                if (!k) { AndroidBridge.toast("Masukkan kode lisensi"); return; }

                if (k === DEV_KEY) {
                  document.getElementById('login-screen').classList.add('hidden');
                  document.getElementById('dev-panel').classList.remove('hidden');
                  document.getElementById('nav-dev').classList.remove('hidden');
                  renderKeyList();
                  return;
                }

                let list = getKeys();
                let item = list.find(x => x.key === k);
                if (!item && k.startsWith("DANZ-KEY-")) {
                  item = { key: k, hwid: myHwid, status: "AKTIF" };
                  list.push(item);
                }
                if (!item) { AndroidBridge.toast("Key tidak terdaftar"); return; }
                if (item.status !== "AKTIF") { AndroidBridge.toast("Key telah diberhentikan oleh Developer"); return; }
                if (item.hwid && item.hwid !== "" && item.hwid !== myHwid) {
                  AndroidBridge.toast("Key sudah terikat di perangkat lain (1 Key 1 HP)");
                  return;
                }
                item.hwid = myHwid;
                saveKeys(list);
                document.getElementById('login-screen').classList.add('hidden');
              }

              function createNewKey() {
                let c = document.getElementById('custom-key').value.trim().toUpperCase();
                let h = document.getElementById('target-hwid').value.trim().toUpperCase();
                let r = Math.random().toString(36).substring(2, 6).toUpperCase();
                let k = c ? c : ("DANZ-KEY-" + r);
                let list = getKeys();
                list.unshift({ key: k, hwid: h, status: "AKTIF" });
                saveKeys(list);
                document.getElementById('custom-key').value = "";
                AndroidBridge.copyText(k);
              }

              function toggleKeyStatus(k) {
                let list = getKeys();
                let it = list.find(x => x.key === k);
                if (it) { it.status = (it.status === "AKTIF") ? "STOP" : "AKTIF"; saveKeys(list); }
              }

              function renderKeyList() {
                document.getElementById('key-list').innerHTML = getKeys().map(x => `
                  <div class="key-item">
                    <div><b>${x.key}</b><div style="color:var(--muted)">HP: ${x.hwid || 'Free'} | ${x.status}</div></div>
                    <div>
                      <button class="sm-btn" onclick="AndroidBridge.copyText('${x.key}')">Salin</button>
                      <button class="sm-btn stop" onclick="toggleKeyStatus('${x.key}')">${x.status === 'AKTIF' ? 'Stop Key' : 'Aktifkan'}</button>
                    </div>
                  </div>
                `).join('');
              }
            </script>
          </body>
          </html>
          EOF

          echo "sdk.dir=$ANDROID_HOME" > clean_apk/local.properties
          cd clean_apk && gradle assembleDebug --no-daemon

      - name: Upload DANZSTRAIGHT V16 APK
        uses: actions/upload-artifact@v4
        with:
          name: DANZSTRAIGHT-V16-PURE-AIM-SENSI
          path: clean_apk/app/build/outputs/apk/debug/*.apk
